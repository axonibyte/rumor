# The two actions the fake adapter's default surface records.
[[action]]
name = "create_event"
context = "api"
emits = ["event.created"]
requires = ["may_create_event"]
creates = ["event"]

  # ALL FOUR SOURCES IN ONE ACTION, so the verb drives the whole composition
  # and not one branch of it. The fake adapter ignores `args`, which is the
  # point here: this fixture is about the ENGINE building them, and the arms in
  # tests/wire read what reaches the wire.
  [[action.args]]
  name = "name"
  source = "actor"             # the step's own actor, consuming no draw
  [[action.args]]
  name = "title"
  source = "literal"
  value = "Standup"
  [[action.args]]
  name = "capacity"
  source = "draw"
  from = [1, 2, 5]
  [[action.args]]
  name = "visible_to"
  source = "draw"              # role SUBSETS, which is what the claim carries
  from = [["member"], ["member", "admin"]]

[[action]]
name = "join_event"
context = "api"
emits = ["event.joined"]
requires = ["may_join"]
touches = ["store"]

  # A HANDLE ARGUMENT, which is the second way an action names a handle: the
  # engine resolves a bound `event` handle to the id the adapter gave it, so
  # this action is inapplicable until some create_event has bound one. Its
  # precondition says the same thing from the statute's side, and the two
  # agreeing is not redundancy -- one is the world's permission and the other
  # is the walk being able to name what it acts on.
  [[action.args]]
  name = "event"
  source = "handle"
  of = "event"

# THE NAME IS THE FAKE ADAPTER'S OWN, and it has to be. Until R5.5 a declared
# observation was never MADE, so this fixture could name one its adapter does
# not record and nothing noticed; the moment the walk began observing, every
# arm here failed with "event_count is not recorded in this surface; it records
# attendance, event". That is the adapter answering correctly -- a fault is
# could-not-run (docs/contract.md) -- and an inconsistent fixture, not a reason
# to let the walk skip an observation it cannot make.
#
# `attendance` AND `direct`: the fake's default surface records `event` through
# api and `attendance` direct, and a direct observation needs no session, which
# keeps this fixture about the `run` VERB rather than about token routing. The
# statute here declares no `finding` rule, so the finding is UNDEFINED and no
# walk stops on it -- which is what keeps these arms about the verb too.
[[observation]]
name = "attendance"
source = "direct"
of = "event.created"
component = "store"

[[role]]
name = "member"
contexts = ["api"]

[claim.event_created]
timing = "immediate"

[claim.event_joined]
timing = "immediate"
