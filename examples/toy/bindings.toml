# Bindings for the toy system under test (R5.2, issue 73).
#
# THE SURFACE HERE AND cmd/toy-adapter's `describe` CONVICT EACH OTHER, which is
# validate's arms 1 and 2: an action or observation declared here and not served
# is refused, and so is one served and not declared. Both lists are written out
# in full in both places on purpose -- a shared constant would make the two
# agree by construction and the arms vacuous.
#
# DERIVED FROM THIS PACKAGE'S OWN CASES, in both directions, which is the rule
# issue 63 settled: every claim type below is carried by a case in cases/, and
# every role below is a role some case observes as. tests/contract's agreement
# test refuses either half.

[[action]]
# `may_create_user` is one user per actor, which is cmd/toy's own rule: it
# refuses a name already taken. The claim type is carried by honest-count, whose
# observer holds his own `user.created` -- which is what makes the precondition
# FALSE somewhere rather than a rule that is always true.
name = "create_user"
context = "none"
emits = ["user.created"]
requires = ["may_create_user"]
creates = ["user"]
touches = ["store"]
response = { status = 201 }

  # THE NAME IS THE ACTOR'S OWN, and that is the whole reason `actor` is one of
  # the four sources (r5/70, ruled r5/72): cmd/toy keys a session by user NAME,
  # so a session for member_1 exists only if some create_user made a user
  # called member_1. A literal or a draw here would mint users nobody can hold
  # a session as, and the session half of this child would have nothing to key.
  [[action.args]]
  name = "name"
  source = "actor"

[[action]]
# `has_user` IS ON EVERY `api` ACTION BUT create_user, and this is the one place
# the reason is written. cmd/toy keys a session by user NAME, so an actor can
# act in context `api` only after its own `user.created` claim; guest_1 was
# refused outright at step 3 of seed 4242 for having no user (quill, coop
# r5/89), and fable ruled the ledger-expressible form a precondition rather than
# a fault the walk catches (r5/92). The engine then never asks for a session an
# actor cannot hold, and the weights make create_user early by construction
# because nothing else is applicable to a fresh actor.
#
# create_user ITSELF CANNOT CARRY IT: its context is `none`, it is what produces
# the claim, and requiring the claim to make it would be unsatisfiable. The
# browser action does not carry it either -- the ruling is about `api`, and
# `join_event_ui`'s context is `browser`.
name = "create_event"
context = "api"
emits = ["event.created"]
requires = ["may_create_event", "has_user"]
creates = ["event"]
touches = ["store"]
response = { status = 201 }

  # A LITERAL, NOT A DRAW: the title is the one field of this action cmd/toy
  # never reads back and no statute judges, so drawing it would spend the
  # generator on a choice nothing can observe -- and two runs of one seed would
  # still agree, which is the property the draw exists to put at risk.
  [[action.args]]
  name = "title"
  source = "literal"
  value = "Standup"

  # SMALL ON PURPOSE. cmd/toy refuses capacity < 1 (main.go:400), and its
  # capacity RACE is the ledger row a walk is meant to be able to reach: the
  # window between the check and the insert only opens when an event is at or
  # near its limit, so 1 and 2 put the boundary within a few steps where 50
  # would hide it behind arithmetic no walk will do.
  [[action.args]]
  name = "capacity"
  source = "draw"
  from = [1, 2, 3]

  # A LIST OF LISTS, because the claim carries a LIST and the statute reads it
  # (quill r5/80); a bare role name is refused. Every subset names admin so the
  # creator can always see its own event, and guest is present in exactly one:
  # the API visibility leak is about what a GUEST is shown, so the subsets
  # WITHOUT guest are the ones that can expose it and the one with guest is the
  # control that keeps the arm from being true and empty.
  [[action.args]]
  name = "visible_to"
  source = "draw"
  from = [["admin"], ["admin", "member"], ["admin", "member", "guest"]]

[[action]]
# THE PRECONDITION: `may_join` is the ledger-expressible half of what cmd/toy
# enforces -- the actor knows of the
# event and has not already joined. The capacity half is NOT here, because
# capacity is not a ledger fact (see statute.rego) and a `requires` naming a
# rule the ledger cannot support would be a precondition in name only.
name = "join_event"
context = "api"
emits = ["event.joined"]
requires = ["may_join", "has_user"]
touches = ["store"]
response = { status = 200 }

# THIS ACTION CONTENDS, AND IT IS SAID HERE RATHER THAN DERIVED.
#
# `store_event_count` declares `of = "event.joined"` and THREE actions emit
# that claim type -- this one, accept_invitation and join_event_ui. Of those,
# accept_invitation holds its lock across the check and the insert, so a stage
# deriving its subject from the claim type could pick it and report no overfill
# -- exactly what a correct system reports. The claim type cannot stand in for
# the action, so the action says so itself (fable, coop rumor/1525).
#
# `limit` IS READ AND NOT COPIED. It names the argument of the action that
# created the event, and that argument is a DRAW over [1, 2, 3] -- so there is
# no single number to copy even in principle, and a declared value would put
# one fact in two files the way a declared deadline would.
#
# `held` IS THE DECLARED QUERY for what the system holds: the `direct`
# observation whose own comment says an oracle reading the same field could not
# disagree with it.
contended = { limit = "create_event.capacity", held = "store_event_count" }

  # THE HANDLE KIND, never a run's handle: the walk picks WHICH event this
  # actor knows of, and `event` is created by create_event above.
  [[action.args]]
  name = "event"
  source = "handle"
  of = "event"

[[action]]
name = "leave_event"
context = "api"
emits = ["event.left"]
requires = ["may_leave", "has_user"]
touches = ["store"]
response = { status = 200 }

  # THE HANDLE KIND, never a run's handle: the walk picks WHICH event this
  # actor knows of, and `event` is created by create_event above.
  [[action.args]]
  name = "event"
  source = "handle"
  of = "event"

# READING THE ATTENDEE LIST, THE ONE ITEM THIS API WITHHOLDS (R8/111's second
# plant; fable's shape at coop rumor/1682). cmd/toy serves /events/<id>/attendees
# to the event's ADMIN alone and answers 403 to anyone else, and the page renders
# that list to every role the event is visible to -- so this action is the HONEST
# reading of the item the template leaks.
#
# IT EMITS NOTHING, which `emits` being optional is for: a read changes no world
# and claims nothing, so there is no claim type for it to name. It `touches`
# nothing for the same reason, which keeps it out of the rollback arm's way.
#
# ZERO IN [weights.default] AND WEIGHTED IN THE `viewing` PROFILE, which is
# recount_event's construction below read for a second purpose and fable's "the
# action ... declared under [profiles.viewing] alone". No committed row names
# that profile, so no committed walk draws this and every promoted seed draws
# what it drew.
#
# `may_list_attendees` IS THE PRECONDITION AND IT IS LOAD-BEARING: without it the
# walk draws this for every actor in the pool, most of them non-admins, and each
# draw answers 403 against the `status = 200` below -- a response mismatch on
# every other step, which is a finding about this declaration and not about the
# plant.
[[action]]
name = "list_attendees"
context = "api"
requires = ["may_list_attendees"]
response = { status = 200 }

  # THE EVENT WHOSE LIST IS READ, picked from the handles this actor knows, as
  # every other event-shaped action picks it.
  [[action.args]]
  name = "event"
  source = "handle"
  of = "event"

# THE WORKER'S OWN SURFACE (R6.3, issue 91), AND IT IS WEIGHTED ZERO BY DEFAULT.
#
# An actor asks for an event's attendance to be recomputed; cmd/toy enqueues one
# job and answers with the RECOUNT's id. The claim it emits is the eventual type
# below, and the observation of the worker's number names the recount as its
# subject -- which is what keeps both out of the default profile's way.
#
# ZERO IN [weights.default] AND WEIGHTED IN THE `settling` PROFILE, which is
# fable's ruling at coop r6/92: the bug ledger says a row is caught "by the
# stage or feature listed for it" and R6's row says `settling`. Measured before
# it was built (ibis, coop r6/94): a zero-weight action leaves seeds 1, 2 and 40
# drawing line for line identically, so the control is untouched by its
# existence.
[[action]]
name = "recount_event"
context = "api"
emits = ["event.tallied"]
requires = ["has_user"]
# IT CREATES A `recount`, and that is the half that keeps the default profile
# clean. An observation's args resolve against the handles the STEP minted, so
# an observation declaring `event` is makeable on any step that touches one --
# measured at step 2 of seed 2 (coop r6/100) -- and the tally is only a question
# once a recount has been asked for. Nothing else in a run mints this kind.
creates = ["recount"]
touches = ["store"]
response = { status = 200 }

  [[action.args]]
  name = "event"
  source = "handle"
  of = "event"

# THE TWO INVITATION ACTIONS (R7.4, issue 103). An invitation is the first
# thing in this domain that carries an INSTANT, and `[deadline]` at the end of
# this file names where that instant is read.
#
# BOTH ARE WEIGHTED ZERO IN `[weights.default]` AND HAVE NO PROFILE YET, which
# is said here as well as there because a reader of this block will ask: a
# profile that raised them today would manufacture findings, since the walk
# records a claim for an action the SYSTEM REFUSED (ibis, coop r7/64, measured)
# -- and an invitation is refusable three ways cmd/toy owns and the ledger
# cannot see (not yours, already accepted, expired). The profile arrives with
# the row, after that is placed.
[[action]]
name = "invite_user"
context = "api"
emits = ["invitation.sent"]
requires = ["may_invite", "has_user"]
# IT CREATES AN `invitation`, for recount_event's reason one block up: the
# expiry is only a question once an invitation exists, and an observation
# declaring the EVENT handle would be makeable on every step that touched one.
creates = ["invitation"]
touches = ["store"]
response = { status = 201 }

  [[action.args]]
  name = "event"
  source = "handle"
  of = "event"

  # THE INVITEE IS NAMED BY HANDLE, which is how the engine says WHICH user
  # without an id ever crossing the wire: it resolves the handle to cmd/toy's
  # own id at the request. A walk with one user draws itself, and cmd/toy
  # refuses an invitation to a member -- a refusal the ledger cannot see, which
  # is the comment above.
  [[action.args]]
  name = "user"
  source = "handle"
  of = "user"

[[action]]
name = "accept_invitation"
context = "api"
# IT EMITS `event.joined`, THE EXISTING TYPE, because that is what accepting
# DOES: the invitee becomes an attendee and cmd/toy's own count moves with the
# write, exactly as a join does. A type of its own would have left the join
# invisible to `believed` and made the R7 row a disagreement between two
# numbers nobody reads.
emits = ["event.joined"]
requires = ["may_accept", "has_user"]
touches = ["store"]
response = { status = 200 }

  [[action.args]]
  name = "invitation"
  source = "handle"
  of = "invitation"

[[action]]
name = "delete_event"
context = "api"
emits = ["event.deleted"]
requires = ["may_delete", "has_user"]
touches = ["store"]
response = { status = 200 }

  # THE HANDLE KIND, never a run's handle: the walk picks WHICH event this
  # actor knows of, and `event` is created by create_event above.
  [[action.args]]
  name = "event"
  source = "handle"
  of = "event"

# A BROWSER-STAGE ACTION WITH ITS FLOW, so arms 4 and 5 EVALUATE rather than
# skipping: both are vacuous unless stages.browser.enabled is true, and arm 4
# reads the flow. The page it drives is cmd/toy's /ui/events/<id>, which is
# plain HTML with no script -- R9 drives it with a real browser.
#
# THE CONTEXT IS LITERALLY "browser" because internal/validate's isBrowser tests
# for that string, and a second spelling would make both arms skip while looking
# correct. AS OF vocabulary v4 THERE IS NO SECOND SPELLING: the source this page
# is observed through was called `ui` until R8.4 renamed it `browser`, so the
# stage, the context and the source are now one word and this hazard is history
# rather than a live trap (fable, coop rumor/1602).
[[action]]
name = "join_event_ui"
context = "browser"
emits = ["event.joined"]
requires = ["may_join"]
touches = ["store"]
# THE LAST ACTION IN THIS PROJECT TO DECLARE ITS RESPONSE, and it was the only
# one left blind after R7.4 made the declaration load-bearing: a refused action
# appends no claim, and the comparison is against what this key says. Measured:
# ratchet found seed 12 refusing one join at 409 inside the control (coop
# r7/66), and with every other action declared the five control seeds did not
# move -- because the refusal ratchet saw is on THIS action, which declared
# nothing to compare against.
#
# 200 BECAUSE IT IS THE SAME HANDLER. /ui/events/<id>/join dispatches to
# cmd/toy's joinEvent, so this route answers exactly what the api action does,
# capacity 409 included. R9 drives this page with a real browser and what a
# "response" means for a browser step is that phase's question; today the
# adapter answers the status, and this says so rather than leaving the one
# action whose refusals nothing can see.
response = { status = 200 }

  # THE SAME EVENT HANDLE THE API ACTION TAKES, and the flow's `{event}`
  # placeholder below names the same kind: the browser action reaches the same
  # entity by a different context, which is what makes arm 5's "a browser
  # action that could reach the api" question answerable at all.
  [[action.args]]
  name = "event"
  source = "handle"
  of = "event"

  [[action.flow]]
  step = "navigate"
  to = "/ui/events/{event}"

  [[action.flow]]
  step = "click"
  target = "join"

  [[action.flow]]
  step = "wait"
  until = "count-changed"

# NO `list_events` OBSERVATION, AND THE REASON IS THE AGREEMENT TEST. The toy
# serves GET /events and the API visibility leak lives in what a caller is shown
# -- but an observation of a LIST is a value this statute cannot judge: v1's
# findings are value agreement, and comparing a list of events to an attendance
# count is a second kind of judgement. So the leak is planted where the cases
# observe, in the count, and the list stays an HTTP route that no observation
# declares until R9 or R18 needs one. tests/contract refuses a declared
# observation no case carries, which is what would otherwise hide this.

[[observation]]
# `args` IS CONTRACT 2's ROW (docs/contract.md Revisions, 2026-10-19): a count is
# of ONE event, and before this an observation had nowhere to say which. The
# engine composes the request from these names and the handle table, resolving
# each handle to the toy's own id; `query` is the observation's name alone.
name = "event_count"
source = "api"
of = "event.joined"
args = ["event"]

# source = "direct" is what makes `component` required, and the component is
# what platform.toml's [[rollback]].covers has to cover -- validate's arm 6.
# This is the SECOND ORACLE behind the API's count: cmd/toy computes it from the
# attendee list where the API reports a denormalized counter, and an oracle that
# read the same field could not disagree with it.
# THE EXPIRY, AND ITS VALUE IS AN INSTANT RATHER THAN A COUNT (R7.4). This is
# the observation `[deadline].instants` names: the engine reads WHEN this
# invitation stops being honored, in nanoseconds from the run's epoch, and the
# number is the system's own -- cmd/toy computes it from its clock when the
# invitation is made and enforces it on accept. Nothing here declares a
# lifetime; a declared one would be a second copy of a number the application
# already holds (docs/contract.md's `[deadline]` row).
#
# `args = ["invitation"]` IS LOAD-BEARING TWICE, which is recount's argument
# again: it names the entity invite_user creates, so the observation is
# unmakeable until that action is drawn (an unresolved arg is a SKIP, not a
# refusal), and that is why this block existing leaves the control seeds where
# they were.
[[observation]]
name = "invitation_expiry"
source = "api"
of = "invitation.sent"
args = ["invitation"]

# THE ALLOWANCE, TWO READINGS OF ONE SUBJECT (R7.5 D4). Both are of the
# OBSERVING ACTOR's own allowance and neither declares `args`: an observation
# carries the actor that makes it, and there is no handle for an actor's own id
# -- so a declaration naming one could only ask about somebody else. The
# precedent is the probe queries, whose "NO SUBJECT ... IS NOT AN OMISSION" is
# cmd/toy-adapter's own comment.
#
# `of` IS invitation.sent, THE CLAIM TYPE THE ALLOWANCE IS SPENT ON, which is
# the same reason invitation_expiry declares it: these are not counts OF that
# type, they are readings about it, and the statute excludes them from the
# join-count judgement by name beside its own clause.
#
# TWO AND NOT ONE, BECAUSE THEY FAIL DIFFERENTLY. `invite_quota_reset` is the
# local clock face of the application's next reset, wrong on BOTH transition
# days -- 01:00 in spring, 23:00 in fall, where a daily reset means 00:00.
# `invite_quota_day` is the local date it is anchored on, wrong only in the
# spring window, and it is the one a rule compares against the ENGINE's
# `input.clock.local.date`: one oracle is the application's arithmetic and the
# other is the two zones agreeing.
[[observation]]
name = "invite_quota_reset"
source = "api"
of = "invitation.sent"

[[observation]]
name = "invite_quota_day"
source = "api"
of = "invitation.sent"

# AND THE SAME RESET AS AN INSTANT (R7.5 D4c), which is the reading a WALK
# needs rather than a rule. `[deadline].instants` below names it, so the engine
# targets it with `advance` and lands one tick before it, on it, and one tick
# past it -- and those three landings are where the planted arithmetic and the
# zone's own midnight disagree:
#
#   SPRING, where the reset lands an hour LATE, the window is
#   [true midnight, declared reset) and the discriminating landing is the one
#   ONE TICK BEFORE -- the allowance still spent, the anchor still yesterday.
#
#   FALL, where it lands an hour EARLY, the window is
#   [declared reset, true midnight) and the discriminating landings are the one
#   ON the instant and the one ONE TICK PAST -- the allowance fresh while the
#   day it belongs to is still running.
#
# ibis's correction at coop r7/119, accepted by fable at /120: a cell written
# from "the tick before" alone arms SPRING only, so each direction names its
# own landing.
[[observation]]
name = "invite_quota_reset_at"
source = "api"
of = "invitation.sent"

[[observation]]
name = "store_event_count"
source = "direct"
of = "event.joined"
args = ["event"]
component = "store"

# AND THE PAGE'S OWN COUNT, THROUGH `browser` (R8/111). The same subject as
# event_count above and a different ORACLE: that one asks the API, this one
# reads the number the application RENDERS to a reader. The two disagree
# exactly when the page's own figure is stale, which is the row this statute
# already carries a `bug` for -- so a reading that agrees is the control and a
# reading that differs is the finding.
#
# `of` IS event.joined, THE SAME CLAIM TYPE, because the question is the same
# one: how many joins the observer believes. The channel is what changed.
[[observation]]
name = "page_count"
source = "browser"
of = "event.joined"
args = ["event"]

# AND WHO THE PAGE SAYS IS COMING, which is the reader for the second UI-only
# plant (fable's shape at coop rumor/1682). The API serves the attendee list to
# the event's ADMIN alone -- /events/<id>/attendees answers 403 to anyone else --
# and the template renders it to every role the event is visible to, so a reader
# is the only party who can be shown an item the API withholds.
#
# THE VALUE IS A COUNT AND NOT THE NAMES, and the reason is the statute's rather
# than brevity: the finding is that a non-admin was SHOWN the list at all, so the
# names add nothing a rule reads and would put other actors' ids in every report
# this observation appears in.
#
# `of` IS event.joined, as page_count's is: the list is made of joins, and the
# claim type is what the walk resolves `args` against.
[[observation]]
name = "page_attendees"
source = "browser"
of = "event.joined"
args = ["event"]

# THE WORKER'S COUNT, OBSERVED BY ITS OWN QUERY AND ABOUT ITS OWN SUBJECT.
#
# `args = ["recount"]` is load-bearing twice over: it names the entity
# recount_event creates, so the observation is unmakeable until that action is
# drawn (an unresolved arg is a SKIP, not a refusal), and it is the reason the
# three control seeds are unmoved by this block existing.
#
# IT IS DECLARED LAST, and the order matters for the same reason the R5 pair's
# does: a step's observations are judged in declaration order and the first
# finding that stops a walk ends it, so R5's two are reached first and this one
# cannot get in front of them.
[[observation]]
name = "event_tally"
source = "api"
of = "event.tallied"
args = ["recount"]

# THE QUIESCE PROBES (R6.2's typed table, R6.3's first real use).
#
# TWO KINDS AND QUIET IS THEIR CONJUNCTION, which is the point of declaring more
# than one: the depth can reach zero in the instant between the worker taking a
# job and finishing it, so depth alone can read quiet while work is in hand.
# `worker_idle` is the toy's own answer to "is there anything outstanding", and
# both must agree before a run judges (fable, coop breakout-r6/0).
#
# THE TIMEOUTS ARE SMALL BECAUSE THE WORK IS SMALL: one recount is a map lookup
# and a file write, measured at 2.0ms median and 24.2ms worst over 30 requests
# on this box. 2s is ~80x that worst, so an expiry is a STALL and not a slow
# drain -- the distinction the budget in cmd/toy-adapter records for itself.
[quiesce]

  [[quiesce.probe]]
  kind = "queue_depth"
  timeout = "2s"
  every = "5ms"
  quiet = 0

  [[quiesce.probe]]
  kind = "worker_idle"
  timeout = "2s"
  every = "5ms"
  quiet = true

[claim."user.created"]
timing = "immediate"

[claim."event.created"]
timing = "immediate"

# `event.joined` IS IMMEDIATE AND MUST STAY SO. It was eventual for one
# afternoon and fable ruled it back at coop r6/82: "an eventual count does not
# re-label the R5 rows, and the baseline does not move to fit the child". Both
# count observations declare `of = "event.joined"`, so a bound here is a bound
# over the number R5 planted its rows in -- and with it, seed 40's R5 finding
# read as engine.stale at step 4 behind a delete instead of bug at step 3. The
# child had not found the R5 row late; it had lost it and found an R6 row in its
# place, where the ledger needs both.
#
# THE EVENTUAL TYPE IS THE WORKER'S OWN, BELOW.
[claim."event.joined"]
timing = "immediate"

# THE WORKER'S OWN COUNT IS THE EVENTUAL TYPE (R6.3, issue 91).
#
# cmd/toy maintains TWO numbers: the API's count, which the write that changes
# it updates, and the worker's tally, which a queued job applies as a DELTA when
# a read advances the queue. A reader asking straight after a recount sees the
# old tally -- docs/vocabulary.md reads that as a `pending` on an eventual type
# rather than a defect, and it is the whole reason 90's probes came first.
#
# THE BOUND IS `quiesce` AND NOT A DURATION: the question is whether the system
# has settled, not how long ago the claim was made. It was ALSO true until R7.2
# that a duration bound here would have been refused for want of clock control;
# this project declares `[clock]` at the end of this file now, so that is no
# longer the reason. The reason that remains is the one above and fable's at
# coop r6/82, and it does not depend on the clock.
#
# AND IT IS THIS TYPE AND NOT `event.joined`, which fable ruled at coop r6/82:
# a bound over the number R5 planted its rows in turns seed 40's R5 finding into
# an R6 one, losing a row the ledger needs rather than finding it late.
[claim."event.tallied"]
timing = "eventual"
bound = "quiesce"

# `invitation.sent` IS IMMEDIATE, and the deadline does not make it eventual.
# An eventual type is one whose claim SETTLES later (docs/vocabulary.md); an
# invitation is sent at once and its truth is immediate. What arrives later is
# its EXPIRY, which is a fact about the world's clock and not about when this
# claim becomes true -- and a `bound` here would ask the engine to hold the
# claim open until a duration passed, which is a different thing entirely and
# would put every invitation in `pending`.
[claim."invitation.sent"]
timing = "immediate"

# `event.left` STAYS IMMEDIATE, and the asymmetry is deliberate rather than an
# oversight. A leave enqueues a recount too, so its lag is real -- but no
# observation declares `of = "event.left"`, so no check is judged against it and
# making it eventual would declare a bound nothing evaluates. That is arm 7b's
# refusal waiting to happen: a bound naming a condition no observation reaches.
[claim."event.left"]
timing = "immediate"

[claim."event.deleted"]
timing = "immediate"

# THE ROLES, each carried by a case: member by honest-count, guest by
# untold-join and visibility-leak, admin by the other three.
#
# THE FIRST THREE HOLD `api` AND ONLY `viewer` HOLDS `browser`, which is arm
# 5's doing and is worth saying rather than leaving as an omission: that arm
# refuses a role holding a browser context that can ALSO reach non-browser
# actions, so a browser role is browser-ONLY or it is refused.
#
# THIS COMMENT SAID THE BROWSER ROLE WAS R9'S UNTIL R8.4, and its two reasons
# were right and both are now discharged rather than waived. "It would trip arm
# 5": `viewer` holds nothing but `browser`, so it reaches only `join_event_ui`.
# "It would name a role no case carries, and the agreement test refuses that":
# cases/viewer-reads-the-page.json carries it, which is the same commit's work
# -- the role and the case that justifies it do not arrive separately.
[[role]]
name = "admin"
contexts = ["api"]

[[role]]
name = "member"
contexts = ["api"]

[[role]]
name = "guest"
contexts = ["api"]

# THE READER, holding the browser context and nothing else. It ACTS only
# through `join_event_ui` and its purpose is to OBSERVE: `page_count` above is
# read through this role's own session, and walk.go asks sessions.Token(actor,
# "browser") for it -- an actor with no browser session "observes nothing
# through it" and returns neither a finding nor a fault, which is why the role
# is what makes that observation occur at all rather than a declaration nothing
# reaches.
[[role]]
name = "viewer"
contexts = ["browser"]

# THE RUN CONTROLS THIS PROJECT'S CLOCK, and the table being here is what says
# so: `rumor` may hold a clock only where the project declares one, and
# internal/ledger refuses a clock fact outright without it ("wall-clock time
# never enters the ledger").
#
# `adapter` AND NOT `faked`, because it is the truth about this project rather
# than the quieter option. cmd/toy-adapter implements the `clock` request: the
# engine SETS the toy's own clock at every seal and writes the ledger's fact
# from what the toy answered. `faked` would claim the toy is already running
# under faked time, which it is not, and would send no request -- so the one
# project in this repository that can drive the request end to end would stop
# driving it.
#
# WHAT THIS MOVES, which fable ruled on at coop rumor/1315 before I wrote it:
# a clocked run writes a clock fact at every seal, so every position after the
# first shifts and this project's PRINTED output moves for any seed that prints
# one. The byte control that protects is `tools/d4control.py`'s, and its
# subject is examples/toy FROZEN AT 93084b0 -- the digests keep their values
# for the rest of R7 because the subject does not move, not because the live
# toy stayed unclocked. What must still hold at every head is the five fields
# of rumor/1039 against the live toy: what HAPPENED does not move.
[clock]
form = "adapter"

# THE ZONE THIS PROJECT'S INSTANTS ARE READ IN (R7.5 D1, issue 115: "an IANA
# zone name, America/Chicago on the toy").
#
# WHAT IT CHANGES FOR THE ENGINE: the next daylight-saving transition between
# the run's clock and the furthest live bound joins the landings a step may
# draw, and a statute gains `input.clock.local` -- the run's instant read HERE,
# as a date, an offset and a DST flag.
#
# AND WHAT IT DOES NOT CHANGE, measured rather than promised: the five rows of
# seeds.lock draw byte-identical runs with and without this line. A transition
# joins the landings only when one falls between the clock and the furthest
# bound, and a profile that declares no `clock_start` runs near the epoch with
# bounds seconds wide -- so the nearest transition is decades outside the range
# and nothing joins. The profiles this line is FOR are the two that place their
# clock inside the day before a transition.
#
# IT IS NOT THE SYSTEM'S CONFIGURATION. cmd/toy reads its own instants in the
# zone its `-zone` flag names, and the adapter passes TOY_ZONE (fable, coop
# r7/114). The two agreeing is what a run can check; declaring one here does
# not configure the other.
zone = "America/Chicago"

# WHERE THIS PROJECT'S DEADLINES ARE READ (R7.4, fable r7/42 ruling 2).
#
# Each name is an OBSERVATION whose value IS an instant in nanoseconds from the
# run's epoch -- `invitation_expiry`, declared above, which answers when one
# invitation stops being honored. The walk extends `advance`'s targets to these
# beside the live pending bounds, so a seeded run can land exactly on a
# deadline instead of near it.
#
# AN OBSERVATION AND NOT A LIFETIME, which is the choice docs/contract.md's row
# argues and this is the first project to make: `invitation = "30s"` here would
# be a second copy of a number cmd/toy already holds and enforces, and the
# engine would then target an instant computed from ITS copy -- so a walk could
# miss the real deadline while both files looked right. The project says where
# the instant is READ and the run asks.
#
# WHAT THIS TABLE COSTS THE CONTROL: nothing, measured. The observation it
# names is unmakeable until `invite_user` is drawn, and that action's weight is
# zero in `[weights.default]`.
[deadline]
# THE SECOND DECLARED DEADLINE (R7.5 D4c). An entry here is an observation
# whose value IS an instant the engine may target, and the allowance's reset is
# one: the application computes it itself, in wall-clock arithmetic, which is
# the whole subject of this child. Declaring it is what gives a walk a REASON
# to land in the hour where that arithmetic is wrong -- without it the only
# landings in range are the transition's own and an invitation's 30s expiry,
# and neither falls inside the stale hour.
#
# THE PROJECT SAYS WHERE ITS DEADLINE CAN BE READ AND THE RUN ASKS, which is
# this key's own rule: no lifetime is declared here, because a declared one
# would be a second copy of a number the application already holds.
instants = ["invitation_expiry", "invite_quota_reset_at"]

# WHERE A REFUSAL's TEXT LIVES, AS A PATH AND NOT A VALUE.
#
# cmd/toy answers `{"error": "<text>"}` on its refusal path and the adapter
# wraps that as `{"status": <code>, "body": <the object>}`, so the text is at
# `body.error` in the answer the wire carries. This table says that once for
# the project, because the shape of a refusal is a property of the API and not
# of any one call into it.
#
# A PATH, SO IT IS NOT AN EQUALITY TEST. `[[action]].response` is already a
# per-action equality contract -- every key declared there must be present AND
# equal, and anything else is the system refusing -- so an error key declared
# there would make every ACCEPTED action read as a refusal. That was measured
# before this table existed. A path names where to look and asserts nothing
# about what is found, so the two declarations do not collide.
#
# WHAT ITS ABSENCE COSTS: the fuzz stage's D3 and D4 clauses are a could-not-run
# naming this table, rather than findings grounded in a key nobody declared.
# The walk does not read it at all, so a project that never runs that stage is
# unaffected by its presence or absence.
[refusal]
message = "body.error"
