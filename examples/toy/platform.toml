# The toy's platform (R5.2, issue 73).

contract = "2"

[adapter]
# THE ADAPTER IS A BINARY ON PATH, not a `rumor` subcommand: the toy is a system
# under test and not part of this tool's surface. It starts cmd/toy itself when
# TOY_ADDR is unset, which is what makes `rumor validate examples/toy` answer
# the four live arms without an engine or a rollback provider in the picture.
command = ["toy-adapter"]
# AND TOY_ADDR IS PASSED THROUGH, which is the other half of the comment above
# and what the ENGINE needs. Under a rollback provider the provider owns the
# application -- it starts cmd/toy, holds the handle and hands out the address
# it bound (internal/rollback/toyrestart) -- and the adapter drives THAT one
# through TOY_ADDR rather than starting a second toy of its own. Declared here
# because `[adapter].env` is a list of variable NAMES the engine passes through,
# so without this line the value cannot reach the adapter at all and a shrink
# would restore one world while the adapter talked to another. Measured
# 2026-10-24 by driving R5.3's third: the name was absent and the composition
# the provider documents was unreachable for this project.
env = ["TOY_ADDR"]

[[venire]]
role = "admin"
count = 1

[[venire]]
role = "member"
count = 2

[[venire]]
role = "guest"
count = 1

[stages]
api = { enabled = true }
browser = { enabled = true }
# AND THE STAGE THAT CONTENDS WHAT THIS PROJECT DECLARES AS CONTENDED (R8.2,
# 109; fable's ruling at coop rumor/1553). `join_event` carries
# `contended = { limit = ..., held = ... }` and a toy that declared it without
# running the stage that reads it would be the mechanism-not-stage void one tier
# down -- the same shape as `[stages]` being declared and never dispatched, which
# 108 closed. So this is enabled here, and 110 and 111 inherit a toy whose
# stages all run.
#
# WHAT IT COSTS, NAMED: every UNPROFILED `rumor run examples/toy` now contends
# join_event, and the stage finds this toy's capacity race every time -- so such
# a run exits 3 whatever its walk did. The two seeds.lock rows that are
# unprofiled take the `walking` profile below, which narrows the stages and
# nothing else.
concurrency = { enabled = true }
# AND 108's STAGE, WIRED BY 110 (quill, coop r8/75; fable's ruling at rumor/1580).
# v0.1.43 shipped `fuzz` KNOWN, UNRUNNABLE and declared by nobody: internal/fuzz
# had zero production callers, `Known` read `"fuzz": false, // runnable when it
# lands` after it had landed, and no project selected it. A child named for a
# stage ships that stage runnable (rumor/1542), so the wiring is 110's first
# item and this declaration is the half that makes it reachable.
#
# WHAT IT COSTS, MEASURED AND NOT ASSUMED: one stdout line on every UNPROFILED
# run, and nothing else. Driven on seeds 1 and 2 at 10 steps, v0.1.44's binary
# and toy against this branch's: EXACTLY ONE LINE DIFFERS each time and rc is 3
# both ways. The stage finds nothing on this toy -- `fuzz: 27 of 45 case(s)
# reached the system; 0 x18, 201 x1, 400 x13, 404 x13`, rc 0 when it runs alone
# -- so unlike `concurrency` above it does not change what a run EXITS, only
# what it PRINTS.
#
# WHICH RECORDED FIGURES MOVE WITH IT: those taken from an unprofiled run's
# stdout. The `walking` profile below narrows stages to api, so the two
# seeds.lock rows carrying it are untouched, and rows 12, 3 and 66 narrow by
# their own profiles. d4control's seed 1 has no seeds.lock row and is driven
# unprofiled, which rook named at rumor/1554 and holds directly.
fuzz = { enabled = true }

[weights.default]
# RETUNED IN R5.4 (fable, coop r5/99) BECAUSE THE WALK WAS ALL LIES. At the old
# table -- honest actions summing to 9 against three live nemesis kinds at 2
# each -- a nemesis kind took 6 of every 15 draws, and quill measured the
# consequence on seed 4242: six of ten steps were suborns of create_user, so one
# session and no join (r5/98). A walk that mostly lies about one action exercises
# nothing, which is what D15's reach half now refuses.
#
# THE RULE IS A NEMESIS KIND ABOUT ONE STEP IN TEN, and it is a property of the
# DRAW, which the table's own arithmetic does not predict. fable's sketch of
# "honest 3 to 6 against the kinds at 1" reads as 3 in 29; I measured it at 27%
# over 20 seeds and 200 steps. The gap is applicability: early in a walk most
# honest actions are inapplicable -- `has_user` leaves a fresh actor only
# create_user -- while suborn rides whatever IS applicable, so the pool it
# competes in is two entries wide and not seven. canard needs a planted claim
# told onward and palter a palterable action, so suborn is usually the only live
# kind, which is why the share tracks create_user's weight alone.
#
# So the band is scaled, not reordered: the same ordering fable gave, 9 to 18
# against the kinds at 1. MEASURED at 9% over the same 20 seeds and 200 steps,
# with 9 of the 20 reaching a join by an actor that did not create the event --
# the shape D15's reach half asks for.
#
# JOINING IS STILL THE COMMON ACTION, which the old table was right about: a
# walk that created as many events as it joined would rarely put two actors on
# one event, the shape both api-sim rows and R8's race need.
#
# create_user IS THE LIGHTEST HONEST ACTION and the reason is applicability, not
# taste: `may_create_user` is false for any actor that already has one, so its
# weight is only ever contested by FRESH actors. It does not need help to be
# drawn early -- `has_user` makes it the only applicable api action for an actor
# with no user -- and a heavy weight would spend the walk minting users it has
# no steps left to use.
create_user = 9
create_event = 15
join_event = 18
leave_event = 12
delete_event = 12
join_event_ui = 12

# THE HONEST TELL, which is an ENGINE kind and not a nemesis one: it passes on a
# claim the run did not plant (fable, coop r5/114). It is weighted in the HONEST
# band because it is honest, and toward the bottom of it for the reason
# create_user is light -- it is applicable to any actor holding any claim, so it
# is contested in a wide pool and does not need help to be drawn.
#
# WITHOUT IT A WALK CANNOT TELL THE TRUTH. Before R5.4 the only `told` the walk
# appended was canard's, so a lie could travel and an honest claim could not,
# and an actor could act only on what it had made itself. With the handle draw
# now scoped to what an actor knows, that is the difference between a join by a
# second actor and a self-join: seed 6's step 8 was the first and became the
# second when the draw was scoped.
tell = 9

# THE FOUR NEMESIS KINDS, which arm 19 requires a weight for: absent is not
# zero (fable, coop r4/125 and r5/49). `essoin` abandons a flow mid-way and the
# engine has no flow state until R9, so it is declared at ZERO -- in the pool,
# never drawn, and named rather than missing.
canard = 1
palter = 1
suborn = 1
essoin = 0

# AND R7.3's `advance`, AT ZERO IN THE DEFAULT TABLE, which is `essoin`'s shape
# again and fable's own placement (coop r7/42 ruling 3): "`advance` = 0 goes in
# examples/toy's weights beside `essoin` = 0". It moves the run's OWN clock --
# no actor in the system under test does it -- and it is live only where a
# pending's bound gives it an instant to land on, so a default of zero keeps the
# default walk's composition byte-identical to v0.1.40's while the kind exists,
# is weighted, and is drawn where a profile asks for it.
advance = 0

# AND R7.4's TWO INVITATION ACTIONS, AT ZERO FOR recount_event's REASON AND ONE
# OF ITS OWN.
#
# recount_event's reason, measured for this child before either action existed
# (ibis, coop r7/58): a declared action at weight zero leaves all five control
# seeds byte-identical, so the R5 and R6 rows are untouched by these existing
# and the epic's "the R5 and R6 rows unchanged" is achievable as written.
#
# THE REASON OF ITS OWN, AND IT IS WHY NO PROFILE RAISES THEM HERE: the walk
# records a claim for an action the SYSTEM REFUSED -- measured two-sided (ibis,
# coop r7/64), a join wedged at 409 produced a bug whose shrunk trace ends at
# the refused step. An invitation is refusable three ways cmd/toy owns and the
# ledger cannot see: not yours, already accepted, and EXPIRED. So a profile
# that raised these today would manufacture findings rather than find the row,
# and the profile arrives with the row once that is placed.
invite_user = 0
accept_invitation = 0

# AND THE WORKER'S OWN ACTION AT ZERO, which is `essoin`'s shape used for a
# different reason: in the pool, never drawn, named rather than missing. R6's
# bug ledger says each row is caught by the stage or feature listed for it and
# this one says `settling`, so the action that reaches it is weighted in THAT
# profile and nowhere else (fable, coop r6/92).
#
# MEASURED BEFORE THE REST WAS BUILT (ibis, coop r6/94): with this at zero,
# seeds 1, 2 and 40 draw line for line identically to the control and their five
# fields are unmoved -- the pool does not consume the generator's stream for a
# candidate it cannot draw.
recount_event = 0

# THE `walking` PROFILE: THE WALK ALONE, AND NOTHING ELSE NARROWED.
#
# WHY IT EXISTS (fable, coop rumor/1553, on rook's third option at /1550).
# Enabling `concurrency` above makes every unprofiled run of this project
# contend, and the stage finds the capacity race every time -- so a seeds.lock
# row that is promoted for what its WALK found would exit 3 whatever the walk
# did, which is an arm that cannot fail. The rows take this profile and keep
# reading the status, so nothing about what a row reads changes.
#
# AND IT CARRIES NO WEIGHTS BLOCK, DELIBERATELY. A `[weights.profile.walking]`
# table is what would move the mix those rows exist to test: precedence is
# profile, then stage, then default (platform.go:104-118), so with no table of
# its own every kind falls through to `[weights.default]` and the draw is the
# one the rows were promoted under. Measured rather than reasoned: seeds 2 and
# 40 print byte-identical walks with and without this profile.
#
# SEEDS AND BUDGET ARE THE SCHEMA'S, NOT A TUNING. `[profiles.<name>]` requires
# all three keys (platform.go:240-246), and this profile is about the STAGE
# LIST alone -- so the two numbers are the toy's own, matching `settling` and
# `expiring`, and a reader should not read a seed count into them.
[profiles.walking]
stages = ["api"]
seeds = 1
budget = "1m"

# THE `settling` PROFILE ITSELF, which the weights table below is FOR: a
# weights profile naming no declared profile is refused by name, and the refusal
# is right -- a table of weights nothing can select is a tuning nobody can run.
#
# ONE STAGE AND ONE SEED, because that is what this profile is for: R6's ledger
# row is reached through the api stage, and the seed that reaches it is committed
# rather than searched for at gate time. The budget is the toy's own scale -- a
# recount is a map write and a file write -- so a minute is ~2000x the worst
# request measured at r5/… and an expiry here would be a stall, not slow work.
[profiles.settling]
stages = ["api"]
seeds = 1
budget = "1m"

# THE `settling` WEIGHTS, AND THE MIX IS TUNED FOR THE ROW THIS PROFILE NAMES.
# R5's D3 is that a profile changes the mix measurably; precedence is profile,
# then stage, then default (platform.Weight), so a kind absent here keeps its
# default -- which is how the four nemesis kinds and `tell` stay exactly as
# arm 19 requires them.
#
# WHAT THE ROW NEEDS, AND IT IS A SEQUENCE AND NOT A COUNT: recount an event,
# change its attendance, recount it AGAIN. The second ask is the dropped retry.
# So the mix has to make a repeat recount of the SAME event likely, which is
# three decisions:
#
#   recount_event HIGH so it is drawn often
#   create_event LOW so there are few events to spread those recounts across --
#     measured first at the default 15 and seed 3 drew two recounts on two
#     DIFFERENT events, which is the row missed by arithmetic rather than by
#     mechanism
#   delete_event ZERO because a delete reaches R5's stale-count row, which
#     stops the walk before the sequence completes; the R5 rows are found under
#     the DEFAULT profile and this one is not for re-finding them
#
# NOTHING ELSE MOVES, and `join_event` keeps its default so attendance still
# changes between the two asks.
[weights.profile.settling]
recount_event = 40
create_event = 8
delete_event = 0

# THE `expiring` PROFILE, WHICH R7.4's ROW IS CAUGHT UNDER. The bug ledger says
# each row is caught by the stage or feature listed for it, and this one's is
# the clock -- so the actions that reach it are weighted HERE and nowhere else,
# which is `settling`'s shape and the reason the control seeds are unmoved by
# any of it existing.
[profiles.expiring]
stages = ["api"]
seeds = 1
budget = "1m"

# THE `expiring` WEIGHTS, AND THE ROW IS A SEQUENCE OF FIVE THINGS, not a count:
# make two users, make an event, INVITE one of them, TELL the invitee about the
# invitation -- without which `may_accept` is false, since it reads the claims
# the actor HOLDS -- let an `advance` carry the clock past the expiry, and then
# ACCEPT. The mix is tuned for that chain and each line has a reason:
#
#   invite_user HIGH, because the chain cannot start without one and the
#     invitation is also what makes the expiry observable at all
#   accept_invitation HIGH, because it is the step that commits the defect
#   advance HIGH, because it is the only thing that moves the clock and the row
#     needs the clock PAST the deadline -- it is live only once an expiry has
#     been observed, so it cannot be drawn into nothing
#   tell AT THE DEFAULT's level and no higher: it is already applicable to any
#     actor holding any claim, so a heavier weight spends the walk on hops
#   create_event LOW for `settling`'s measured reason -- few events means the
#     invitations and the joins land on the same one, where the row needs them
#     together
#   delete_event ZERO because a delete reaches R5's stale-count row, which stops
#     the walk before this sequence completes; the R5 rows are found under the
#     default table, not here
#   join_event ZERO because a join by the invitee makes `may_accept` false --
#     `already_joined` -- and the row needs the invitation to be the way in
#   recount_event ZERO so R6's row does not stop the walk first, for
#     delete_event's reason exactly
[weights.profile.expiring]
invite_user = 20
accept_invitation = 20
advance = 20
create_event = 6
delete_event = 0
join_event = 0
recount_event = 0

[[rollback]]
# THE PROCESS-RESTART PROVIDER, which C3 implements and R5.3 consumes. It covers
# `store` -- the component the bindings name on the `direct` observation, and
# the one the whole world lives in as a single file.
provider = "toy-process-restart"
covers = ["store"]
