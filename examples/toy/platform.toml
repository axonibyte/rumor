# The toy's platform (R5.2, issue 73).

contract = "2"

[adapter]
# THE ADAPTER IS A BINARY ON PATH, not a `rumor` subcommand: the toy is a system
# under test and not part of this tool's surface. It starts cmd/toy itself when
# TOY_ADDR is unset, which is what makes `rumor validate examples/toy` answer
# the four live arms without an engine or a rollback provider in the picture.
command = ["toy-adapter"]
# AND TOY_ADDR IS PASSED THROUGH, which is the other half of the comment above
# and what the ENGINE needs. Under a rollback provider the provider owns the
# application -- it starts cmd/toy, holds the handle and hands out the address
# it bound (internal/rollback/toyrestart) -- and the adapter drives THAT one
# through TOY_ADDR rather than starting a second toy of its own. Declared here
# because `[adapter].env` is a list of variable NAMES the engine passes through,
# so without this line the value cannot reach the adapter at all and a shrink
# would restore one world while the adapter talked to another. Measured
# 2026-10-24 by driving R5.3's third: the name was absent and the composition
# the provider documents was unreachable for this project.
env = ["TOY_ADDR"]

[[venire]]
role = "admin"
count = 1

[[venire]]
role = "member"
count = 2

[[venire]]
role = "guest"
count = 1

[stages]
api = { enabled = true }
browser = { enabled = true }

[weights.default]
# RETUNED IN R5.4 (fable, coop r5/99) BECAUSE THE WALK WAS ALL LIES. At the old
# table -- honest actions summing to 9 against three live nemesis kinds at 2
# each -- a nemesis kind took 6 of every 15 draws, and quill measured the
# consequence on seed 4242: six of ten steps were suborns of create_user, so one
# session and no join (r5/98). A walk that mostly lies about one action exercises
# nothing, which is what D15's reach half now refuses.
#
# THE RULE IS A NEMESIS KIND ABOUT ONE STEP IN TEN, and it is a property of the
# DRAW, which the table's own arithmetic does not predict. fable's sketch of
# "honest 3 to 6 against the kinds at 1" reads as 3 in 29; I measured it at 27%
# over 20 seeds and 200 steps. The gap is applicability: early in a walk most
# honest actions are inapplicable -- `has_user` leaves a fresh actor only
# create_user -- while suborn rides whatever IS applicable, so the pool it
# competes in is two entries wide and not seven. canard needs a planted claim
# told onward and palter a palterable action, so suborn is usually the only live
# kind, which is why the share tracks create_user's weight alone.
#
# So the band is scaled, not reordered: the same ordering fable gave, 9 to 18
# against the kinds at 1. MEASURED at 9% over the same 20 seeds and 200 steps,
# with 9 of the 20 reaching a join by an actor that did not create the event --
# the shape D15's reach half asks for.
#
# JOINING IS STILL THE COMMON ACTION, which the old table was right about: a
# walk that created as many events as it joined would rarely put two actors on
# one event, the shape both api-sim rows and R8's race need.
#
# create_user IS THE LIGHTEST HONEST ACTION and the reason is applicability, not
# taste: `may_create_user` is false for any actor that already has one, so its
# weight is only ever contested by FRESH actors. It does not need help to be
# drawn early -- `has_user` makes it the only applicable api action for an actor
# with no user -- and a heavy weight would spend the walk minting users it has
# no steps left to use.
create_user = 9
create_event = 15
join_event = 18
leave_event = 12
delete_event = 12
join_event_ui = 12

# THE HONEST TELL, which is an ENGINE kind and not a nemesis one: it passes on a
# claim the run did not plant (fable, coop r5/114). It is weighted in the HONEST
# band because it is honest, and toward the bottom of it for the reason
# create_user is light -- it is applicable to any actor holding any claim, so it
# is contested in a wide pool and does not need help to be drawn.
#
# WITHOUT IT A WALK CANNOT TELL THE TRUTH. Before R5.4 the only `told` the walk
# appended was canard's, so a lie could travel and an honest claim could not,
# and an actor could act only on what it had made itself. With the handle draw
# now scoped to what an actor knows, that is the difference between a join by a
# second actor and a self-join: seed 6's step 8 was the first and became the
# second when the draw was scoped.
tell = 9

# THE FOUR NEMESIS KINDS, which arm 19 requires a weight for: absent is not
# zero (fable, coop r4/125 and r5/49). `essoin` abandons a flow mid-way and the
# engine has no flow state until R9, so it is declared at ZERO -- in the pool,
# never drawn, and named rather than missing.
canard = 1
palter = 1
suborn = 1
essoin = 0

# AND THE WORKER'S OWN ACTION AT ZERO, which is `essoin`'s shape used for a
# different reason: in the pool, never drawn, named rather than missing. R6's
# bug ledger says each row is caught by the stage or feature listed for it and
# this one says `settling`, so the action that reaches it is weighted in THAT
# profile and nowhere else (fable, coop r6/92).
#
# MEASURED BEFORE THE REST WAS BUILT (ibis, coop r6/94): with this at zero,
# seeds 1, 2 and 40 draw line for line identically to the control and their five
# fields are unmoved -- the pool does not consume the generator's stream for a
# candidate it cannot draw.
recount_event = 0

# THE `settling` PROFILE ITSELF, which the weights table below is FOR: a
# weights profile naming no declared profile is refused by name, and the refusal
# is right -- a table of weights nothing can select is a tuning nobody can run.
#
# ONE STAGE AND ONE SEED, because that is what this profile is for: R6's ledger
# row is reached through the api stage, and the seed that reaches it is committed
# rather than searched for at gate time. The budget is the toy's own scale -- a
# recount is a map write and a file write -- so a minute is ~2000x the worst
# request measured at r5/… and an expiry here would be a stall, not slow work.
[profiles.settling]
stages = ["api"]
seeds = 1
budget = "1m"

# THE `settling` WEIGHTS, AND THE MIX IS TUNED FOR THE ROW THIS PROFILE NAMES.
# R5's D3 is that a profile changes the mix measurably; precedence is profile,
# then stage, then default (platform.Weight), so a kind absent here keeps its
# default -- which is how the four nemesis kinds and `tell` stay exactly as
# arm 19 requires them.
#
# WHAT THE ROW NEEDS, AND IT IS A SEQUENCE AND NOT A COUNT: recount an event,
# change its attendance, recount it AGAIN. The second ask is the dropped retry.
# So the mix has to make a repeat recount of the SAME event likely, which is
# three decisions:
#
#   recount_event HIGH so it is drawn often
#   create_event LOW so there are few events to spread those recounts across --
#     measured first at the default 15 and seed 3 drew two recounts on two
#     DIFFERENT events, which is the row missed by arithmetic rather than by
#     mechanism
#   delete_event ZERO because a delete reaches R5's stale-count row, which
#     stops the walk before the sequence completes; the R5 rows are found under
#     the DEFAULT profile and this one is not for re-finding them
#
# NOTHING ELSE MOVES, and `join_event` keeps its default so attendance still
# changes between the two asks.
[weights.profile.settling]
recount_event = 40
create_event = 8
delete_event = 0

[[rollback]]
# THE PROCESS-RESTART PROVIDER, which C3 implements and R5.3 consumes. It covers
# `store` -- the component the bindings name on the `direct` observation, and
# the one the whole world lives in as a single file.
provider = "toy-process-restart"
covers = ["store"]
