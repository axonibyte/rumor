# The toy's platform (R5.2, issue 73).

contract = "2"

[adapter]
# THE ADAPTER IS A BINARY ON PATH, not a `rumor` subcommand: the toy is a system
# under test and not part of this tool's surface. It starts cmd/toy itself when
# TOY_ADDR is unset, which is what makes `rumor validate examples/toy` answer
# the four live arms without an engine or a rollback provider in the picture.
command = ["toy-adapter"]
# AND TOY_ADDR IS PASSED THROUGH, which is the other half of the comment above
# and what the ENGINE needs. Under a rollback provider the provider owns the
# application -- it starts cmd/toy, holds the handle and hands out the address
# it bound (internal/rollback/toyrestart) -- and the adapter drives THAT one
# through TOY_ADDR rather than starting a second toy of its own. Declared here
# because `[adapter].env` is a list of variable NAMES the engine passes through,
# so without this line the value cannot reach the adapter at all and a shrink
# would restore one world while the adapter talked to another. Measured
# 2026-10-24 by driving R5.3's third: the name was absent and the composition
# the provider documents was unreachable for this project.
# TOY_ZONE JOINS IT (R7.5 D4): the zone the SYSTEM is configured to read its
# own instants in, which the adapter passes to the toy as `--zone`. It is the
# system's configuration and not this project's declaration -- `[clock].zone`
# in bindings.toml is the engine's, and it never crosses the wire -- so the two
# DISAGREEING is a thing a run can find rather than something the harness makes
# impossible (fable, coop r7/114).
#
# UNSET MEANS THE TOY ANCHORS ON UTC DAYS. A run of the `dst-*` profiles with
# TOY_ZONE unset therefore finds that disagreement instead of the quota's
# arithmetic, which is correct and is why seeds.lock's rows for those profiles
# name the variable.
env = ["TOY_ADDR", "TOY_ZONE"]

[[venire]]
role = "admin"
count = 1

[[venire]]
role = "member"
count = 2

[[venire]]
role = "guest"
count = 1

[stages]
api = { enabled = true }
browser = { enabled = true }
# AND THE STAGE THAT CONTENDS WHAT THIS PROJECT DECLARES AS CONTENDED (R8.2,
# 109; fable's ruling at coop rumor/1553). `join_event` carries
# `contended = { limit = ..., held = ... }` and a toy that declared it without
# running the stage that reads it would be the mechanism-not-stage void one tier
# down -- the same shape as `[stages]` being declared and never dispatched, which
# 108 closed. So this is enabled here, and 110 and 111 inherit a toy whose
# stages all run.
#
# WHAT IT COSTS, NAMED: every UNPROFILED `rumor run examples/toy` now contends
# join_event, and the stage finds this toy's capacity race every time -- so such
# a run exits 3 whatever its walk did. The two seeds.lock rows that are
# unprofiled take the `walking` profile below, which narrows the stages and
# nothing else.
concurrency = { enabled = true }
# AND 108's STAGE, WIRED BY 110 (quill, coop r8/75; fable's ruling at rumor/1580).
# v0.1.43 shipped `fuzz` KNOWN, UNRUNNABLE and declared by nobody: internal/fuzz
# had zero production callers, `Known` read `"fuzz": false, // runnable when it
# lands` after it had landed, and no project selected it. A child named for a
# stage ships that stage runnable (rumor/1542), so the wiring is 110's first
# item and this declaration is the half that makes it reachable.
#
# WHAT IT COSTS, MEASURED AND NOT ASSUMED: one stdout line on every UNPROFILED
# run, and nothing else. Driven on seeds 1 and 2 at 10 steps, v0.1.44's binary
# and toy against this branch's: EXACTLY ONE LINE DIFFERS each time and rc is 3
# both ways. The stage finds nothing on this toy -- `fuzz: 27 of 45 case(s)
# reached the system; 0 x18, 201 x1, 400 x13, 404 x13`, rc 0 when it runs alone
# -- so unlike `concurrency` above it does not change what a run EXITS, only
# what it PRINTS.
#
# WHICH RECORDED FIGURES MOVE WITH IT: those taken from an unprofiled run's
# stdout. The `walking` profile below narrows stages to api, so the two
# seeds.lock rows carrying it are untouched, and rows 12, 3 and 66 narrow by
# their own profiles. d4control's seed 1 has no seeds.lock row and is driven
# unprofiled, which rook named at rumor/1554 and holds directly.
fuzz = { enabled = true }

[weights.default]
# RETUNED IN R5.4 (fable, coop r5/99) BECAUSE THE WALK WAS ALL LIES. At the old
# table -- honest actions summing to 9 against three live nemesis kinds at 2
# each -- a nemesis kind took 6 of every 15 draws, and quill measured the
# consequence on seed 4242: six of ten steps were suborns of create_user, so one
# session and no join (r5/98). A walk that mostly lies about one action exercises
# nothing, which is what D15's reach half now refuses.
#
# THE RULE IS A NEMESIS KIND ABOUT ONE STEP IN TEN, and it is a property of the
# DRAW, which the table's own arithmetic does not predict. fable's sketch of
# "honest 3 to 6 against the kinds at 1" reads as 3 in 29; I measured it at 27%
# over 20 seeds and 200 steps. The gap is applicability: early in a walk most
# honest actions are inapplicable -- `has_user` leaves a fresh actor only
# create_user -- while suborn rides whatever IS applicable, so the pool it
# competes in is two entries wide and not seven. canard needs a planted claim
# told onward and palter a palterable action, so suborn is usually the only live
# kind, which is why the share tracks create_user's weight alone.
#
# So the band is scaled, not reordered: the same ordering fable gave, 9 to 18
# against the kinds at 1. MEASURED at 9% over the same 20 seeds and 200 steps,
# with 9 of the 20 reaching a join by an actor that did not create the event --
# the shape D15's reach half asks for.
#
# JOINING IS STILL THE COMMON ACTION, which the old table was right about: a
# walk that created as many events as it joined would rarely put two actors on
# one event, the shape both api-sim rows and R8's race need.
#
# create_user IS THE LIGHTEST HONEST ACTION and the reason is applicability, not
# taste: `may_create_user` is false for any actor that already has one, so its
# weight is only ever contested by FRESH actors. It does not need help to be
# drawn early -- `has_user` makes it the only applicable api action for an actor
# with no user -- and a heavy weight would spend the walk minting users it has
# no steps left to use.
create_user = 9
create_event = 15
join_event = 18
leave_event = 12
delete_event = 12
join_event_ui = 12

# THE HONEST TELL, which is an ENGINE kind and not a nemesis one: it passes on a
# claim the run did not plant (fable, coop r5/114). It is weighted in the HONEST
# band because it is honest, and toward the bottom of it for the reason
# create_user is light -- it is applicable to any actor holding any claim, so it
# is contested in a wide pool and does not need help to be drawn.
#
# WITHOUT IT A WALK CANNOT TELL THE TRUTH. Before R5.4 the only `told` the walk
# appended was canard's, so a lie could travel and an honest claim could not,
# and an actor could act only on what it had made itself. With the handle draw
# now scoped to what an actor knows, that is the difference between a join by a
# second actor and a self-join: seed 6's step 8 was the first and became the
# second when the draw was scoped.
tell = 9

# THE FOUR NEMESIS KINDS, which arm 19 requires a weight for: absent is not
# zero (fable, coop r4/125 and r5/49). `essoin` abandons a flow mid-way and the
# engine has no flow state until R9, so it is declared at ZERO -- in the pool,
# never drawn, and named rather than missing.
canard = 1
palter = 1
suborn = 1
essoin = 0

# AND R7.3's `advance`, AT ZERO IN THE DEFAULT TABLE, which is `essoin`'s shape
# again and fable's own placement (coop r7/42 ruling 3): "`advance` = 0 goes in
# examples/toy's weights beside `essoin` = 0". It moves the run's OWN clock --
# no actor in the system under test does it -- and it is live only where a
# pending's bound gives it an instant to land on, so a default of zero keeps the
# default walk's composition byte-identical to v0.1.40's while the kind exists,
# is weighted, and is drawn where a profile asks for it.
advance = 0

# AND R7.4's TWO INVITATION ACTIONS, AT ZERO FOR recount_event's REASON AND ONE
# OF ITS OWN.
#
# recount_event's reason, measured for this child before either action existed
# (ibis, coop r7/58): a declared action at weight zero leaves all five control
# seeds byte-identical, so the R5 and R6 rows are untouched by these existing
# and the epic's "the R5 and R6 rows unchanged" is achievable as written.
#
# THE REASON OF ITS OWN, AND IT IS WHY NO PROFILE RAISES THEM HERE: the walk
# records a claim for an action the SYSTEM REFUSED -- measured two-sided (ibis,
# coop r7/64), a join wedged at 409 produced a bug whose shrunk trace ends at
# the refused step. An invitation is refusable three ways cmd/toy owns and the
# ledger cannot see: not yours, already accepted, and EXPIRED. So a profile
# that raised these today would manufacture findings rather than find the row,
# and the profile arrives with the row once that is placed.
invite_user = 0
accept_invitation = 0

# AND THE WORKER'S OWN ACTION AT ZERO, which is `essoin`'s shape used for a
# different reason: in the pool, never drawn, named rather than missing. R6's
# bug ledger says each row is caught by the stage or feature listed for it and
# this one says `settling`, so the action that reaches it is weighted in THAT
# profile and nowhere else (fable, coop r6/92).
#
# MEASURED BEFORE THE REST WAS BUILT (ibis, coop r6/94): with this at zero,
# seeds 1, 2 and 40 draw line for line identically to the control and their five
# fields are unmoved -- the pool does not consume the generator's stream for a
# candidate it cannot draw.
recount_event = 0
# AND R8/111's READ OF THE WITHHELD LIST, at zero for the same reason and on the
# same measurement: a candidate the pool cannot draw does not consume the
# generator's stream, so every promoted seed draws what it drew. It is weighted
# in `viewing` alone, below.
list_attendees = 0

# THE `walking` PROFILE: THE WALK ALONE, AND NOTHING ELSE NARROWED.
#
# WHY IT EXISTS (fable, coop rumor/1553, on rook's third option at /1550).
# Enabling `concurrency` above makes every unprofiled run of this project
# contend, and the stage finds the capacity race every time -- so a seeds.lock
# row that is promoted for what its WALK found would exit 3 whatever the walk
# did, which is an arm that cannot fail. The rows take this profile and keep
# reading the status, so nothing about what a row reads changes.
#
# AND IT CARRIES NO WEIGHTS BLOCK, DELIBERATELY. A `[weights.profile.walking]`
# table is what would move the mix those rows exist to test: precedence is
# profile, then stage, then default (platform.go:104-118), so with no table of
# its own every kind falls through to `[weights.default]` and the draw is the
# one the rows were promoted under. Measured rather than reasoned: seeds 2 and
# 40 print byte-identical walks with and without this profile.
#
# SEEDS AND BUDGET ARE THE SCHEMA'S, NOT A TUNING. `[profiles.<name>]` requires
# all three keys (platform.go:240-246), and this profile is about the STAGE
# LIST alone -- so the two numbers are the toy's own, matching `settling` and
# `expiring`, and a reader should not read a seed count into them.
[profiles.walking]
stages = ["api"]
seeds = 1
budget = "1m"

# THE `settling` PROFILE ITSELF, which the weights table below is FOR: a
# weights profile naming no declared profile is refused by name, and the refusal
# is right -- a table of weights nothing can select is a tuning nobody can run.
#
# ONE STAGE AND ONE SEED, because that is what this profile is for: R6's ledger
# row is reached through the api stage, and the seed that reaches it is committed
# rather than searched for at gate time. The budget is the toy's own scale -- a
# recount is a map write and a file write -- so a minute is ~2000x the worst
# request measured at r5/… and an expiry here would be a stall, not slow work.
# THE `reconciling` PROFILE, AND IT IS THE PRODUCT'S OWN EXAMPLE OF A PERIOD
# (R8/111; fable's ruling at coop rumor/1619, taking quill's option (b) at
# r8/124 over declaring the period on the shared api stage).
#
# WHY A PROFILE AND NOT `[stages.api]`. The period is DECLARED, and a project
# that declares it nowhere ships a knob nothing in its own corpus exercises --
# the permission pattern this child found twice over, a field with no reader
# beside a knob with no declaration. But `[stages.api]` is shared by every
# profile, and determinism is per (seed, period): a period there would move the
# release control's five digest rows, all five promoted seeds in seeds.lock --
# two of which, 12 and 66, are ABOUT reconciliation and would need re-deriving
# rather than re-measuring -- every executed sample in docs/cli.md, and D10's
# own PRECONDITION, which is rook's finding at r8/125 and the sharpest of them:
# axis 1 is non-vacuous only because the walk REACHES a full event fourteen
# times, and a mid-walk re-check moves the live bounds and so the draws. An arm
# whose precondition has quietly gone does not announce it.
#
# SO THE PERIOD LIVES WHERE NO COMMITTED ROW LOOKS. This profile is named by no
# line of seeds.lock, no control invocation and no test, so declaring it moves
# nothing -- and `settling` is deliberately NOT given one, because rows 12 and
# 66 name that profile and carry traces measured without a period.
#
# THE WEIGHTS ARE DECLARED, AND MY FIRST VERSION OF THIS COMMENT ARGUED THE
# OPPOSITE. It said the default mix was deliberate, because a weights block
# would make this a second `settling`. The drive refuted it: under the default
# mix the passes RUN and hold nothing on every seed tried, so `Settled` is
# always empty -- and a field with no reader is the exact defect this child
# exists to close, so an example that never populates it is the weaker half of
# the demonstration. Measured at 40 steps, period 4, seeds 13/23/5/101/42/7:
#
#   recount_event 40, create_event 8, delete_event 0    4 of 6 reach a verdict
#   without create_event                                2 of 6
#   without delete_event                                seed 13 loses its verdict
#
# SO EVERY LINE IS JUSTIFIED BY ITS OWN ABLATION, on ONE seed set rather than
# three. `recount_event = 40` makes the sequence the row needs -- recount, change
# the attendance, recount AGAIN -- likely at all. `delete_event = 0` keeps it
# reachable: an `event.deleted` claim in the prefix puts the statute beyond both
# `consistent` and `explained`, so a delete ends the run's ability to find this.
# `create_event = 8` lowers creates from the default 15, concentrating recounts
# on fewer events; dropping it HALVES the hit rate.
#
# AND THE FIRST ABLATION OF create_event WAS A SINGLE SEED AND SAID "INERT".
# Seed 13 keeps its verdict without the line, so one reading licensed removing
# it; six seeds say it doubles the rate. One seed is a reading and not a
# finding -- and the two sets have to be the SAME set, which my first comparison
# got wrong by measuring four seeds against six.
#
# THE MIX IS `settling`'s TWO LOAD-BEARING LINES AND NOT A COPY OF IT: settling
# also carries create_event 8, and its row is the END-OF-RUN verdict where this
# profile's is the PERIODIC one. If settling's mix is ever retuned, this one is
# re-measured rather than followed -- two tables that agree today are not one
# table.
#
# 4 AND NOT 2, measured: both reach verdicts, and 4 asks half as often.
[profiles.reconciling]
stages = ["api"]
seeds = 1
budget = "1m"
reconcile_every = 4

[weights.profile.reconciling]
recount_event = 40
create_event = 8
delete_event = 0

[profiles.settling]
stages = ["api"]
seeds = 1
budget = "1m"

# THE `settling` WEIGHTS, AND THE MIX IS TUNED FOR THE ROW THIS PROFILE NAMES.
# R5's D3 is that a profile changes the mix measurably; precedence is profile,
# then stage, then default (platform.Weight), so a kind absent here keeps its
# default -- which is how the four nemesis kinds and `tell` stay exactly as
# arm 19 requires them.
#
# WHAT THE ROW NEEDS, AND IT IS A SEQUENCE AND NOT A COUNT: recount an event,
# change its attendance, recount it AGAIN. The second ask is the dropped retry.
# So the mix has to make a repeat recount of the SAME event likely, which is
# three decisions:
#
#   recount_event HIGH so it is drawn often
#   create_event LOW so there are few events to spread those recounts across --
#     measured first at the default 15 and seed 3 drew two recounts on two
#     DIFFERENT events, which is the row missed by arithmetic rather than by
#     mechanism
#   delete_event ZERO because a delete reaches R5's stale-count row, which
#     stops the walk before the sequence completes; the R5 rows are found under
#     the DEFAULT profile and this one is not for re-finding them
#
# NOTHING ELSE MOVES, and `join_event` keeps its default so attendance still
# changes between the two asks.
[weights.profile.settling]
recount_event = 40
create_event = 8
delete_event = 0

# THE `expiring` PROFILE, WHICH R7.4's ROW IS CAUGHT UNDER. The bug ledger says
# each row is caught by the stage or feature listed for it, and this one's is
# the clock -- so the actions that reach it are weighted HERE and nowhere else,
# which is `settling`'s shape and the reason the control seeds are unmoved by
# any of it existing.
[profiles.expiring]
stages = ["api"]
seeds = 1
budget = "1m"

# THE `expiring` WEIGHTS, AND THE ROW IS A SEQUENCE OF FIVE THINGS, not a count:
# make two users, make an event, INVITE one of them, TELL the invitee about the
# invitation -- without which `may_accept` is false, since it reads the claims
# the actor HOLDS -- let an `advance` carry the clock past the expiry, and then
# ACCEPT. The mix is tuned for that chain and each line has a reason:
#
#   invite_user HIGH, because the chain cannot start without one and the
#     invitation is also what makes the expiry observable at all
#   accept_invitation HIGH, because it is the step that commits the defect
#   advance HIGH, because it is the only thing that moves the clock and the row
#     needs the clock PAST the deadline -- it is live only once an expiry has
#     been observed, so it cannot be drawn into nothing
#   tell AT THE DEFAULT's level and no higher: it is already applicable to any
#     actor holding any claim, so a heavier weight spends the walk on hops
#   create_event LOW for `settling`'s measured reason -- few events means the
#     invitations and the joins land on the same one, where the row needs them
#     together
#   delete_event ZERO because a delete reaches R5's stale-count row, which stops
#     the walk before this sequence completes; the R5 rows are found under the
#     default table, not here
#   join_event ZERO because a join by the invitee makes `may_accept` false --
#     `already_joined` -- and the row needs the invitation to be the way in
#   recount_event ZERO so R6's row does not stop the walk first, for
#     delete_event's reason exactly
[weights.profile.expiring]
invite_user = 20
accept_invitation = 20
advance = 20
create_event = 6
delete_event = 0
join_event = 0
recount_event = 0

# THE `contending` PROFILE, WHICH 110's D10 PARTNER NEEDS: AN EVENT ACTUALLY AT
# CAPACITY, REACHED BY THE SEQUENTIAL WALK.
#
# WHY IT EXISTS. D10's partner claim is that the api stage REACHES the capacity
# action at capacity and reports nothing, while `concurrency` finds the race --
# and that is only a measurement if the event was FULL when the walk looked.
# ibis drove the default mix at coop r8/33: 503 steps over seeds 1-12, join_event
# drawn THIRTY times, ZERO at-capacity refusals. A permission is not an
# occurrence (r8/34, my own correction), so the state is manufactured here and
# measured, not argued from the declarations.
#
# STAGES = ["api"] IS LOAD-BEARING, not tidiness. With `concurrency` enabled
# above, an unprofiled run contends `join_event` and the stage finds the capacity
# race every time -- so the api side of a two-run comparison would be reading a
# verdict the OTHER stage produced. The partner needs the walk alone.
#
# THE MIX IS FOUR LINES, AND AN ABLATION CHOSE THEM -- WITH ONE CORRECTION THAT
# IS THE MOST USEFUL THING IN THIS COMMENT.
#
# My first cut had EIGHT overrides, each with a mechanism I could argue. I
# removed them one at a time on seed 34 at 37 steps and read the result as
# licensing the removal of all five that looked harmless:
#
#   without delete_event = 0          ->  0 at-capacity, 1 finding
#   without leave_event = 0           ->  4 at-capacity, 1 finding
#   without join_event = 40           -> 10 at-capacity, 1 finding
#   without create_event = 8          -> 14 at-capacity, 0 findings
#   without tell = 12                 -> 14 at-capacity, 0 findings
#   without canard/palter/suborn = 0  -> 13 at-capacity, 0 findings
#
# THAT READING WAS WRONG, AND THE SHAPE OF THE ERROR IS WORTH MORE THAN THE
# TUNING: a ONE-AT-A-TIME ablation licenses removing ONE line, never a SET.
# Each of those five was individually harmless because removing it left the
# others in place. Removing all five together drops seed 34 to 3 at-capacity and
# a planted bug at step 18 -- the profile stops manufacturing the state it
# exists for, and the measurement that found it is the one I had just run.
#
# MEASURED AS COMBINATIONS, which is what the choice actually needed:
#
#   join/leave/delete + tell                  -> 14 at-capacity, 0 findings
#   join/leave/delete + create_event          ->  7 at-capacity, 1 finding
#   join/leave/delete + tell + create_event   -> 11 at-capacity, 1 finding
#   join/leave/delete + tell + nemesis zeros  -> 14 at-capacity, 0 findings
#   all eight (the first cut)                 -> 13 at-capacity, 0 findings
#
# SO FOUR LINES BEATS EIGHT, and `create_event = 8` was the whole problem: it
# COSTS at-capacity reaches and INTRODUCES a finding, which the three nemesis
# zeros were silently suppressing. Drop it and neither is needed. I had imported
# `settling`'s "few events puts two actors on one" mechanism, true of ITS row,
# and never measured it for this one -- and a 60-seed search confirms the
# direction: the DEFAULT 15 reaches at-capacity on 5 seeds with 19 refusals,
# against 3 seeds under my 8.
#
# WHAT THE FOUR ARE FOR:
#   join_event 40   filling one event needs capacity+1 joins on the SAME event,
#                   and capacity is drawn from [1, 2, 3]
#   tell 12         `may_join` requires `knows_of_subject`, so a second actor
#                   can only join an event it was TOLD about. Without it the
#                   joins are self-joins -- seed 12 under `walking` drew four,
#                   every one `guest_1 join_event <- guest_1.event#1`, because
#                   the handle draw is scoped to what an actor KNOWS.
#   leave_event 0   a leave frees the very slot this profile exists to fill, so
#                   the walk undoes its own progress: 14 reaches drop to 4
#   delete_event 0  seed 12 drew a delete of ANOTHER actor's event, the system
#                   answered 403, and the walk stopped on that bug at step 15.
#                   Removing it takes at-capacity to ZERO -- the walk dies first.
#
# EVERYTHING ELSE FALLS THROUGH TO `[weights.default]`, the four nemesis kinds
# and `advance` included, so arm 19 is satisfied here exactly as it is in the
# three profiles above.
[profiles.contending]
stages = ["api"]
seeds = 1
budget = "1m"

[weights.profile.contending]
join_event = 40
tell = 12
leave_event = 0
delete_event = 0

# THE `racing` PROFILE: `contending`'s PAIR, AND THE ONLY THING THAT DIFFERS IS
# THE STAGE LIST.
#
# WHY IT EXISTS. D10's partner is a two-run comparison, and a comparison is only
# about the stage if the stage is the only thing that moved. An UNPROFILED run
# would also find the race -- the note on `[stages]` above says so -- but it
# runs four stages under the DEFAULT weights, so it varies the mix and the stage
# list at once and answers neither question.
#
# AND IT CARRIES NO WEIGHTS BLOCK, which is `walking`'s shape above and for a
# measured reason: `internal/concurrency` holds ZERO references to the weights
# table, so the fan-out never draws and a mix declared here cannot reach it.
#
# IT DID CARRY ONE, duplicating `contending`'s "LINE FOR LINE" with a comment
# saying the two must be edited together -- and ibis measured both halves of
# that at coop r8/94: racing's four weights set to 1/99/7/5 leaves stdout
# BYTE-IDENTICAL and rc 3 either way (so the equality was never NECESSARY),
# while a `[weights.stage.api]` override moves the api side's EFFECTIVE mix with
# both tables still equal (so it was never SUFFICIENT). An invariant that is
# neither is noise, and the arm that guarded it is replaced in
# tests/run/contending_test.go by one that pins what the api side RESOLVES.
#
# THE WALK IS NOT IN THIS LIST, which is the point: `concurrency` reads
# `join_event`'s `contended = { limit = "create_event.capacity", held =
# "store_event_count" }` and fans out requests against one world. Whatever it
# finds, it found without a walk -- so a verdict here cannot be the walk's.
# R7.5's TWO PROFILES, ONE PER DIRECTION (fable's ruling at coop r7/110: "two
# rows and two worlds, not one row drawn twice"). One start in the day before
# March cannot reach November in a walk any budget allows, so the direction is
# the profile's rather than the seed's.
#
# EACH STARTS IN THE DAY BEFORE ITS TRANSITION, which is what `clock_start`
# is for (R7.5 D3): `[clock].start` is the project's default and this overrides
# it for runs of this profile, resolved profile then clock then epoch in one
# place (internal/platform.ClockStartFor). Both instants are verified readings
# and not arithmetic: 1772906400000000000 is 2026-03-07 12:00:00-06:00 and
# 1793466000000000000 is 2026-10-31 12:00:00-05:00, each the midday before the
# transition that follows it.
#
# THEY CLAIM THE ALLOWANCE OBSERVATIONS, and that claim is load-bearing rather
# than tidy. An observation no profile claims is taken by EVERY profile
# (`rumor report`'s observations line says so in the project's own words), and
# both of these are declared with no `args` -- so unclaimed they are makeable
# on every step of every walk. MEASURED: with them unclaimed, seed 12 under
# `settling` ended at step 1 with a `bug`, because the toy was reading UTC days
# while this project declares America/Chicago and `invite_quota_day` found
# exactly that disagreement. Correct of the reading, wrong of the walk: that
# run is not about a zone. The claim scopes them to the two profiles that are.
#
# WHAT THEY DO NOT YET DO: no seed is promoted for either. The window the
# plant is wrong in is the hour AFTER a late reset, and a walk has no reason to
# land there until the reset instant is a deadline the engine targets -- R7's
# `[deadline].instants` machinery, which is the next head. These profiles are
# the scope and the world; the seed that reaches the window comes with it.
[profiles.dst-spring]
stages = ["api"]
seeds = 1
budget = "1m"
clock_start = 1772906400000000000
observations = ["invite_quota_reset", "invite_quota_day"]

# THE WEIGHTS ARE `expiring`'s SHAPE, for its reason: an allowance is spent by
# INVITING, and the clock moves by `advance`. Both have to be drawn often for a
# walk to hold a stale record across a local midnight, and everything that
# competes for a step without serving that is zeroed rather than merely
# lowered -- absent is not zero (arm 19), so each is named.
[weights.profile.dst-spring]
invite_user = 24
advance = 24
create_event = 6
accept_invitation = 6
join_event = 0
leave_event = 0
delete_event = 0
recount_event = 0

[profiles.dst-fall]
stages = ["api"]
seeds = 1
budget = "1m"
clock_start = 1793466000000000000
observations = ["invite_quota_reset", "invite_quota_day"]

[weights.profile.dst-fall]
invite_user = 24
advance = 24
create_event = 6
accept_invitation = 6
join_event = 0
leave_event = 0
delete_event = 0
recount_event = 0

[profiles.racing]
stages = ["concurrency"]
seeds = 1
budget = "1m"

# THE READER'S PROFILE (R8/111; fable ruled the level at coop rumor/1660). It
# is the one world in which this project draws a BROWSER actor, and it is a
# profile rather than a row on `[[venire]]` for the reason the period's level
# exists: a row added to the committed venire would reach every run of every
# profile -- the release control's digests, all five promoted seeds, and D10's
# precondition among them. Appended here, it reaches runs of THIS profile and
# nothing else, and every committed row draws the pool it always drew.
#
# SELECTED BY NO COMMITTED SEED, which is the half that keeps the evidence: no
# line in seeds.lock names this profile, so adding it moves no recorded reading.
#
# AND THE WEIGHTS ROW BELOW IS NOT A COUNTER-EXAMPLE, though this comment said
# "no `[weights.profile.viewing]`" until the action arrived and gave it one. A
# weights table makes no run happen -- it says how a run of that profile would
# draw, and only a SEED makes such a run part of the record. tests/contract reads
# seeds.lock for exactly this reason, after its first cut keyed on the weights
# tables and failed here.
#
# BOTH STAGES, AND THE SECOND IS NOT DECORATION: arm 19's venire cell refuses a
# row whose role holds a context no stage THIS profile selects can drive, so a
# `viewer` drawn under `stages = ["api"]` alone is refused by name. The walk is
# the api stage and the browser session is opened within it; whether the browser
# STAGE itself can run is stage.Plan's answer and not this table's.
[profiles.viewing]
stages = ["api", "browser"]
seeds = 1
budget = "1m"
# AND THE OBSERVATION THIS PROFILE TAKES, which is the level fable ruled at coop
# rumor/1678 and the half the venire row above cannot supply. A `[[observation]]`
# row in bindings.toml reaches every walk of every profile: declared there alone,
# `page_count` opened a browser session in all five promoted seeds and in the
# release control -- six sessions where the committed reading has four, 14 steps
# where it has 24, and tests/clock's control failing. Named here, it is taken by
# runs of THIS profile and no other, and no committed row names this profile.
#
# THE SOURCE IS WHY BOTH STAGES ARE SELECTED ABOVE: `page_count` is read through
# `browser`, and arm 19 refuses by name an observation a profile's own stages
# cannot drive -- so this row and that stage list stand or fall together.
# AND THE SECOND PLANT'S READER BESIDE IT (fable, coop rumor/1682). Both are
# browser observations and both are claimed here and nowhere else, so no
# committed row carries either and every committed walk observes exactly what it
# did before -- the same construction the venire and the period rest on.
observations = ["page_count", "page_attendees"]

# THE APPENDED ROW. One reader, because what it is for is observing: `page_count`
# is read through this actor's own browser session, and one is enough to make
# the observation occur.
# AND THE ACTION THIS PROFILE DRAWS, which is the other half of fable's shape at
# coop rumor/1682: the honest API read of the item the template leaks, declared
# here and nowhere else. `[weights.default]` holds it at zero, so this is the one
# profile whose walks can take it -- and no committed row names this profile.
#
# THE NUMBER IS THE READ'S AND NOT A TUNING: it sits beside join_event_ui so a
# viewing walk both makes the page's list non-empty and reads the API's own copy,
# which is what lets one walk hold both readings of the same item.
[weights.profile.viewing]
list_attendees = 12

[[profiles.viewing.venire]]
role = "viewer"
count = 1

[[rollback]]
# THE PROCESS-RESTART PROVIDER, which C3 implements and R5.3 consumes. It covers
# `store` -- the component the bindings name on the `direct` observation, and
# the one the whole world lives in as a single file.
provider = "toy-process-restart"
covers = ["store"]
