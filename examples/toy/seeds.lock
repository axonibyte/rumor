# PROMOTED SEEDS: one non-negative integer per line, `#` comments allowed
# (docs/contract.md). A promotion carries a comment NAMING THE DEFECT it
# caught, so a line that stops reproducing can be told apart from a line nobody
# can account for -- which is the difference between a regression suite and a
# list of numbers.
#
# D12 AS AMENDED IS WHY THESE TWO AND NOT ONE (breakout-r5/1 item 3): "each of
# the toy's two api-sim bugs found from a COMMITTED SEED by api-sim and shrunk
# to under five actions, every step on a verified clean rollback". Found from a
# COMMITTED seed is part of the done-when, so the shrink's product belongs here
# rather than in a test's temporary directory (fable, coop r5/219).
#
# 2 -- THE STALE COUNT, in FOUR actions. member_2 makes a user, creates an
# event, admin_1 makes a user, and member_2 deletes the event; the observations
# after the delete are still ANSWERED a count for it -- "the disagreement
# between a delete the ledger carries and a count the application still
# reports" (statute.rego's `deleted`). Both the API's denormalized counter and
# the store's attendee list answer, which is why the row is the application's
# and not one endpoint's.
#
# 40 -- A BUG REACHED WITH NO DELETE, in THREE actions. member_1 makes a user,
# creates an event and joins it, and the observation disagrees with what the
# observer may see. THE TRACE PROVES THE ABSENCE OF A DELETE AND NOT WHICH ROW
# THIS IS: once an `event.deleted` claim is in the prefix the statute can reach
# neither `consistent` nor `explained`, so a delete is sufficient for a bug and
# its absence rules the stale count out -- but naming this one the visibility
# leak rests on D12 enumerating exactly two R5-catchable rows and putting the
# capacity race in R8, not on any field of the finding. Both rows arrive as
# `default finding := "bug"` with no clause fired, so no field of
# engine.Finding separates them (ratchet, coop r5/178 and /216).
#
# Both are the HONEST finding -- `rests_on_planted false` -- which is a third of
# a finding's identity, and both are byte-identical across two runs.
# Measured 2026-10-24.
#
# SEED 7 IS RETIRED FROM THIS FILE and stays R5.5's record of D16. It caught
# the stale count in FIVE actions, and the done-when asks for UNDER five; seed
# 2 reaches the same row in four. Keeping both would carry the longer seed for
# a row already covered, and a regression suite is not improved by a second
# witness to one defect.
# AND THESE TWO NOW NAME A PROFILE THAT NARROWS STAGES AND NOTHING ELSE
# (fable, coop rumor/1553, taking rook's third option at /1550). 109 enables the
# `concurrency` stage in this project's platform, and that stage finds this
# toy's capacity race on EVERY run -- so an unprofiled replay of either row
# would exit 3 whatever its walk did, and the arm that replays these rows would
# stop being able to see a lost walk defect. `profile=walking` selects the api
# stage alone and carries no weights block, so the DEFAULT MIX these two rows
# exist to test is the one they still run under; measured before the token was
# written, both print byte-identical walks with and without it.
#
# THE ROWS STILL READ THE STATUS, which is the half that matters and rook's
# point at /1550: nothing about what a row means changes, and the cost is one
# declaration and two tokens rather than a new oracle for every row.
2 profile=walking
40 profile=walking

# 12 -- R6'S ROW, AND THE FIRST LINE HERE TO NAME A PROFILE. `profile=settling`
# says which weights a replay must use; a line without the token means the
# default mix, which is what 2 and 40 above mean and have always meant. The
# token's grammar is docs/contract.md's, validate's arm 10b refuses one naming
# a profile the platform does not declare, and the profile is what the bug
# ledger's "caught by" column says for this row.
#
# A RETRY DROPPED, A COUNT THAT NEVER SETTLES, in twenty-four steps:
# member_2 recounts its event at step 10 and the worker applies it, asks again
# at 15 and the worker DROPS it as redundant, JOINS at 17 so the attendance
# moves, and asks at 19 and 24 -- each dropped. So the worker's tally still
# reports the number it computed at step 10, for a world that has changed, and
# no later ask repairs it.
#
# `steps=24` IS ON THE LINE AND NOT IN THE ARM THAT REPLAYS IT. The row is a
# SEQUENCE -- recount, change, recount again -- and it does not fit in the ten
# steps seeds 2 and 40 are replayed at. The length was a fact about this seed
# living in tests/run (ratchet, coop r6/106), so the next profiled promotion
# would have inherited 24 and a row needing another length would have read as a
# lost promotion.
#
# IT IS FOUND AS `stale` AND BY THE RECONCILIATION, which is the part the row is
# about: the disagreement is held as `pending` while the probes read busy, and
# the end-of-run reconciliation re-asks it after they read quiet and it still
# disagrees -- docs/vocabulary.md's "a `pending` past its bound". The run ends
# with nothing held open.
#
# `FOUND bug of kind stale after step 24 -- engine.stale, rests_on_planted
# false`, byte-identical across two attempts. The HONEST finding: it rests on no
# planted claim, so it is the toy's own defect and not a lie the run told.
# Measured 2026-10-26 at 2746f81.
12 profile=settling steps=24
# 66 -- NOT A DEFECT, AND THE `witness=` TOKEN IS WHY THIS LINE CAN SAY SO.
# Every other row here promotes a bug and the replay arm requires exit 3 of
# it. This one proves a pending was HELD AND THEN CLEARED: it exits 0 and
# finds nothing, which is the point of it, and adding it without the token
# broke that arm on its own terms (ibis, coop rumor/1238; fable's ruling,
# rumor/1241).
#
# WHAT IT WITNESSES: D1's case and docs/vocabulary.md's clearing half,
# "`pending` until the declared probes read quiet". rook drove fourteen seeds
# at settling/24 and every pending found went stale (coop rumor/1230), so the
# half had no run to read it from.
#
# A BOUNDED SCAN FOUND IT, and the bound is part of the result: seeds 1-200 at
# `rumor run examples/toy --seed N --steps 24 --profile settling`. 74 held a
# pending, THREE cleared -- 66, 75 and 140. Had none cleared the claim would
# have been "not in the first two hundred", never "the toy cannot".
#
# 66 AND NOT 75 OR 140 because it holds TWO, at steps 11 and 20, both
# re-checked consistent, so it exercises the plural case and the sort as well
# as the clearing.
#
# NO NEW PROFILE WAS NEEDED. `settling`'s weights make the dropped retry
# LIKELY, not certain -- recount_event 40 against create_event 8 -- so the
# recoverable window is still reached when the first recount is the observed
# one. fable took the committed seed over a `recovering` profile as the
# smaller change (rumor/1235).
66 profile=settling steps=24 witness=cleared

# 3 -- R7.4'S ROW, AN INVITATION HONORED PAST ITS EXPIRY, in EIGHT steps under
# `profile=expiring`. The first promotion here whose row needs the CLOCK.
#
# WHAT HAPPENS, from the shrunk trace: admin_1 and member_2 make users, admin_1
# creates an event, member_1 makes a user, admin_1 INVITES (its own user handle,
# which the walk is free to draw), member_2 creates an event, guest_1 draws an
# ADVANCE that carries the run's clock past the invitation's expiry, and
# admin_1 ACCEPTS -- and the system honors it. cmd/toy compares against
# `ExpiresAt` plus a whole extra lifetime, an undeclared grace, while
# `GET /invitations/<id>/expiry` goes on reporting `ExpiresAt`; the statute's
# `honored_past_expiry` reads the join's own `t` against the reported expiry and
# the finding falls to `default finding := "bug"`.
#
# THE SHRUNK TRACE CONTAINS THE ADVANCE THAT CROSSED THE DEADLINE, which is the
# epic's done-when word for word: step 7 of 8, with the accept at 8. `REDUCED
# 23 step(s) to 8 -- 14 candidate(s)`, dropping `tell` -- the hop turned out
# unnecessary, since the actor that accepted was the actor that invited and so
# already held the claim `may_accept` reads.
#
# `steps=24` IS ON THE LINE for seed 12's reason: the row is a SEQUENCE --
# invite, advance past the expiry, accept -- and it does not fit in ten.
#
# PROVED TO BE THE PLANT AND NOT SOMETHING ELSE, two-sided, which no field of
# the finding could say: both R5 rows and this one arrive as
# `default finding := "bug"` with no clause fired (ratchet, coop r5/178). So
# the same seed was run against an HONEST toy -- the grace removed and nothing
# else -- and it walks all 24 steps at exit 0 with NO finding, its accepts
# refused by name: "accept_invitation declares response.status = 200 and the
# system answered 410". Remove the defect and the row goes; restore it and the
# row returns.
#
# `FOUND bug after step 23 -- data.rumor.statute.finding, rests_on_planted
# false`, byte-identical across two attempts (a2c20f20769767d5), 0 bytes of
# stderr in both. The HONEST finding: it rests on no planted claim, so it is
# the application's own defect and not a lie the run told.
# Measured 2026-10-29 at 8d42087.
3 profile=expiring steps=24

# R7.5's TWO ROWS, ONE PER DIRECTION (issue 115; fable's ruling at coop r7/110,
# "two rows and two worlds, not one row drawn twice"). One start in the day
# before March cannot reach November in a walk any budget allows, so the
# direction is the profile's and not the seed's.
#
# THE DEFECT BOTH NAME is the toy's daily invitation allowance, whose next
# reset it computes as twenty-four hours of WALL time from the start of the
# current local day. That is right on every day of the year except the two a
# daylight-saving transition makes 23 or 25 hours long, and the application
# reports the instant itself -- so the finding is the local clock face of a
# DAILY reset reading something other than 00:00.
#
# 1 profile=dst-spring -- THE RESET AN HOUR LATE. The clock starts midday on
# 2026-03-07, an `advance` lands it in the 23-hour day that follows, and the
# allowance's next reset reads 01:00 local: measured against the running toy at
# one tick past 2026-03-08T06:00:00Z, which is 00:00 CST. Three steps:
# create_user, advance, create_user.
#
# 2 profile=dst-fall -- THE RESET AN HOUR EARLY, which is the same one
# expression wrong in the other direction. The clock starts midday on
# 2026-10-31 and an advance lands it in the 25-hour day, where the reset reads
# 23:00 local -- so an allowance comes back while the day it belongs to is
# still running. Measured at one tick past 2026-11-01T05:00:00Z, which is 00:00
# CDT. Three steps: create_user, advance, advance.
#
# THE ZONE RIDES THE PROFILE, NOT THE ROW (fable, coop rumor/1780). These rows
# name a profile and a step count, as every row does -- this file's grammar
# carries nothing else and r7/109 keeps it that way -- and the engine derives
# the system's zone from the same declarations: `[clock].zone` supplies the
# value and `[adapter].zone_env` names the variable it travels in. So a replay
# from this file alone walks the world these rows describe, and the operator's
# environment is not part of whether they reproduce. MEASURED: both rows run
# byte-identically with TOY_ZONE unset, set to the declared zone, and set to a
# WRONG one, and the toy reports America/Chicago in all three.
#
# IT WAS NOT ALWAYS SO. A comment in platform.toml once said these rows "name
# the variable", and ibis measured that they cannot (rumor/1777): a row
# replayed from the file alone would have started a system configured for
# whatever zone the operator happened to have, and the walk would have reported
# THAT disagreement rather than the defect named here.
#
# WHAT THESE ROWS STILL DO NOT PROVE: which observation produced the finding.
# `rumor run` prints the finding's RULE, and the allowance's arithmetic and a
# zone disagreement both arrive at the same default clause -- so the exit
# status and the trace cannot tell them apart. What the rows now guarantee is
# that no environment can produce the other one through this verb. What proves
# the arithmetic is the four `the-allowance-*` cases here and cmd/toy's
# TestTheInvitationAllowanceResetsAtLocalMidnightExceptWhenItDoesNot, which
# asserts 01:00 on the 23-hour day and 23:00 on the 25-hour one against the
# running application.
1 profile=dst-spring steps=24
2 profile=dst-fall steps=24

# 13 AND 38 -- R9.3'S ROWS, THE TWO PLANTED PAGE FAULTS HEARD THROUGH A REAL
# BROWSER, under `profile=planted` at 40 steps (issue 125 deliverable 3; fable's
# ruling at coop r9/333). These are the first rows here whose finding is heard
# BENEATH a step rather than read as a value, so they are the first that need
# `--browser-check`: the walk drives declared flows through the adapter without
# it, and the adapter has no watch.
#
# THE TWO DEFECTS, AND THEY ARE DIFFERENT ONES. The badge subresource answers
# 500 to a reader holding no relationship to the event, which is true on a FIRST
# render; the planted `console.error` is served when the page's `Rendered`
# disagrees with the store's `Count`, which is the stale count `leaveEvent`
# leaves behind -- a join raises both numbers and is quiet, a leave drops one.
#
# SO THE TWO ROWS ARE A TWO-SIDED PROOF AND NOT A PAIR OF EXAMPLES:
#
#   13  one `page_fault` of kind RESPONSE and no console fault. admin_1 makes
#       the event at step 35, tells viewer_1 at 36, and the render at 37 is the
#       reader's first -- nobody has joined or left it, so the counts agree and
#       the console plant is correctly silent. This row is what makes the badge
#       fault attributable to the ROLE rather than to any page.
#
#   38  BOTH kinds at one step. guest_1 joins its own event at 12 and leaves at
#       24, which is the state the console plant needs, and viewer_1 renders it
#       at 30 -- so the record carries `kind console` and `kind response` for
#       one actor at one step.
#
# A BOUNDED SCAN FOUND THEM, and the bound is part of the result: seeds 1-60 at
# `--profile planted --steps 40`, driven through the adapter first because that
# stage answers the cheaper question of whether the flow reached a page at all.
# SIX of the sixty did -- 13, 38, 41, 44, 47 and 51 -- and the other fifty-four
# were refused at the flow's click. Those two numbers are the result: 54 of 60
# never render, because `visible_to` is drawn from three sets and only one
# carries `guest`, so for the only role that can render a page two draws in
# three answer 404 and there is no join element to click. That is the
# application being right.
#
# WHY THESE TWO OF THE SIX. Of the six that rendered, 13, 41, 47 and 51 render
# an event whose counts agree -- 41 and 47 carry joins and no leave -- and only
# 38 and 44 render one that has had a join AND a leave. So one row of each kind
# was available and 13 and 38 are the smallest of each.
#
# CONSOLE-ALONE IS NOT REACHABLE IN A WALK, and that is the toy's roles rather
# than a gap in the scan. `viewer` is the only role holding a browser context
# and validate's arm 19 refuses a browser role that can also reach non-browser
# actions, so the only actor who can render a page can never join or create an
# event through the API -- every page a walk renders is rendered by a reader
# holding no relationship to the event, and the badge fault therefore fires on
# EVERY rendered page. The independence of the two triggers is driven in
# cmd/toy's arms, where one event in one state is read as an admin, as an
# attendee and as a stranger.
#
# WHAT THESE ROWS DO NOT PROVE, AND ONE OF IT IS A DEFECT I RAISE SEPARATELY:
# that the flow COMPLETED. Under a real browser `join_event_ui` emits no claim
# on either seed -- the page's join form posts to the same handler the API
# action uses, which answers `application/json` with no redirect, so the browser
# navigates off the page and the flow's third step, `wait until count-changed`,
# can never see `#count` again. The adapter models the steps as requests rather
# than as navigation and completes the same seed, which is why no row before
# this one could see it. The faults these rows are about are heard during the
# NAVIGATE, before the click, so they are unaffected either way.
#
# AND BOTH ROWS EXIT 3 WITH A STOPPER NAMED FIRST, which cli.md's row for 3
# requires: a statute `bug` at the same step, reached because the UI join moved
# the world while the claim went unappended, so the next count observation read
# a disagreement. The `page_fault` lines follow it, each carrying `the walk
# continued`.
#
# SO THEY CARRY `witness=heard`, WHICH IS THE WHOLE REASON THAT WORD EXISTS
# (fable's ruling, coop r9/338). Measured: replayed the way the promoted-seed
# arm replays a row -- no `--browser-check` -- both of these exit 3 with ZERO
# `page_fault` lines, passing on the statute bug above instead. A row that
# passes on a defect other than the one it names is what this file exists to
# forbid, so the row DECLARES that its witness is the opt-in browser-check arm.
# The replay arm still asserts of them what it can and says in a sentence that
# the finding is witnessed elsewhere; it does not skip them.
13 profile=planted steps=40 witness=heard
38 profile=planted steps=40 witness=heard
