# PROMOTED SEEDS: one non-negative integer per line, `#` comments allowed
# (docs/contract.md). A promotion carries a comment NAMING THE DEFECT it
# caught, so a line that stops reproducing can be told apart from a line nobody
# can account for -- which is the difference between a regression suite and a
# list of numbers.
#
# D12 AS AMENDED IS WHY THESE TWO AND NOT ONE (breakout-r5/1 item 3): "each of
# the toy's two api-sim bugs found from a COMMITTED SEED by api-sim and shrunk
# to under five actions, every step on a verified clean rollback". Found from a
# COMMITTED seed is part of the done-when, so the shrink's product belongs here
# rather than in a test's temporary directory (fable, coop r5/219).
#
# 2 -- THE STALE COUNT, in FOUR actions. member_2 makes a user, creates an
# event, admin_1 makes a user, and member_2 deletes the event; the observations
# after the delete are still ANSWERED a count for it -- "the disagreement
# between a delete the ledger carries and a count the application still
# reports" (statute.rego's `deleted`). Both the API's denormalized counter and
# the store's attendee list answer, which is why the row is the application's
# and not one endpoint's.
#
# 40 -- A BUG REACHED WITH NO DELETE, in THREE actions. member_1 makes a user,
# creates an event and joins it, and the observation disagrees with what the
# observer may see. THE TRACE PROVES THE ABSENCE OF A DELETE AND NOT WHICH ROW
# THIS IS: once an `event.deleted` claim is in the prefix the statute can reach
# neither `consistent` nor `explained`, so a delete is sufficient for a bug and
# its absence rules the stale count out -- but naming this one the visibility
# leak rests on D12 enumerating exactly two R5-catchable rows and putting the
# capacity race in R8, not on any field of the finding. Both rows arrive as
# `default finding := "bug"` with no clause fired, so no field of
# engine.Finding separates them (ratchet, coop r5/178 and /216).
#
# Both are the HONEST finding -- `rests_on_planted false` -- which is a third of
# a finding's identity, and both are byte-identical across two runs.
# Measured 2026-10-24.
#
# SEED 7 IS RETIRED FROM THIS FILE and stays R5.5's record of D16. It caught
# the stale count in FIVE actions, and the done-when asks for UNDER five; seed
# 2 reaches the same row in four. Keeping both would carry the longer seed for
# a row already covered, and a regression suite is not improved by a second
# witness to one defect.
2
40

# 12 -- R6'S ROW, AND THE FIRST LINE HERE TO NAME A PROFILE. `profile=settling`
# says which weights a replay must use; a line without the token means the
# default mix, which is what 2 and 40 above mean and have always meant. The
# token's grammar is docs/contract.md's, validate's arm 10b refuses one naming
# a profile the platform does not declare, and the profile is what the bug
# ledger's "caught by" column says for this row.
#
# A RETRY DROPPED, A COUNT THAT NEVER SETTLES, in twenty-four steps:
# member_2 recounts its event at step 10 and the worker applies it, asks again
# at 15 and the worker DROPS it as redundant, JOINS at 17 so the attendance
# moves, and asks at 19 and 24 -- each dropped. So the worker's tally still
# reports the number it computed at step 10, for a world that has changed, and
# no later ask repairs it.
#
# `steps=24` IS ON THE LINE AND NOT IN THE ARM THAT REPLAYS IT. The row is a
# SEQUENCE -- recount, change, recount again -- and it does not fit in the ten
# steps seeds 2 and 40 are replayed at. The length was a fact about this seed
# living in tests/run (ratchet, coop r6/106), so the next profiled promotion
# would have inherited 24 and a row needing another length would have read as a
# lost promotion.
#
# IT IS FOUND AS `stale` AND BY THE RECONCILIATION, which is the part the row is
# about: the disagreement is held as `pending` while the probes read busy, and
# the end-of-run reconciliation re-asks it after they read quiet and it still
# disagrees -- docs/vocabulary.md's "a `pending` past its bound". The run ends
# with nothing held open.
#
# `FOUND bug of kind stale after step 24 -- engine.stale, rests_on_planted
# false`, byte-identical across two attempts. The HONEST finding: it rests on no
# planted claim, so it is the toy's own defect and not a lie the run told.
# Measured 2026-10-26 at 2746f81.
12 profile=settling steps=24
# 66 -- NOT A DEFECT, AND THE `witness=` TOKEN IS WHY THIS LINE CAN SAY SO.
# Every other row here promotes a bug and the replay arm requires exit 3 of
# it. This one proves a pending was HELD AND THEN CLEARED: it exits 0 and
# finds nothing, which is the point of it, and adding it without the token
# broke that arm on its own terms (ibis, coop rumor/1238; fable's ruling,
# rumor/1241).
#
# WHAT IT WITNESSES: D1's case and docs/vocabulary.md's clearing half,
# "`pending` until the declared probes read quiet". rook drove fourteen seeds
# at settling/24 and every pending found went stale (coop rumor/1230), so the
# half had no run to read it from.
#
# A BOUNDED SCAN FOUND IT, and the bound is part of the result: seeds 1-200 at
# `rumor run examples/toy --seed N --steps 24 --profile settling`. 74 held a
# pending, THREE cleared -- 66, 75 and 140. Had none cleared the claim would
# have been "not in the first two hundred", never "the toy cannot".
#
# 66 AND NOT 75 OR 140 because it holds TWO, at steps 11 and 20, both
# re-checked consistent, so it exercises the plural case and the sort as well
# as the clearing.
#
# NO NEW PROFILE WAS NEEDED. `settling`'s weights make the dropped retry
# LIKELY, not certain -- recount_event 40 against create_event 8 -- so the
# recoverable window is still reached when the first recount is the observed
# one. fable took the committed seed over a `recovering` profile as the
# smaller change (rumor/1235).
66 profile=settling steps=24 witness=cleared
