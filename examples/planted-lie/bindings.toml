# Bindings for the planted-lie example (R4.2, issue 63).
#
# DERIVED FROM THIS PACKAGE'S OWN CASES, and the derivation is the point: the
# claim type is `user.created`, the observation is `user.count` with source
# `api` and `of = user.created`, and the only actor is alice. docs/contract.md's
# Bindings schema section is the schema; `rumor validate` (R4.3) is what holds a
# project to it.
#
# WHAT THE CASES CANNOT SUPPLY, said rather than invented (rook, coop r4/24): a
# case is a LEDGER INPUT, so it carries claims and an observation and never the
# act that produced them. The action's NAME and its response shape are therefore
# this file's, chosen to match what the claim says happened and nothing more.
#
# THE COLLISION IS RULED (fable, coop r4/45, on quill r4/37): this package's
# bindings are held to the strict reader and to this package's own CASES, in
# both directions, and issue 63's done-when reads "parse and agree with the
# cases" for the R1 three. VALIDATION lives in a purpose-built twin under
# examples/validate/twin/, where a statute with a real precondition rule gives
# arm 3 case material that is derived rather than invented. So `requires` is
# absent here permanently and not pending: adding one would make this fixture
# pretend to be the twin, and the R1 packages are LEDGER fixtures -- their
# statutes judge claims, and their cases carry no actions to have preconditions
# for.
#
# This statute's four rules are three counts and a finding -- `believed`,
# `honest_total`, `rests_on_planted`, `finding` -- so a `requires` here could
# only point at something that is not a precondition.
#
# NO [[role]], for the same discipline: no case in this package carries a role,
# so there is none to declare. role-visibility's bindings do, because its cases
# do.

[[action]]
name = "create_user"
context = "api"
emits = ["user.created"]
creates = ["user"]
response = { status = 201 }

[[observation]]
name = "user.count"
source = "api"
of = "user.created"

[claim."user.created"]
timing = "immediate"
