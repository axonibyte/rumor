# Bindings for the transitive-count example (R4.2, issue 63).
#
# DERIVED FROM THIS PACKAGE'S OWN CASES: the claim type is `user.created`, the
# observation is `user.count` with source `api` and `of = user.created`, and the
# actors are alice, bob, charlie and dana. The package's subject is the one-hop
# `told` flattening, which is the ENGINE's (internal/flatten) and not a
# binding's: a tell never reaches the system under test, so nothing here
# declares one.
#
# THE COLLISION IS RULED (fable, coop r4/45, on quill r4/37): this package's
# bindings are held to the strict reader and to this package's own CASES, in
# both directions, and issue 63's done-when reads "parse and agree with the
# cases" for the R1 three. VALIDATION lives in a purpose-built twin under
# examples/validate/twin/, where a statute with a real precondition rule gives
# arm 3 case material that is derived rather than invented. So `requires` is
# absent here permanently and not pending: adding one would make this fixture
# pretend to be the twin, and the R1 packages are LEDGER fixtures -- their
# statutes judge claims, and their cases carry no actions to have preconditions
# for.
#
# This statute's rules are `believed`, `truth`, `untold_accounts` and `finding`:
# three counts and a finding, with no precondition to reference.
#
# NO [[role]]: no case here carries one.

[[action]]
name = "create_user"
context = "api"
emits = ["user.created"]
creates = ["user"]
response = { status = 201 }

[[observation]]
name = "user.count"
source = "api"
of = "user.created"

[claim."user.created"]
timing = "immediate"
