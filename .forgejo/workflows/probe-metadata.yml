# probe-metadata -- the middle rung between presence and capability.
#
# ratchet r0.2/2: my battery tested `command -v cargo` (PRESENCE) and a full
# `cargo build` (CAPABILITY) and nothing between. `cargo metadata` sits there --
# it compiles NOTHING (measured on a working toolchain: target/ afterwards holds
# only CACHEDIR.TAG) but it does shell out to rustc for target data.
#
# WHAT EACH OUTCOME MEANS, and this is why it is worth a push:
#   metadata OK, build fails  -> the toolchain is broken at COMPILATION only, so
#                                the licence gate becomes wirable the moment a
#                                cargo-deny binary exists by a route that is not
#                                `cargo install`. fmt and clippy still need rustc.
#   metadata FAILS too        -> cargo cannot even query rustc for target info,
#                                the fault is below resolution, and nothing of
#                                R0.2 is wirable at all.
#
# ratchet measured that metadata compiles nothing on a WORKING toolchain and
# explicitly declined to claim it survives a BROKEN one. That is the open
# question and this probe is it.
#
# Instrument, not a test. Comes out with the others.

name: probe-metadata

on:
  push:
    branches:
      - r0.2-ci
  workflow_dispatch:

jobs:
  freebsd:
    runs-on: freebsd-15-jail
    steps:
      - name: cargo metadata in a fresh clone -- resolution without compilation
        run: |
          rm -rf meta-tree
          git clone --quiet --depth 1 https://forge.axonibyte.com/axonibyte/rumor.git meta-tree
          cd meta-tree
          cargo metadata --locked --format-version 1 > ../meta.json 2>../meta.err
          rc=$?
          test "$rc" -eq 0 || { echo "cargo metadata exited $rc"; tail -5 ../meta.err; exit "$rc"; }
          grep -q '"name":"rumor-cli"' ../meta.json
