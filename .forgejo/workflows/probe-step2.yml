# probe-step2 -- ci.yml's step 2 VERBATIM, to isolate the one untested difference.
#
# probe-clone passes and clones with NO --branch. ci.yml's step 2 clones with
# --branch "${GITHUB_REF_NAME:-r0.2-ci}". If the runner sets GITHUB_REF_NAME to
# the full ref (refs/heads/r0.2-ci) rather than the short name, that --branch
# fails immediately -- which is the only candidate left that fits a 2-second
# failure with steps 1 and 2 both passing in isolation.
#
# The variable is the suspect, so this does NOT paper over it with a better
# fallback: it runs the exact line ci.yml runs. A fix tested against a different
# line proves nothing about the line that failed.
#
# Instrument, not a test. Comes out with the others.

name: probe-step2

on:
  push:
    branches:
      - r0.2-ci
  workflow_dispatch:

jobs:
  freebsd:
    runs-on: freebsd-15-jail
    steps:
      - name: ci.yml step 2, exactly as written there
        run: |
          rm -rf src-tree
          git clone --quiet --depth 1 --branch "${GITHUB_REF_NAME:-r0.2-ci}" \
            https://forge.axonibyte.com/axonibyte/rumor.git src-tree
          cd src-tree
          echo "HEAD $(git rev-parse HEAD)"
          test -f Cargo.toml || { echo "no Cargo.toml: wrong tree"; exit 1; }
