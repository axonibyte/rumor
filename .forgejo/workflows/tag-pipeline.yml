# The tag pipeline -- R0.3, issue 4. Runs on a `v*` tag push.
#
# IT PUBLISHES NOTHING WHEN IT REFUSES, which is the epic's wording and the
# reason every check sits BEFORE the build rather than after it. A pipeline that
# builds first and verifies second has already spent the runner on an artifact
# it is about to throw away, and on a single-concurrency runner that is a
# quarter hour nobody else can use.
#
# WHAT IT REFUSES, from the epic's "Tag pipeline" list:
#   - the tag is unsigned or lightweight
#   - the tagged commit is not the head of `main`, or is not a bump commit
#   - the tag version, the VERSION file and the changelog heading disagree
#
# FREEBSD amd64 ONLY. fable ruled it at thread:rumor/332 on ibis's point: cal's
# "no linux runner, just freebsd for now" stands, an artifact nobody ran is not
# a release artifact, so no cross-build. SHA256SUMS covers what was built and
# the release notes say what was not. Linux arrives by its own patch run the day
# a Linux runner exists -- and NOT as a job here in the meantime, because a job
# whose label no runner answers QUEUES rather than failing, which makes every
# green in this file ambiguous (ibis, r0.3/3, carrying fable's rule from
# ask-linux-runner/0).
#
# THE SIGNATURE IS NO LONGER A WAIT (issue 27, v0.1.6). It was one for three
# tags, on the premise that signing needs a key of cal's and none belongs on a
# runner. The premise died on 2026-10-13: the release signer is a MACHINE key,
# anvil@forge-01.corp.axonibyte.com, generated inside this jail by its own user
# and never leaving it (cal's amendment at rumor/435, provisioned by ibis under
# issue 25). So the pipeline signs, verifies its own signature back against the
# committed principal list, and publishes. A missing key is now a refusal that
# NAMES THE FILE, not a wait for a decision -- the decision was made.
#
# AND IT PUBLISHES, which the epic asked for and three tags did not do: the
# release is created for the tag and carries the binary, SHA256SUMS and
# SHA256SUMS.sig, with the tag's changelog section as its body. The upload is
# read back and the asset list compared, because "the POST returned 201" and
# "the release carries three files" are different claims.
#
# FIXTURE TAGS RUN EVERYTHING AND PUBLISH NOTHING. `fixture-v*` is in the
# trigger so this pipeline's refusals can be driven by any agent instead of
# waiting for cal to push deliberately bad `v*` tags (issue 27, item 1). The
# publish step refuses a fixture by the tag's SHAPE, so a fixture that somehow
# passed every check still creates no release.

name: tag-pipeline

on:
  push:
    tags:
      # `fixture-v*` is here so the pipeline's REFUSALS have fixtures without
      # cal pushing deliberately bad `v*` tags (issue 27, item 1: the second
      # option, which keeps the maintainer out of the loop). Every check runs
      # for a fixture; the publish step refuses to publish one, guarded on the
      # tag's shape.
      - "v*"
      - "fixture-v*"
  # DISPATCH, SO THIS FILE CAN BE PROVED BEFORE IT CARRIES A RELEASE (fable
  # go-port/40). Every stale step in here has been found one tag at a time,
  # each costing a release, because the only way to run it was a `v*` push that
  # only cal can make. With a `tag` input the pipeline runs against an EXISTING
  # tag from any ref.
  #
  # A DISPATCH RUNS THE WORKFLOW FILE AT THE REF IT IS DISPATCHED ON (fable
  # go-port/41), so dispatching on a tag would run that tag's old pipeline and
  # prove nothing. The shape is: dispatch on the BRANCH, name the tag in the
  # input. The run then proves the NEW file against an OLD tag -- and creating
  # that older tag's release, with its artefact, is a real side effect rather
  # than a dry run.
  workflow_dispatch:
    inputs:
      tag:
        description: "the existing tag to verify, build and publish"
        required: false

jobs:
  freebsd:
    runs-on: freebsd-15-jail
    timeout-minutes: 45
    # THE THREE REFS A RUN HAS, named once at the job rather than resolved per
    # step. `inputs.tag` is empty on a push; `github.ref_name` is the pushed
    # tag on a push and the BRANCH on a dispatch; `github.sha` is the commit
    # the workflow file itself came from. The fallback is done in shell, not in
    # an expression, so this does not rest on the forge's expression engine
    # supporting `||`.
    env:
      DISPATCH_TAG: ${{ inputs.tag }}
      REF_NAME: ${{ github.ref_name }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: probe the runner (non-fatal; names what is absent)
        run: |
          set -o pipefail
          # THE LINES BELOW ARE A CENSUS, NOT A PROOF, and are deliberately
          # left as bare substitutions. They are not labeled PROOF and assert
          # nothing: a blank `uname` degrades the record without claiming
          # anything false, which is the distinction the swept sites failed.
          # The `command -v` line is the pattern to copy -- its status is
          # consumed into FOUND/ABSENT branches rather than discarded.
          # Interpolations inside REFUSAL branches elsewhere in this file are
          # also left alone: an empty one is itself information, and the step is
          # already exiting non-zero.
          echo "uname   $(uname -a)"
          for t in git go go126 go125 gofmt sha256 sha256sum ssh-keygen python3 gpg; do
            p=$(command -v "$t" 2>/dev/null) && echo "$t  FOUND  $p" || echo "$t  ABSENT"
          done

      - name: fetch the tree and its tags
        run: |
          set -o pipefail
          rm -rf src-tree
          rc=0
          timeout 300 git clone --quiet \
            https://forge.axonibyte.com/axonibyte/rumor.git src-tree || rc=$?
          test "$rc" -eq 124 && { echo "HANG: git clone exceeded 300s. rc 124 proves only that the time elapsed. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "git clone exited $rc"; exit "$rc"; }
          cd src-tree
          rc=0
          timeout 120 git fetch --quiet --tags origin || rc=$?
          test "$rc" -eq 124 && { echo "HANG: git fetch --tags exceeded 120s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "git fetch --tags exited $rc"; exit "$rc"; }
          # ASSERTED, for release-gate.yml's reason: this is the only record of
          # the main this tag is checked against, and an unasserted substitution
          # printed "PROOF origin/main " and published anyway.
          MAINSHA=$(timeout 30 git rev-parse origin/main) || MAINSHA=""
          test -n "$MAINSHA" || { echo "could not read origin/main, and every check below compares the tag against it. Publishing nothing."; exit 1; }
          echo "PROOF origin/main $MAINSHA"

      - name: resolve the tag under test, and check the tree out AT it
        run: |
          set -o pipefail
          # THE AUDIT FINDING THIS STEP EXISTS FOR (issue 27, second pass).
          # Nothing in this pipeline checked out the tag. `git clone` leaves the
          # DEFAULT BRANCH checked out, so every step that read a file -- the
          # VERSION/changelog agreement, the build, and `tools/` itself -- was
          # reading main and calling it the tag. On a fast-forward release the
          # two coincide, which is why five tag runs never showed it; a dispatch
          # against an older tag separates them immediately, and so would a tag
          # pushed for anything but main's head.
          #
          # TWO TREES, DELIBERATELY. The RELEASE is the tag's tree: that is what
          # gets built, checksummed and published. The INFRASTRUCTURE is this
          # workflow's own commit: the file running is from WORKFLOW_SHA, so the
          # tools it calls must be too, or a dispatch proving a new pipeline
          # would run the old pipeline's tools. On a `v*` push the two are the
          # same commit and the second checkout is a no-op.
          TAG="${DISPATCH_TAG:-$REF_NAME}"
          test -n "$TAG" || { echo "neither the dispatch input nor the ref names a tag, so there is nothing to release. Publishing nothing."; exit 1; }
          cd src-tree
          timeout 30 git rev-parse -q --verify "refs/tags/${TAG}" > ../tagsha.txt 2>&1 \
            || { echo "$TAG is not a tag in this repository. On a dispatch, name an EXISTING tag in the input; the input was '${DISPATCH_TAG}' and the ref is '${REF_NAME}'. Publishing nothing."; exit 1; }
          TAGSHA=""; read -r TAGSHA < ../tagsha.txt || true
          test -n "$TAGSHA" || { echo "could not read the object id for $TAG. Publishing nothing."; exit 1; }
          TAGCOMMIT=$(timeout 30 git rev-parse "${TAG}^{commit}") || TAGCOMMIT=""
          test -n "$TAGCOMMIT" || { echo "could not peel $TAG to a commit. Publishing nothing."; exit 1; }
          rc=0
          timeout 60 git checkout -q --detach "$TAGCOMMIT" > ../checkout.log 2>&1 || rc=$?
          cat ../checkout.log
          test "$rc" -eq 0 || { echo "could not check out $TAG at $TAGCOMMIT (exited $rc). Publishing nothing."; exit 1; }
          # ASSERTED, NOT ASSUMED: this is the whole point of the step, and an
          # unasserted checkout is exactly the defect being fixed.
          HEADSHA=$(timeout 30 git rev-parse HEAD) || HEADSHA=""
          test "$HEADSHA" = "$TAGCOMMIT" \
            || { echo "asked for $TAGCOMMIT and HEAD reads '$HEADSHA': the checkout did not take, so every file read below would be the wrong tree. Publishing nothing."; exit 1; }
          echo "PROOF the tree is checked out at $TAG, commit $TAGCOMMIT"
          # tools/ FROM THE WORKFLOW'S OWN COMMIT, for the reason above.
          test -n "$WORKFLOW_SHA" || { echo "github.sha is empty, so this run cannot tell which commit its own workflow came from. Publishing nothing."; exit 1; }
          rc=0
          timeout 60 git checkout -q "$WORKFLOW_SHA" -- tools/ > ../tools.log 2>&1 || rc=$?
          cat ../tools.log
          test "$rc" -eq 0 || { echo "could not take tools/ from $WORKFLOW_SHA (exited $rc): the clone may not carry that commit. Publishing nothing."; exit 1; }
          timeout 30 git diff --quiet "$WORKFLOW_SHA" -- tools/ \
            || { echo "tools/ does not match $WORKFLOW_SHA after checking it out from there, so what runs below is not this workflow's tooling. Publishing nothing."; exit 1; }
          echo "PROOF tools/ is taken from this workflow's own commit $WORKFLOW_SHA"
          printf '%s\n' "$TAG" > ../tag-under-test
          echo "PROOF the tag under test is $TAG, from $(test -n "$DISPATCH_TAG" && echo "the dispatch input" || echo "the pushed ref")"

      - name: the tag is ANNOTATED, not lightweight
        run: |
          set -o pipefail
          cd src-tree
          # ONE RESOLUTION, read back: the fallback between the dispatch input
          # and the pushed ref is done once, in the resolve step, so six steps
          # cannot drift about which tag this run is for.
          TAG=""; read -r TAG < ../tag-under-test || true
          test -n "$TAG" || { echo "../tag-under-test is empty or missing: the resolve step did not run, so this step does not know which tag it is checking. Publishing nothing."; exit 1; }
          echo "tag under test: $TAG"
          rc=0
          timeout 30 git cat-file -t "$TAG" > ../tagtype.log 2>&1 || rc=$?
          cat ../tagtype.log
          test "$rc" -eq 0 || { echo "git cat-file could not read $TAG: exited $rc"; exit 1; }
          # A LIGHTWEIGHT TAG IS A REF TO A COMMIT, so cat-file -t says `commit`;
          # an annotated one is its own object and says `tag`. Checking the
          # OBJECT TYPE rather than looking for a message: an annotated tag with
          # an empty message is still annotated, and a lightweight one can never
          # carry a signature at all.
          grep -qx 'tag' ../tagtype.log \
            || { echo "$TAG is LIGHTWEIGHT (object type $(cat ../tagtype.log)), and the epic requires an annotated, signed tag. Publishing nothing."; exit 1; }
          echo "PROOF $TAG is an annotated tag object"

      - name: the tag is SIGNED and verifies
        run: |
          set -o pipefail
          cd src-tree
          # ONE RESOLUTION, read back: the fallback between the dispatch input
          # and the pushed ref is done once, in the resolve step, so six steps
          # cannot drift about which tag this run is for.
          TAG=""; read -r TAG < ../tag-under-test || true
          test -n "$TAG" || { echo "../tag-under-test is empty or missing: the resolve step did not run, so this step does not know which tag it is checking. Publishing nothing."; exit 1; }
          # TWO ORACLES, because "verify failed" and "no key to verify with" are
          # different findings and only one of them is about the tag. First the
          # object must CARRY a signature; then it must verify.
          rc=0
          timeout 30 git cat-file tag "$TAG" > ../tagobj.log 2>&1 || rc=$?
          test "$rc" -eq 0 || { echo "git cat-file tag $TAG exited $rc"; exit 1; }
          grep -qE 'BEGIN (PGP|SSH) SIGNATURE' ../tagobj.log \
            || { echo "$TAG carries NO signature. The epic requires a signed tag; publishing nothing."; exit 1; }
          echo "PROOF $TAG carries a signature block"
          # POINT GIT AT THE TRUST STORE, WHICH IS WHY v0.1.4 FAILED (issue 39).
          # Without this, `git verify-tag` on an ssh-signed tag does not check
          # the signature at all: it errors with "gpg.ssh.allowedSignersFile
          # needs to be configured and exist", which run 162 reported as a
          # failed verification -- accusing a correctly signed tag.
          #
          # The path is the file ibis provisioned in this jail (issue 25,
          # comment 123): root:act_runner 0644, cal's two keys under
          # namespaces="git" and anvil's under namespaces="file". It is a
          # LITERAL here on purpose; deriving it from whatever the runner
          # happens to have would make this step agree with any store at all.
          SIGNERS=/usr/local/etc/anvil/allowed_signers
          test -r "$SIGNERS" || { echo "the allowed-signers file $SIGNERS is absent or unreadable by this runner's user, so no signature can be checked here. That is a PROVISIONING finding, not a verdict on $TAG, and it is NOT a pass. See issue 25."; exit 1; }
          echo "PROOF trust store $SIGNERS readable, $(grep -c . "$SIGNERS") principal line(s)"
          timeout 30 git config gpg.ssh.allowedSignersFile "$SIGNERS"
          CONFIGURED=$(timeout 30 git config --get gpg.ssh.allowedSignersFile) || CONFIGURED=""
          test "$CONFIGURED" = "$SIGNERS" || { echo "git config gpg.ssh.allowedSignersFile did not take: it reads '$CONFIGURED'. Publishing nothing."; exit 1; }
          echo "PROOF git reads gpg.ssh.allowedSignersFile as $CONFIGURED"
          rc=0
          timeout 60 git verify-tag "$TAG" > ../verify.log 2>&1 || rc=$?
          cat ../verify.log
          test "$rc" -eq 124 && { echo "HANG: git verify-tag exceeded 60s. RUNNER finding."; exit 124; }
          # THE THREE ANSWERS COME FROM tools/verify-tag-verdict.sh, one
          # implementation with a battery over the strings this project has
          # really seen -- including run 162's. The classification used to be
          # inline here and was wrong in two directions at once: it missed
          # git's own words for an unconfigured store, and it read "no
          # principal" beside a GOOD signature as provisioning, which grants
          # an untrusted signer what it should refuse (quill, rumor/448). A
          # step is only exercised by pushing a tag, so the logic lives where
          # it can be driven.
          vrc=0
          sh tools/verify-tag-verdict.sh ../verify.log "$rc" || vrc=$?
          case "$vrc" in
            0) echo "PROOF $TAG verifies against this runner's trust store"; exit 0 ;;
            2) echo "PROVISIONING: $TAG could not be checked here, and that is not a verdict on the tag"; exit 1 ;;
            *) echo "REFUSED: $TAG does not verify, and publishing nothing is the verdict"; exit 1 ;;
          esac

      - name: the tagged commit is main's head AND a bump commit
        run: |
          set -o pipefail
          cd src-tree
          # ONE RESOLUTION, read back: the fallback between the dispatch input
          # and the pushed ref is done once, in the resolve step, so six steps
          # cannot drift about which tag this run is for.
          TAG=""; read -r TAG < ../tag-under-test || true
          test -n "$TAG" || { echo "../tag-under-test is empty or missing: the resolve step did not run, so this step does not know which tag it is checking. Publishing nothing."; exit 1; }
          # PEEL THE TAG TO ITS COMMIT. `rev-parse <annotated tag>` gives the TAG
          # OBJECT's sha, and comparing that to a commit sha never matches --
          # a defect I found in the gate by driving it against a real annotated
          # tag rather than a fixture.
          TAGGED=$(timeout 30 git rev-parse "${TAG}^{commit}")
          MAINHEAD=$(timeout 30 git rev-parse origin/main)
          echo "tagged commit  $TAGGED"
          echo "main head      $MAINHEAD"
          test "$TAGGED" = "$MAINHEAD" \
            || { echo "the tagged commit is not the head of main, so this tag does not name a landed release. Publishing nothing."; exit 1; }
          SUBJECT=$(timeout 30 git log -1 --format=%s "$TAGGED")
          echo "subject        $SUBJECT"
          echo "$SUBJECT" | grep -qE '^release: v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "the tagged commit is not a bump commit: its subject is not 'release: vX.Y.Z'. Publishing nothing."; exit 1; }
          echo "PROOF the tagged commit is main's head and a bump commit"

      - name: the tag, the version file and the changelog agree
        run: |
          set -o pipefail
          cd src-tree
          # ONE RESOLUTION, read back: the fallback between the dispatch input
          # and the pushed ref is done once, in the resolve step, so six steps
          # cannot drift about which tag this run is for.
          TAG=""; read -r TAG < ../tag-under-test || true
          test -n "$TAG" || { echo "../tag-under-test is empty or missing: the resolve step did not run, so this step does not know which tag it is checking. Publishing nothing."; exit 1; }
          TAGVER="${TAG#v}"
          # DERIVED, never a literal: a hardcoded version here would agree with
          # itself at one release and be wrong at every other.
          # THE `|| true` HERE IS RE-ESTABLISHED ON THE NEXT LINE and is not the
          # discarded-status shape: an empty read is caught by `test -n` with a
          # better message than pipefail would give. Left as it is deliberately,
          # so a reader comparing the three sites sees which one is which.
          # THE VERSION FILE, NOT THE MANIFEST, since G1: go.mod has no version
          # field, so a Go module's committed version lives in VERSION. See
          # tools/release-gate.py's project_version for the same decision and
          # the reason a two-way tag-against-changelog check would be weaker.
          #
          # STRICTNESS IS DUPLICATED HERE ON PURPOSE AND MUST MATCH THAT READER.
          # Two readers for one fact can disagree about what is well-formed, and
          # then one publishes what the other refuses. The python side accepts a
          # single line of dot-separated digits and nothing else; these three
          # tests are that rule written out -- exactly one non-blank line, no
          # stray whitespace, digits and dots only. If either side is loosened,
          # loosen both in the same commit or the pair stops being a pair.
          test -f VERSION || { echo "no VERSION file: nothing to compare the tag against. Publishing nothing."; exit 1; }
          LINES=$(grep -c . VERSION || true)
          test "$LINES" = "1" || { echo "VERSION holds $LINES non-blank lines, not 1: a version file that is not one line is not readable as a version. Publishing nothing."; exit 1; }
          MANVER=$(head -1 VERSION || true)
          test -n "$MANVER" || { echo "could not read the project version from VERSION"; exit 1; }
          case "$MANVER" in
            *[!0-9.]*|""|.*|*.) echo "VERSION reads '$MANVER', which is not dot-separated digits -- a tag-shaped 'v1.2.3' or a trailing space would otherwise agree with a tag by accident. Publishing nothing."; exit 1 ;;
          esac
          echo "tag            $TAGVER"
          echo "VERSION        $MANVER"
          test "$TAGVER" = "$MANVER" \
            || { echo "the tag says $TAGVER and VERSION says $MANVER: they disagree. Publishing nothing."; exit 1; }
          grep -qE "^## +${TAGVER} +(--|—|-) +[0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md \
            || { echo "CHANGELOG.md has no dated section headed $TAGVER: the three must agree. Publishing nothing."; exit 1; }
          echo "PROOF the tag, VERSION and the changelog all say $TAGVER"

      - name: build the FreeBSD amd64 release binary
        run: |
          set -o pipefail
          cd src-tree
          GO=""
          for c in go go126 go125; do
            command -v "$c" >/dev/null 2>&1 && { GO="$c"; break; }
          done
          test -n "$GO" || { echo "no go, go126 or go125 on PATH: this jail has no Go toolchain, which is a PROVISIONING finding and not a code one. Publishing nothing."; exit 1; }
          # See ci.yml for why this is a gate: under the default `auto` a go
          # directive above the installed toolchain is satisfied by silently
          # downloading another, and a release built by a compiler nobody chose
          # is the one artefact that must never happen quietly.
          export GOTOOLCHAIN=local
          rc=0
          # -o ../rumor-release, OUTSIDE the clone: ci.yml run 142 went red
          # because a binary built into src-tree was walked by `docs --check`
          # and reported unmapped. -trimpath so the artefact carries no build
          # path from this runner.
          timeout 1800 "$GO" build -trimpath -o ../rumor-release ./cmd/rumor > ../build.log 2>&1 || rc=$?
          tail -20 ../build.log
          test "$rc" -eq 124 && { echo "HANG: the release build exceeded 1800s. rc 124 proves only that the time elapsed -- read build.log: a stall with no output is route or DNS to the module proxy, though this module has no dependencies to fetch. RUNNER finding either way."; exit 124; }
          test "$rc" -eq 0 || { echo "go build exited $rc"; exit "$rc"; }
          test -x ../rumor-release || { echo "no release binary produced"; exit 1; }
          echo "PROOF compiled by: $(timeout 30 "$GO" version -m ../rumor-release 2>&1 | head -1)"
          # ASSERTED NON-EMPTY, for release-gate.yml's reason: a PROOF that
          # the binary RAN cannot be backed by `test -x`, which only says it
          # exists, and with `|| true` a binary that produced no output printed
          # "PROOF built " and passed. The status is re-established rather than
          # discarded.
          timeout 30 ../rumor-release > ../ran.txt 2>&1 || true
          RAN=""
          read -r RAN < ../ran.txt || true
          test -n "$RAN" || { echo "the release binary produced no output, so this step cannot show that it runs: test -x proves it exists, not that it executes"; exit 1; }
          echo "PROOF built $RAN"
          # THE PLATFORM IS ASSERTED FROM TWO SOURCES, NOT ONE, and that is a
          # sharpening of the rustc -vV check this replaces rather than a
          # translation of it. `rustc -vV` reported a HOST triple, so one read
          # answered both "which machine" and "which target". Go splits them:
          # `go env GOOS GOARCH` reports what the toolchain will BUILD FOR, which
          # an environment variable can set, so it is a target measurement and
          # not a host one. Asserting only that would let a cross-compile pass;
          # asserting only uname would let a cross-compiled artefact ship from
          # the right machine. Both, so either mistake refuses.
          #
          # The reason the original gave still holds and is why this is asserted
          # at all: this pipeline builds exactly one target by decision (fable
          # thread:rumor/332), and `runs-on` is a LABEL -- a proxy for the
          # platform, never a measurement of it. Unasserted, this step would
          # print a PROOF line naming a platform that contradicts the artefact
          # beside it, which is rook thread:r0.3/33's shape.
          rc=0
          timeout 30 uname -s > ../host-os.txt 2>&1 || rc=$?
          test "$rc" -eq 0 || { cat ../host-os.txt; echo "uname -s exited $rc, so the host is unmeasured. Publishing nothing."; exit 1; }
          rc=0
          timeout 30 uname -m > ../host-arch.txt 2>&1 || rc=$?
          test "$rc" -eq 0 || { cat ../host-arch.txt; echo "uname -m exited $rc, so the host is unmeasured. Publishing nothing."; exit 1; }
          HOST_OS=""; read -r HOST_OS < ../host-os.txt || true
          HOST_ARCH=""; read -r HOST_ARCH < ../host-arch.txt || true
          test "$HOST_OS" = "FreeBSD" || { echo "the host reports $HOST_OS and this pipeline publishes only from FreeBSD: the wrong runner answered the job. Publishing nothing."; exit 1; }
          test "$HOST_ARCH" = "amd64" || { echo "the host reports $HOST_ARCH and this pipeline publishes only amd64. Publishing nothing."; exit 1; }
          rc=0
          timeout 30 "$GO" env GOOS GOARCH > ../target.txt 2>&1 || rc=$?
          test "$rc" -eq 0 || { cat ../target.txt; echo "go env exited $rc, so the target is unmeasured. Publishing nothing."; exit 1; }
          TGT_OS=""; TGT_ARCH=""
          { read -r TGT_OS; read -r TGT_ARCH; } < ../target.txt || true
          test "$TGT_OS" = "freebsd" || { echo "the toolchain targets $TGT_OS, not freebsd: this would publish a cross-compiled artefact. Publishing nothing."; exit 1; }
          test "$TGT_ARCH" = "amd64" || { echo "the toolchain targets $TGT_ARCH, not amd64. Publishing nothing."; exit 1; }
          PLATFORM="${TGT_OS}-${TGT_ARCH}"
          echo "PROOF host $HOST_OS/$HOST_ARCH and target $PLATFORM agree, and that pair is the only one this pipeline builds"

      - name: write SHA256SUMS over what was actually built
        run: |
          set -o pipefail
          cd src-tree
          # ONE RESOLUTION, read back: the fallback between the dispatch input
          # and the pushed ref is done once, in the resolve step, so six steps
          # cannot drift about which tag this run is for.
          TAG=""; read -r TAG < ../tag-under-test || true
          test -n "$TAG" || { echo "../tag-under-test is empty or missing: the resolve step did not run, so this step does not know which tag it is checking. Publishing nothing."; exit 1; }
          rm -rf ../dist && mkdir -p ../dist
          # ASSERTED AGAIN HERE, because each step is its own shell and inherits
          # nothing from the one that checked it. The artefact NAME embeds this
          # value, so an unchecked platform would produce a correctly-named Linux
          # artefact from a pipeline that promises only FreeBSD amd64 -- honest
          # filename, broken contract.
          GO=""
          for c in go go126 go125; do
            command -v "$c" >/dev/null 2>&1 && { GO="$c"; break; }
          done
          test -n "$GO" || { echo "no go, go126 or go125 on PATH. Publishing nothing."; exit 1; }
          export GOTOOLCHAIN=local
          rc=0
          timeout 30 uname -s > ../host-os2.txt 2>&1 || rc=$?
          test "$rc" -eq 0 || { echo "uname -s exited $rc"; exit 1; }
          rc=0
          timeout 30 uname -m > ../host-arch2.txt 2>&1 || rc=$?
          test "$rc" -eq 0 || { echo "uname -m exited $rc"; exit 1; }
          HOST_OS=""; read -r HOST_OS < ../host-os2.txt || true
          HOST_ARCH=""; read -r HOST_ARCH < ../host-arch2.txt || true
          test "$HOST_OS" = "FreeBSD" || { echo "the host reports $HOST_OS, not FreeBSD. Publishing nothing."; exit 1; }
          test "$HOST_ARCH" = "amd64" || { echo "the host reports $HOST_ARCH, not amd64. Publishing nothing."; exit 1; }
          rc=0
          timeout 30 "$GO" env GOOS GOARCH > ../target2.txt 2>&1 || rc=$?
          test "$rc" -eq 0 || { echo "go env exited $rc"; exit 1; }
          TGT_OS=""; TGT_ARCH=""
          { read -r TGT_OS; read -r TGT_ARCH; } < ../target2.txt || true
          test "$TGT_OS" = "freebsd" || { echo "the toolchain targets $TGT_OS, not freebsd. Publishing nothing."; exit 1; }
          test "$TGT_ARCH" = "amd64" || { echo "the toolchain targets $TGT_ARCH, not amd64. Publishing nothing."; exit 1; }
          PLATFORM="${TGT_OS}-${TGT_ARCH}"
          # THE ARTEFACT NAME CHANGES WITH THE LANGUAGE, and this is user-visible.
          # v0.1.0 to v0.1.3 published `rumor-<tag>-x86_64-unknown-freebsd`: an
          # LLVM target triple, which is a Rust concept and no longer describes
          # how this binary is built. Keeping it would be a filename that lies
          # about its provenance. From v0.1.4 the suffix is Go's own GOOS-GOARCH,
          # `freebsd-amd64`, measured above rather than written in.
          NAME="rumor-${TAG}-${PLATFORM}"
          cp ../rumor-release "../dist/${NAME}"
          cd ../dist
          # sha256 on FreeBSD, sha256sum elsewhere: measured rather than assumed,
          # and an absent digest tool is a named finding rather than an empty file.
          rc=0
          if command -v sha256 >/dev/null 2>&1; then
            timeout 120 sha256 -r "${NAME}" > SHA256SUMS 2>../sums.err || rc=$?
          elif command -v sha256sum >/dev/null 2>&1; then
            timeout 120 sha256sum "${NAME}" > SHA256SUMS 2>../sums.err || rc=$?
          else
            echo "neither sha256 nor sha256sum is on this runner, so no checksum can be written"; exit 1
          fi
          test "$rc" -eq 0 || { cat ../sums.err; echo "the checksum tool exited $rc"; exit "$rc"; }
          # A TRANSFORM LAUNDERS A FAILURE: sha256 of nothing is a valid-looking
          # file, so the emptiness and the NAME are both asserted rather than the
          # command's success alone.
          test -s SHA256SUMS || { echo "SHA256SUMS is empty"; exit 1; }
          grep -q "${NAME}" SHA256SUMS || { echo "SHA256SUMS does not name ${NAME}"; exit 1; }
          # "AND NOTHING ELSE" WAS AN UNASSERTED HALF OF THE CLAIM. Emptiness and
          # the name were checked; the count was not, so the line said more than
          # the step had measured -- the same defect as a docstring claiming a
          # ref it never read. One line is what "nothing else" means for a
          # checksum file, so the count is asserted and the number is printed.
          SUMLINES=$(grep -c . SHA256SUMS)
          test "$SUMLINES" -eq 1 \
            || { cat SHA256SUMS; echo "SHA256SUMS has $SUMLINES entries and this pipeline builds exactly one artifact: something else was built, or the file was appended to. Publishing nothing."; exit 1; }
          cat SHA256SUMS
          echo "PROOF SHA256SUMS has $SUMLINES entry and it names ${NAME} (FreeBSD amd64 only, fable thread:rumor/332)"

      - name: sign SHA256SUMS with the release key
        run: |
          set -o pipefail
          cd dist
          # THE SIGNER IS A MACHINE KEY, NOT THE MAINTAINER'S (issue 27, v0.1.6).
          # This step used to look for gpg and, finding none, report a "NAMED
          # WAIT" for a maintainer key to arrive on the runner. Both halves of
          # that premise are dead: cal's amendment at rumor/435 decided SSH
          # signing, and nothing of the maintainer's belongs on a runner. The
          # key is anvil@forge-01.corp.axonibyte.com, generated inside this jail
          # by its own user and never leaving it, provisioned under issue 25 and
          # proven to sign as act_runner (ibis rumor/451).
          #
          # ABSENCE IS A REFUSAL BY NAME, not a wait. The distinction that
          # matters is no longer "signed or waiting" but "signed or say exactly
          # which file is missing", because a missing key is now a provisioning
          # defect in a jail that has been provisioned, not a decision nobody
          # has made.
          KEY=/usr/local/etc/anvil/anvil_ed25519
          SIGNERS=/usr/local/etc/anvil/allowed_signers
          command -v ssh-keygen >/dev/null 2>&1 \
            || { echo "ssh-keygen is ABSENT on this runner and it is the signer. FreeBSD-ssh is in docs/release.md's runner table; this is a PROVISIONING finding. Publishing nothing."; exit 1; }
          test -r "$KEY" \
            || { echo "the release key $KEY is absent or unreadable by this runner's user, so SHA256SUMS cannot be signed. ibis provisioned it root:act_runner 0640 under issue 25; a mode or ownership change is the likely cause. PROVISIONING finding, publishing nothing."; exit 1; }
          rc=0
          timeout 120 ssh-keygen -Y sign -n file -f "$KEY" SHA256SUMS > ../sign.log 2>&1 || rc=$?
          cat ../sign.log
          test "$rc" -eq 0 \
            || { echo "ssh-keygen -Y sign exited $rc. SHA256SUMS IS WRITTEN AND UNSIGNED, and publishing nothing is the verdict."; exit 1; }
          test -s SHA256SUMS.sig \
            || { echo "ssh-keygen exited 0 and wrote no signature at SHA256SUMS.sig: a zero status with no artefact is the shape this pipeline refuses everywhere else."; exit 1; }
          echo "PROOF SHA256SUMS.sig written, $(wc -c < SHA256SUMS.sig) bytes"

      - name: verify the signature back, in this run
        run: |
          set -o pipefail
          cd dist
          # TWO ORACLES ON ONE CLAIM. "ssh-keygen exited 0" says the signer ran;
          # it does not say the signature verifies against the list a consumer
          # would use. So the run checks its own output with the VERIFIER's
          # tool and the committed principal list, which is also the only thing
          # here that would catch a signature made with a key nobody trusts.
          SIGNERS=/usr/local/etc/anvil/allowed_signers
          IDENTITY=anvil@forge-01.corp.axonibyte.com
          test -r "$SIGNERS" \
            || { echo "the allowed-signers file $SIGNERS is unreadable, so this run cannot verify its own signature. PROVISIONING finding, publishing nothing."; exit 1; }
          rc=0
          timeout 60 ssh-keygen -Y verify -f "$SIGNERS" -I "$IDENTITY" -n file \
            -s SHA256SUMS.sig < SHA256SUMS > ../verify-sums.log 2>&1 || rc=$?
          cat ../verify-sums.log
          test "$rc" -eq 0 \
            || { echo "the signature this run just made does NOT verify against $SIGNERS for $IDENTITY (exited $rc). Publishing nothing."; exit 1; }
          # THE STATUS IS NOT THE WHOLE ANSWER: assert the verdict line, since
          # a tool that prints nothing and exits 0 would otherwise pass.
          grep -q 'Good "file" signature' ../verify-sums.log \
            || { echo "ssh-keygen -Y verify exited 0 without printing a good-signature line, so what it checked is unclear. Publishing nothing."; exit 1; }
          echo "PROOF SHA256SUMS.sig verifies as $IDENTITY against the committed principal list"

      - name: create the release and attach the three files
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          # `cd` FIRST, because the resolved tag is read as ../tag-under-test
          # and every other step reads it from inside src-tree. Before the cd
          # that path points ABOVE the workspace: the file would be missing and
          # this step would refuse with the resolve step's message, naming the
          # wrong cause.
          cd src-tree
          # ONE RESOLUTION, read back: the fallback between the dispatch input
          # and the pushed ref is done once, in the resolve step, so six steps
          # cannot drift about which tag this run is for.
          TAG=""; read -r TAG < ../tag-under-test || true
          test -n "$TAG" || { echo "../tag-under-test is empty or missing: the resolve step did not run, so this step does not know which tag it is checking. Publishing nothing."; exit 1; }
          # A FIXTURE TAG NEVER PUBLISHES. The fixture trigger exists so the
          # pipeline's refusals can be driven without cal pushing deliberately
          # bad `v*` tags (issue 27, item 1), and a fixture that reached this
          # step would otherwise create a real release. The guard is on the TAG
          # SHAPE rather than on a variable a step could forget to set.
          case "$TAG" in
            fixture-v*)
              echo "PROOF $TAG is a fixture tag: every check above ran and nothing is published. That is the point of the fixture."
              exit 0
              ;;
          esac
          command -v python3 >/dev/null 2>&1 \
            || { echo "python3 is ABSENT and tools/forge-release.py needs it. It is in docs/release.md's runner table and release-gate.yml measures it too; PROVISIONING finding, publishing nothing."; exit 1; }
          # THE ARTEFACT'S NAME IS READ OFF SHA256SUMS, not rebuilt from the tag
          # and the platform. The build step composes that name and this step
          # cannot see its variables, so re-deriving it here would be a second
          # copy of the naming rule that drifts silently -- and SHA256SUMS is
          # the record of what was ACTUALLY built, which is the stronger source.
          BIN=$(awk 'NR==1 {print $NF}' ../dist/SHA256SUMS)
          test -n "$BIN" \
            || { echo "SHA256SUMS names no file on its first line, so this step cannot tell what to attach. Publishing nothing."; exit 1; }
          test -s "../dist/$BIN" \
            || { echo "SHA256SUMS names $BIN and ../dist/$BIN is missing or empty: the checksum file and the build disagree. Publishing nothing."; exit 1; }
          echo "PROOF the artefact to attach is $BIN, named by SHA256SUMS itself"
          rc=0
          timeout 300 python3 tools/forge-release.py \
            --tag "$TAG" --body-from CHANGELOG.md \
            --asset "../dist/$BIN" \
            --asset ../dist/SHA256SUMS \
            --asset ../dist/SHA256SUMS.sig > ../release.log 2>&1 || rc=$?
          cat ../release.log
          # `if` RATHER THAN `test ... && { }`: this file documents that the
          # bare-and form is a trap under `set -e`, and a guard that aborts the
          # step it is guarding would turn a provisioning finding into a silent
          # failure one line early.
          if [ "$rc" -eq 2 ]; then
            echo "the release could not be ATTEMPTED, which is a provisioning finding and not a verdict on the tag: see the line above. Publishing nothing."
            exit 1
          fi
          if [ "$rc" -eq 3 ]; then
            echo "tools/forge-release.py was CALLED WRONGLY, which is a defect in this workflow rather than anything about the tag or the runner. Publishing nothing."
            exit 1
          fi
          test "$rc" -eq 0 || { echo "creating or attaching the release failed (exited $rc). Publishing nothing."; exit 1; }
          echo "PROOF $TAG is published with its binary, SHA256SUMS and SHA256SUMS.sig"
