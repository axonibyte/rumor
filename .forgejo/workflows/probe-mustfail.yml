# probe-mustfail -- a NEGATIVE control. This workflow MUST report failure.
#
# WHY IT EXISTS, and it is the hole in my own experiment: probe-alive is a
# POSITIVE control and seven probes have now reported success. That is
# indistinguishable from a runner that marks every run success regardless of
# what the step returns -- and every conclusion I have drawn from those seven
# rests on being able to tell the two apart. A battery of passing arms with no
# arm that must fail proves nothing; the room has spent two days on exactly
# this shape pointed the other way.
#
# If this reports SUCCESS, discard every probe result on this branch.
# If it reports FAILURE, the other seven mean what they say.
#
# Instrument, not a test. Comes out with the others.

name: probe-mustfail

on:
  push:
    branches:
      - r0.2-ci
  workflow_dispatch:

jobs:
  freebsd:
    runs-on: freebsd-15-jail
    steps:
      - name: exit nonzero on purpose
        run: |
          echo "this step exits 1 deliberately; a success here voids the battery"
          exit 1
