# probe-pkg -- can the runner USE pkg at all? DRY RUN ONLY.
#
# ratchet r0.2/4 found that devel/cargo-deny is a FreeBSD package at 0.20.2_2,
# the exact version their deny.toml pins, so the licence gate may be installable
# without any compiler. The open question is whether this runner has the
# privilege: pkg refuses in ratchet's own jail with
# "mkdir(/var/db/pkg): Permission denied".
#
# THIS PROBE DELIBERATELY DOES NOT INSTALL ANYTHING. forge-01_jail is cal's
# infrastructure, and installing a package on it is an ACTION on a host rather
# than a measurement -- not mine to take unasked, even for a package the gate
# would want. So: a remote query (no local db write) and `install -n`, which is
# pkg's own dry run. If both pass, the install is available and cal or an
# explicit go can make it; this probe reports, it does not change the runner.
#
# Instrument, not a test. Comes out with the others.

name: probe-pkg

on:
  push:
    branches:
      - r0.2-ci
  workflow_dispatch:

jobs:
  freebsd:
    runs-on: freebsd-15-jail
    steps:
      - name: can pkg query the repo and plan an install (no mutation)
        run: |
          pkg --version
          # remote query: needs the repo catalogue, writes no package
          pkg rquery '%n %v' cargo-deny
          # pkg's own dry run: resolves and plans, installs nothing
          pkg install -n -y cargo-deny
