# CI for the rumor workspace -- G1, issue 32, ported from the Rust ci.yml at
# 20675b3 for cal's pivot to Go with embedded OPA.
#
# WHAT CARRIES OVER UNCHANGED, because none of it was about Rust: one FreeBSD
# job; no actions/checkout; a timeout(1) on every external call plus a
# timeout-minutes backstop; rc 124 reported separately from a failure; `set -o
# pipefail` in every step; redirect-then-read-status-then-format rather than a
# pipe; a non-fatal probe first; and every step emitting a value only execution
# could have produced. The paragraphs below are the reasons, kept because the
# defects they record are not language-specific.
#
# ONE JOB, FREEBSD ONLY. cal ruled 2026-10-10: "no linux runner, just freebsd
# for now." A second job whose label no runner answers would QUEUE FOREVER, and
# a queued job is not red -- it reads as "no failure" rather than "never ran",
# which makes every green in this file ambiguous.
#
# `runs-on` binds to the runner's LABEL, not its name. cal renamed the runner
# forge-01_jail on 2026-10-10 (was forge-01-ci-jail) and ibis measured the label
# unchanged across the rename (r0.runners run #6).
#
# EVERY STEP PROVES IT RAN. A zero-elapsed success is what a FAST run and a
# PHANTOM run both look like (ibis, r0.runners/4, after it cost two pushes), so
# elapsed time cannot settle execution in either direction. Each step therefore
# emits a value only execution could have produced -- a version string, a count
# it computed, a name resolved out of the module graph -- never a duration and
# never the absence of red. fable ruled that form at rumor/96.
#
# EVERY EXTERNAL CALL IS BOUNDED, AND A HANG IS A NAMED FINDING. Added after a
# probe drove three unbounded `pkg` calls and ran 17+ minutes on 2026-10-10;
# this runner is SINGLE-CONCURRENCY, so that one hang head-of-line blocked three
# queued runs and every push anyone else would have made. Two mechanisms,
# deliberately:
#
#   timeout-minutes      bounds the JOB whatever hangs, including something this
#                        file does not anticipate. It is a RUNNER feature and
#                        nobody here has observed act_runner honouring it, so it
#                        is the backstop, not the guarantee.
#   timeout(1) per call  plain POSIX, works whatever the runner implements, and
#                        is what the per-step bounds below actually rely on.
#
# rc 124 IS REPORTED SEPARATELY FROM A FAILURE at every step, because they are
# different findings: 124 says the tool never answered inside its bound, which
# is a statement about the RUNNER; any other non-zero says the tool answered and
# the answer was no, which is a statement about the CODE. Collapsing them is how
# a wedged runner gets filed as a broken build.
#
# `tools/check-workflows.py --self-test` refuses this file if any job or
# invocation loses its bound; its own 25 arms are green. It is python and
# LOCAL-ONLY on purpose: adding a python dependency to CI would depend on an
# unmeasured interpreter. (The Rust header called it check-workflow-bounds.py,
# which is not a file that exists -- corrected here.)
#
# STEP 1 IS A PROBE AND IS DELIBERATELY NON-FATAL. If a later step dies for want
# of a tool, step 1 has already named which. A red probe would tell us less than
# a green one that lists what is absent.
#
# NO actions/checkout. It is a JavaScript action and needs node ON THE RUNNER
# (ibis, r0.runners-smoke). git is the narrower dependency and the repo is
# public, so an anonymous clone needs no credential on the runner -- no secret
# reaches CI from this file.
#
# THE GO BINARY IS RESOLVED, NOT NAMED. rook's jail carries go1.25.14 and
# go1.26.8 as `go125` and `go126` with NO bare `go` on PATH, which is the
# FreeBSD ports convention; forge-01_jail's Go is not yet provisioned, so its
# naming is unknown. Each step therefore resolves the first of go127, go126,
# go125, go that exists -- the bare name LAST, because the first name found
# wins (run 719) -- and FAILS NAMING ALL FOUR if none does. The resolver is
# repeated per step rather than exported once, because carrying it between steps
# would need $GITHUB_ENV, a runner feature nobody here has measured -- the same
# reasoning that makes timeout-minutes the backstop rather than the guarantee.
#
# go126 LEADS THE NUMBERED NAMES SO CI COMPILES WITH THE GO go.mod DECLARES.
# `go 1.26.0` is the directive, and for nineteen days this file resolved go127
# first, so every run built under go1.27.4 -- a toolchain the module never asked
# for. That was deliberate and it was a REMEDY, not a preference: GO-2026-6859
# is in net/http up to go1.26.10, which is what the ci jail had, and 41 call
# paths in this tree reach it, so run 718 was REFUSED by govulncheck with the
# suite green -- a toolchain finding wearing a code finding's clothes (ibis,
# coop main/801). Leading with go127 bought the fix at the cost of the
# directive.
#
# BOTH HALVES ARE NOW SATISFIED AT ONCE, which is why the order moves. The
# vulnerability is fixed in go1.26.11 AND go1.27.4, and 1.26.11 stopped being
# unreachable: this file used to say it was "in no repo this project can
# reach", which was true when written and was measured false on 2026-11-17 at
# 05:02Z, `pkg rquery` in the ci jail answering go126-1.26.11 (ibis, coop
# main/968). INSTALLED on 2026-11-18, read from the jail's own binary rather
# than from pkg: `/usr/local/go126/bin/go version` -> go1.26.11 freebsd/amd64,
# with go127-1.27.4 left in place untouched. So go126 now leads and the build
# matches the directive, with the vulnerability still fixed; cal's word, flag
# debt-go1-26-11 closed (coop main/1016).
#
# THE ORDER IS THE WHOLE DECISION AND IT IS ARMED: tests/hygiene's resolver
# cells drive these loops over fabricated PATHs, including the case that caused
# this -- an old bare `go` beside a newer numbered one. A bare `go` still wins
# when one exists, unchanged: that is the jail operator's choice and not this
# file's, and it is why the loops are reordered rather than pinned.
#
# THE TRIGGER IS EVERY BRANCH, and that is this file's own doing rather than a
# repo setting: the Rust version fired only on push to r0.2-ci, so rows 160-164
# all came from workflow_dispatch and a pushed branch produced no run at all
# (rook rumor/475). A workflow's trigger is read from the file ON THE PUSHED
# BRANCH (fable rumor/497), so widening it here is what gives a Go branch its
# row -- nothing on main has to change first.

name: ci

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  freebsd:
    runs-on: freebsd-15-jail
    # The backstop. Sized above the sum of the per-step bounds below so that a
    # step's own timeout fires FIRST and names which step hung; this one only
    # catches a hang somewhere the per-step bounds do not reach.
    timeout-minutes: 45
    steps:
      - name: probe the runner (non-fatal; names what is absent)
        run: |
          # pipefail: without it a pipeline reports its LAST stage's status, so a
          # failing gate piped to a formatter exits 0 and this step goes GREEN.
          # ratchet r0.2/12; driven locally -- a gate exiting 4 piped to `tail -5`
          # continues and exits 0, and exits 4 with this line present.
          set -o pipefail
          echo "uname   $(uname -a)"
          echo "whoami  $(whoami)"
          echo "cwd     $(pwd)"
          for t in git go126 go127 go125 go gofmt126 gofmt127 gofmt125 gofmt node curl; do
            p=$(command -v "$t" 2>/dev/null) && echo "$t  FOUND  $p" || echo "$t  ABSENT"
          done
          # bounded even here. A `version` that cannot answer in 20 s is itself
          # the finding, and "it is instant in practice" is the exact reasoning
          # that produced the 17-minute run.
          for c in go126 go127 go125 go; do
            command -v "$c" >/dev/null 2>&1 \
              && { timeout 20 "$c" version 2>/dev/null || echo "$c: did not answer in 20s"; }
          done
          timeout 20 git --version 2>/dev/null || echo "git: none or did not answer in 20s"

      - name: fetch the tree with git, not a JS action
        run: |
          set -o pipefail
          rm -rf src-tree
          rc=0
          timeout 180 git clone --quiet --depth 1 --branch "${GITHUB_REF_NAME:-main}" \
            https://forge.axonibyte.com/axonibyte/rumor.git src-tree || rc=$?
          test "$rc" -eq 124 && { echo "HANG: git clone exceeded 180s. rc 124 proves only that 180s elapsed -- a clone that would have finished at 181s gives this same status, so 'could not reach the forge' is not something this bound can tell you. RUNNER finding; read the step output above for whether any object transfer started."; exit 124; }
          test "$rc" -eq 0 || { echo "git clone exited $rc"; exit "$rc"; }
          cd src-tree
          echo "HEAD $(timeout 30 git rev-parse HEAD)"
          test -f go.mod || { echo "no go.mod: wrong tree"; exit 1; }

      - name: build
        run: |
          set -o pipefail
          cd src-tree
          GO=""
          for c in go126 go127 go125 go; do
            command -v "$c" >/dev/null 2>&1 && { GO="$c"; break; }
          done
          test -n "$GO" || { echo "no go127, go126, go125 or go on PATH: this jail has no Go toolchain, which is a PROVISIONING finding and not a code one"; exit 1; }
          # GOTOOLCHAIN=local, AND IT IS A GATE NOT A PREFERENCE (ratchet
          # go-port/6, reproduced here). Under the default `auto`, a go
          # directive above the installed toolchain is SILENTLY SATISFIED by
          # downloading another one: with a 1.26.8 directive, `go125 test`
          # printed "downloading go1.26.8" and then ok. So naming the versioned
          # binary does not pin what compiles the code, and a dependency can
          # raise the directive underneath us -- OPA v1.21.2 declares go 1.26.0.
          # With `local` the same command refuses, naming both versions. That
          # turns a silent substitution into a loud finding, and it also keeps
          # an unbounded toolchain download from being charged to a step's own
          # timeout and then misread as a build hang.
          export GOTOOLCHAIN=local
          # AND THE CHOSEN TOOLCHAIN IS THE WHOLE ENVIRONMENT, NOT JUST $GO.
          # Run 1287 is why: with go126 leading, this step's $GO was go1.26.11
          # and govulncheck was rebuilt under it -- then govulncheck shelled out
          # to the BARE `go`, which on this runner is a SYMLINK to go127, and
          # its go1.26 loader met go1.27's `go list`: "uses version go1.26 of
          # the source-processing packages but runs version go1.27 of 'go
          # list'", refusing go1.27-tagged files in opa and dsig. The gate
          # BLOCKED, correctly, and the cause was two Gos in one step.
          #
          # GOROOT/bin AND NOT THE DIRECTORY $GO LIVES IN: /usr/local/bin holds
          # go126, go127 AND the bare `go` symlink, so prepending it changes
          # nothing. `$GO env GOROOT`/bin holds exactly one go and one gofmt --
          # the chosen toolchain's -- so after this, every bare name in the step
          # and in anything it spawns is the Go the loop picked (fable, coop
          # main/1019: no step may see two Gos).
          GOROOT_BIN="$(timeout 30 "$GO" env GOROOT)/bin"
          test -x "$GOROOT_BIN/go" || { echo "the chosen toolchain $GO reports GOROOT $GOROOT_BIN with no go in it: PROVISIONING finding, and the bare name would still be another Go"; exit 1; }
          export PATH="$GOROOT_BIN:$PATH"
          echo "PROOF toolchain $(timeout 30 "$GO" version)"
          # NOT `go build | tail`: a pipeline's status is the LAST stage's, so
          # tail's success would mask a failing build -- the exact defect this
          # gate exists to catch. Redirect, then read the status, then format.
          # -o ../rumor-bin, OUTSIDE the clone, and that is load-bearing rather
          # than tidiness. Writing it into src-tree made `go test` red on run
          # 142: TestCommittedTreeIsFullyMapped walks the tree and reported
          # "rumor-bin matches no entry in docs/coverage.toml". .gitignore does
          # NOT help here -- the walk never reads it, which is why the /rumor
          # entry added for `go build`'s default name stops a commit and not a
          # red suite. The only fix is to keep artefacts out of the tree.
          rc=0
          timeout 900 "$GO" build -o ../rumor-bin ./cmd/rumor > ../build.log 2>&1 || rc=$?
          tail -20 ../build.log
          test "$rc" -eq 124 && { echo "HANG: go build exceeded 900s. rc 124 proves only that the time elapsed, so read build.log rather than this line: a stall with no output at all is route or DNS to the module proxy, though this module has no dependencies to fetch. RUNNER finding either way."; exit 124; }
          test "$rc" -eq 0 || { echo "go build exited $rc"; exit "$rc"; }
          test -x ../rumor-bin || { echo "no binary produced"; exit 1; }
          # a value only execution produces: the binary's own usage line, which
          # it writes to stderr and exits 2 for. `|| true` because exit 2 is the
          # correct answer here and would otherwise fail the step.
          # `sed -n 1p` AND NOT `head -1`, AND IT IS NOT A STYLE CHOICE. This step
          # runs under `set -o pipefail`, and `head -1` EXITS after its line -- so a
          # writer still flushing meets a closed pipe, the pipeline reports 141, and
          # the step dies having printed nothing at all. Run 628 died exactly here:
          # rc 141 after `PROOF toolchain` and before `PROOF compiled by`, which is
          # the only pipefail-exposed pipeline between them. `sed -n 1p` reads the
          # whole stream, so there is no close to race. FOUR SIBLINGS had the same
          # shape and are changed with it (validate's two PROOF lines, the lint
          # version, the licences PROOF); the ones carrying `|| true` or `|| echo`
          # are deliberately masked and are left as they are.
          # THE PROOF IS THE BINARY'S OWN RECORDED TOOLCHAIN, not the version
          # of whatever I invoked. `go version -m` reads what actually compiled
          # it, which is the only form of this line that GOTOOLCHAIN cannot make
          # lie -- and with `local` above it cannot diverge in the first place,
          # so the two together are the claim and its cross-check.
          built_with="$(timeout 30 "$GO" version -m ../rumor-bin 2>&1 | sed -n 1p)"
          echo "PROOF compiled by: $built_with"
          echo "PROOF built binary says: $(timeout 30 ../rumor-bin 2>&1 | head -1 || true)"
          invoked="$(timeout 30 "$GO" env GOVERSION)"
          case "$built_with" in
            *"$invoked"*) : ;;
            *) echo "the binary records a different toolchain than the one invoked: $built_with against $invoked. GOTOOLCHAIN=local should have made this impossible, so read it as a finding about the runner rather than about this code"; exit 1 ;;
          esac

      - name: test
        run: |
          set -o pipefail
          cd src-tree
          GO=""
          for c in go126 go127 go125 go; do
            command -v "$c" >/dev/null 2>&1 && { GO="$c"; break; }
          done
          test -n "$GO" || { echo "no go127, go126, go125 or go on PATH: PROVISIONING finding"; exit 1; }
          # See the build step for why this is a gate and not a preference.
          export GOTOOLCHAIN=local
          # AND THE CHOSEN TOOLCHAIN IS THE WHOLE ENVIRONMENT, NOT JUST $GO.
          # Run 1287 is why: with go126 leading, this step's $GO was go1.26.11
          # and govulncheck was rebuilt under it -- then govulncheck shelled out
          # to the BARE `go`, which on this runner is a SYMLINK to go127, and
          # its go1.26 loader met go1.27's `go list`: "uses version go1.26 of
          # the source-processing packages but runs version go1.27 of 'go
          # list'", refusing go1.27-tagged files in opa and dsig. The gate
          # BLOCKED, correctly, and the cause was two Gos in one step.
          #
          # GOROOT/bin AND NOT THE DIRECTORY $GO LIVES IN: /usr/local/bin holds
          # go126, go127 AND the bare `go` symlink, so prepending it changes
          # nothing. `$GO env GOROOT`/bin holds exactly one go and one gofmt --
          # the chosen toolchain's -- so after this, every bare name in the step
          # and in anything it spawns is the Go the loop picked (fable, coop
          # main/1019: no step may see two Gos).
          GOROOT_BIN="$(timeout 30 "$GO" env GOROOT)/bin"
          test -x "$GOROOT_BIN/go" || { echo "the chosen toolchain $GO reports GOROOT $GOROOT_BIN with no go in it: PROVISIONING finding, and the bare name would still be another Go"; exit 1; }
          export PATH="$GOROOT_BIN:$PATH"
          rc=0
          # -count=1 IS A GATE AND NOT A PREFERENCE. Without it the build cache
          # serves a PASS for any package whose inputs have not moved, and the
          # harness prints `ok <pkg> (cached)` -- which this step's own PROOF
          # line counted as a package that ran. rook r5/231 and ratchet r5/232
          # and /233 settled what the cache actually keys on: the files the TEST
          # PROCESS ITSELF opens, so a suite reading .go files with WalkDir moves
          # the key while one spawning `go build` does not, and a mutant selected
          # by an env var moves nothing at all. So whether a mutation is seen is
          # a property of how the suite reads its subject -- which is exactly the
          # thing a gate must not depend on.
          # -v IS A GATE TOO, AND IT IS WHAT PUTS THE SUITE'S OWN EVIDENCE IN
          # THE FILE. Without it `go test` discards every `t.Logf` of a PASSING
          # test, so the project's 111 `Logf("PROOF ...` sites -- each one a
          # suite saying what it actually drove -- were in no log this job
          # produced: measured at dd614ba, 0 PROOF lines of 37 plain and 344 of
          # 2275 with -v (rook, coop rumor/1119). The mining step below is what
          # reads them; this flag is what makes them exist to read.
          # THE CAP IS A BUDGET AND NOT A CHECK, so it moves: fable ruled 900 -> 1800
          # at coop rumor/1665 after runs 619 and 622 both died here at exactly 900s
          # with NO test failing -- rc 124, "(no FAIL or panic line in test.log)".
          # WHERE THE TIME GOES, from run 995's own package lines, the last green
          # run before the crossing: tests/run 598.000s, tests/attaint 424.883s,
          # tests/clock 84.998s, tests/engine 78.091s. `go test ./...` runs packages
          # in parallel, so the wall clock is the critical path and tests/run is it.
          # The suite's growth is recorded for 111's bump notes rather than chased
          # here, and this line is the budget that stops a slow suite reading as a
          # broken one.
          #
          # CONTENTION IS NOT THE CAUSE, measured rather than assumed: nothing
          # overlapped 622's window on the runner, while 995 -- which PASSED -- was
          # overlapped for four minutes.
          # AND THE INNER WATCHDOG MOVES WITH THE OUTER BUDGET, which is the
          # half that did not when fable raised 900 -> 1800 at coop rumor/1665.
          # `go test` has its OWN per-binary timeout and its default is 10m, so
          # from that moment this suite carried two budgets for one run with the
          # smaller one undeclared and invisible -- and the smaller one is the
          # one that fires.
          #
          # MEASURED ACROSS THE CROSSING, in this jail, on tests/run:
          #     task 995   598.000s   ok
          #     task 1011  607.591s   FAIL
          #     task 1012  607.258s   FAIL
          # 598 under the default and 607 over it, each red being roughly 600s
          # plus the goroutine-stack dump the panic prints. The suite did not
          # break between those runs; it grew past a bound nobody had declared.
          #
          # WHY RAISING IT IS NOT WEAKENING A CHECK. The watchdog exists to turn
          # a HUNG test into stacks instead of silence. What changes is that a
          # package taking 607s on a slow runner is no longer treated as hung --
          # the thing the measurement above shows it is not.
          #
          # 20m -> 30m, AND THE ORDER INVERTS: THE INNER BOUND NOW EQUALS THE
          # OUTER, so the step's own budget is the only one that can fire. fable
          # ruled it at coop thread:rumor/1835 on run 987, and the run is the
          # argument: 892d0308 PASSED this workflow on r7.5-dst in 1237s and
          # FAILED it on main in 1220s. Same sha, same file, no `if:` anywhere
          # in it -- 1200s of per-binary watchdog plus a ~20s pre-test phase
          # (measured: a warm-cache build of that sha is 7.477s at load 4.27,
          # and task 1070's FULL clone plus a dozen git steps took 16s wall).
          # A green release's own sha went red on main for contention.
          #
          # AND NO INNER BOUND BELOW THE OUTER IS SAFE, which is the half I got
          # wrong first (thread:rumor/1836, corrected at /1837). The only
          # contended figure anyone here holds is CENSORED: tests/attaint was
          # KILLED at 1200.035s under load 16, where alone it is 717.898s. So
          # ">1200s" is all that datum says, nothing bounds a contended package
          # from above, and a watchdog chosen to clear it is a number chosen
          # against a truncation. The per-binary bound cannot be the contention
          # guard at all; the outer budget is, and it answers rc 124 with the
          # diagnostic below instead of a red that names a test.
          #
          # WHAT THIS TRADES, stated because it is a capability and not a
          # detail: with the two equal, a package that TRULY hangs no longer
          # panics with its goroutine stacks -- the outer `timeout` reaches it
          # first and prints nothing about where it stopped. The rc-124 branch
          # below is what carries the diagnosis now, and it names the packages
          # that never reported rather than the line that hung. Narrowing the
          # inner bound again to recover the stacks re-arms exactly the failure
          # run 987 is, so the stacks are the price and this comment is where it
          # is recorded. `tests/hygiene` holds the relation as an arm.
          #
          # AND THE WATCHDOG PANIC IS WHY A HUNG RUN LOOKED LIKE A CLEAN ONE: a
          # binary killed by it never runs its cleanup, so the toy descendants
          # it started outlive it, hold the stdout they inherited, and `go test`
          # waits on a pipe that cannot reach EOF -- every package reported, and
          # the process does not exit. That is the shape the rc-124 diagnostic
          # below reports as "the work finished and the run did not exit".
          # ../test.json IS THE RECORD AND ../test.log IS A RENDERING OF IT.
          # The runner emits a step in one flush, so every line of a
          # 1400-second suite arrives carrying the same stamp: diagnosing task
          # 1240 meant reading per-package elapsed figures and GUESSING at
          # overlap, because the flush had erased WHEN anything ran. Only
          # `go test -json` attributes an event to a PACKAGE and stamps it with
          # a real TIME -- `go tool test2json` invoked standalone has no -p, so
          # under the previous tee'd shape every event arrived with no Package
          # and the timeline could report elapsed figures while REFUSING the
          # overlap figure #128 asked for.
          #
          # THE RULE THIS REVERSES, AND WHY ITS INTENT SURVIVES (fable, coop
          # r10/18). The rule read "../test.log STAYS THE OUTPUT OF go test AND
          # OF NOTHING ELSE", and it was never about the file's NAME: it was
          # that the record is what `go test` wrote, with nothing of ours
          # between. `go test -json` captured raw IS go test's own output, so
          # the record keeps the property and gains the two fields.
          #
          # AND THE HAZARD THE RULE WAS WRITTEN AGAINST IS MEASURED FALSE. It
          # argued a parser in the path could swallow a broken build's output.
          # Measured 2026-11-17 with go1.27.2: a package that does not compile
          # emits build-output and build-fail AS JSON EVENTS, stderr empty,
          # every stdout line parsing. The premise was never tested when I
          # wrote it.
          #
          # NO FILTER STANDS BETWEEN go test AND THE RECORD -- not even a tee.
          # A redirect is one syscall and no process, which is strictly less
          # than the tee the ruling allowed for.
          #
          # STDERR IS KEPT OUT OF THE RECORD and shown separately: merging it
          # would put non-JSON lines into the file every view now reads, and
          # the go command's own errors deserve to be legible rather than
          # interleaved.
          if timeout 1800 "$GO" test -count=1 -timeout 30m -json ./... > ../test.json 2> ../test.err
          then rc=0
          else rc=$?
          fi
          if [ -s ../test.err ]; then
            echo "--- the go command wrote to stderr; this is NOT part of the record:"
            cat ../test.err
          fi
          # THE RENDERING IS ONE STEP WHOSE ONLY INPUT IS THE RECORD, which is
          # the ruling's second condition. It is a convenience for a reader:
          # every view that makes a CLAIM reads ../test.json, so if this step
          # failed outright no check would lose its subject (quill, coop r10/19
          # -- a rendering must never be the thing anyone greps).
          #
          # ONE DIFFERENCE FROM `go test -v`, NAMED RATHER THAN PAPERED: the
          # trailing bare `FAIL` the go command prints after the stream ends is
          # carried by no event, so the rendering cannot hold it. Every
          # per-package `FAIL<TAB>pkg` line is there.
          PY=$(command -v python3.12 || command -v python3 || true)
          if [ -n "$PY" ]; then
            timeout 300 "$PY" tools/test-timeline.py --json ../test.json --log ../test.log \
              || echo "(the rendering failed; ../test.json is the record and the views below read it)"
          else
            echo "(no python3, so ../test.log is not rendered; ../test.json is still the record)"
          fi
          # THE TIMELINE CAME OUT OF THE SAME INVOCATION as the rendering,
          # above: one tool, one read of the record, both outputs. It was a
          # second call until this head, which read ../test.json twice for no
          # reason once the renderer moved into the same tool.
          #
          # IT IS A REPORT AND NEVER A GATE, so every way it can fail is
          # swallowed: no interpreter, no record, a tool that throws. It prints
          # BEFORE the failure view because it is the cheap orientation --
          # which packages overlapped, and which never finished.
          # THE SWEEP'S OWN LINE, MINED LIKE THE FAILURE VIEW IS, and for the
          # same reason: it is written into ../test.log, which dies with the
          # runner's workspace, and a GREEN run prints only `tail -20` of that
          # file. So the browser sweep -- the thing that reclaims a killed
          # run's leavings -- was invisible exactly when it worked.
          #
          # MEASURED, AND IT COST A WRONG CONCLUSION: task 1249 passed, left 46
          # orphaned chrome in one group whose tree was gone, and I read the
          # absence of a sweep line in the job log as "the sweep found
          # nothing". The log cannot carry that line on a pass, so the absence
          # was the instrument's placement and not a fact about the sweep. A
          # run that cleans up silently and a run that found nothing to clean
          # are indistinguishable without this.
          #
          # rc DISCIPLINE AS ABOVE: 1 is "no match" and is the only rc that may
          # print the reassuring sentence; anything higher is the instrument
          # failing and says so.
          # THE PATTERN IS THE PREFIX THE LINE CANNOT LOSE. It was
          # 'browser: swept' until the line gained the sweeping process's pid
          # -- `browser: pid 19595 swept ...` -- which that pattern does not
          # match, so this view would have gone silently blind on the very head
          # that made the line more useful. The prefix up to the colon is the
          # part the format owns; everything after it is free to change.
          src=0
          grep -a 'browser: ' ../test.json > ../swept.txt || src=$?
          case "$src" in
            0) echo "--- the browser sweep reported:"; sed -n '1,20p' ../swept.txt ;;
            1) echo "--- the browser sweep collected nothing this run" ;;
            *) echo "SWEEP VIEW BROKEN: the grep over ../test.json exited $src, so nothing below rests on it" ;;
          esac
          # A GROUP ALIVE AFTER TEARDOWN IS THE ONE ABNORMAL OUTCOME this
          # subsystem can now have, and it was written only to stderr -- which
          # a green run drops, exactly as the sweep's line was (quill, coop
          # r9/461, the fourth instance of that gap today).
          #
          # IT IS ABNORMAL AND NOT ROUTINE, which is why it is worth a view of
          # its own: teardown keeps every tree now, so a kept tree says
          # nothing, and this line is the only thing that distinguishes "handed
          # on tidily" from "could not stop its browsers". Silence here is the
          # good case and says so.
          krc=0
          grep -a 'still has members after SIGKILL' ../test.json > ../kept.txt || krc=$?
          case "$krc" in
            0) echo "--- teardown could NOT stop these groups; they are left for a later sweep:"
               sed -n '1,20p' ../kept.txt ;;
            1) echo "--- every teardown emptied its process group" ;;
            *) echo "KEPT VIEW BROKEN: the grep over ../test.json exited $krc, so nothing below rests on it" ;;
          esac
          # THE FAILURE VIEW IS MINED AND NOT ONLY TAILED, because -v moved what
          # the last 20 lines contain: under -v a tail is the verbose output of
          # whichever package finished last, so a FAIL twenty packages earlier
          # scrolls off. The mined lines come first for the same reason the
          # licences step mines its log -- a verdict a reader has to scroll for
          # is a verdict that gets missed.
          # NO `\t` IN THE PATTERN, which is measured and not style. BSD grep
          # 2.6.0-FreeBSD refuses `^\t+--- FAIL` outright -- "grep: trailing
          # backslash (\)" -- so the WHOLE grep exits 2 and prints nothing, and
          # under `set -o pipefail` the `||` branch then printed "(no FAIL or
          # panic line in test.log)". Run 1012 said that sentence over a log
          # holding `--- FAIL`, `FAIL` and `FAIL ... tests/run 607.258s`: the
          # failure view had never searched anything, and the run read as a
          # clean hang for as long as nobody opened the log.
          #
          # AND A BROKEN SEARCH IS NOT AN EMPTY LOG. rc 1 is "no match" and is
          # the ONLY rc the reassuring sentence may be printed for; rc above 1
          # is the instrument failing, which is louder than anything it could
          # have found and fails the step on its own. That distinction is the
          # defect, not the regexp: a pattern can be fixed in one line, while
          # "no output means nothing was wrong" mis-reads every future break
          # the same way.
          #
          # NO PIPE, so the rc is grep's own and not `head`'s, and so a reader
          # that stops early cannot kill the writer (`sed -n` consumes the
          # stream where `head` closes it).
          # AND THE rc IS CAPTURED THROUGH `||`, WHICH IS NOT STYLE EITHER. The
          # runner invokes a step with -e, and under -e a BARE command exiting
          # nonzero ends the script there -- no output, rc 1. The first cut of
          # this block ran the grep bare, so on a run whose suite PASSED the
          # grep found nothing, exited 1, and killed the step: task 1014 spent
          # 11.5 minutes on a green suite and reported `exit status 1` with an
          # empty log. The `|| echo` form this replaced was doing two jobs at
          # once -- it masked grep's error AND it kept -e from firing -- and
          # removing the mask took the guard with it.
          #
          # `|| frc=$?` DOES BOTH CORRECTLY: the grep sits in an AND-OR list, so
          # -e does not apply to it, and the rc still reaches the case below.
          view_broken=0
          frc=0
          # `-C` AND NOT `-A` OR `-B`, WHICH IS MEASURED (rook, coop r9/147).
          # This view printed the matching lines ALONE, so an arm's own
          # `t.Errorf` words never reached the log and a CI-only failure arrived
          # with no diagnostic -- twice. The first cut of the fix said `-A`, and
          # driven against real `go test -v` output `-A 3` captured NONE of
          # those words: go prints a test's diagnostic BEFORE its `--- FAIL`
          # line, not after.
          #
          # AND THIS PATTERN MATCHES TWO KINDS WITH OPPOSITE DIRECTIONS: a
          # `--- FAIL`'s words come before it, a `^panic:` trace comes after it.
          # One-sided context serves one of them, so both sides are taken.
          # THE VIEW READS THE RECORD AND SCOPES CONTEXT BY WHAT FAILED, which
          # is condition (5) at coop r10/22 and a better view besides. The
          # anchored grep above could not move to ../test.json -- every line
          # there is a JSON object, and `grep -cE '^ok[[:space:]]'` over the
          # record measures 0 -- so the claim is computed from the fields that
          # carry it: every `fail` event with its OWN package's output, plus the
          # compiler's text, which carries no Package at all and would be
          # dropped by any per-package scoping.
          #
          # AND -C 5 WAS NEVER THE RIGHT CONTEXT under package parallelism: the
          # five lines either side belong to whatever else was printing, while
          # the lines that explain a failure may be fifty back in its own
          # package. Scoping by package is exact instead of near.
          #
          # rc DISCIPLINE, RESTATED FOR A TOOL RATHER THAN A GREP: grep used 1
          # for "no match", which is why the reassuring sentence had its own
          # branch. This tool exits 0 whether or not anything failed, so an
          # EMPTY file is the no-failures case and any non-zero rc is the
          # instrument breaking.
          if [ -n "$PY" ]; then
            timeout 120 "$PY" tools/test-timeline.py --json ../test.json --failures > ../fails.txt || frc=$?
          else
            frc=127
          fi
          case "$frc" in
            0) if [ -s ../fails.txt ]; then
                 # THE CAP STAYS A COURTESY: the whole rendering is printed
                 # beneath on failure, so this is a summary and not the only
                 # copy.
                 sed -n '1,200p' ../fails.txt
               else
                 echo "(no failing package or test in the record)"
               fi ;;
            127) echo "FAILURE VIEW BROKEN: no python3, so ../test.json has NOT been searched and no verdict below rests on it"
                 view_broken=1 ;;
            *) echo "FAILURE VIEW BROKEN: the failure view exited $frc, so ../test.json has NOT been searched and no verdict below rests on it"
               view_broken=1 ;;
          esac
          tail -20 ../test.log
          test "$rc" -eq 124 && {
            echo "HANG: go test exceeded 1800s. The CONSEQUENCE holds either way -- this is a finding against the test, not a red build -- but the premise does not: rc 124 proves only that 1800s elapsed, and a test taking 1801s terminates."
            # AND WHICH PACKAGES FINISHED, BY NAME AND WITH THEIR OWN ELAPSED.
            # This branch has said "read test.log for which package started
            # last" since it was written and never printed it -- and test.log
            # lives in the runner's workspace, so it is gone with the job and
            # the one reader who could answer never had it. The cost is
            # measured rather than supposed: a timeout has now been diagnosed
            # TWICE by reading a GREEN run's log on the box for per-package
            # figures, because the RED one carries a tail of whichever package
            # finished last and nothing else.
            #
            # THE HUNG PACKAGE IS THE DIFFERENCE, which is why the total is
            # printed beside the list: `go test ./...` reports a package when it
            # finishes, so the ones missing from this list are the ones still
            # running when the budget expired.
            # `?` IS A REPORT TOO, and leaving it out made this instrument lie a
            # THIRD time in one day. A package with no test files prints
            # `?  <pkg>  [no test files]` and can never appear in an ok/FAIL
            # list -- while `go list ./...` counts it -- so the figure read
            # "41 of 42, the rest were still running" on a run where EVERY
            # testable package had reported and nothing was running at all.
            # internal/vocabulary is that package today.
            #
            # THE NUMERATOR AND THE DENOMINATOR MUST COUNT THE SAME SET. That is
            # the same defect ratchet caught here at coop r8/162 (the list said
            # `^(ok|FAIL)` and the count said `^ok`), now on the other side of
            # the fraction: the denominator was every package and the numerator
            # only the ones that run tests.
            # THE LIST IS RENDERED FROM THE RECORD, IN THIS STEP, BESIDE ITS
            # COUNT. It was `grep -aE '^(ok|FAIL|\?)...'` over ../test.log
            # while the count came from ../test.json -- two instruments on one
            # question from two sources (quill, coop r10/29; fable r10/30).
            # Condition (5) held, because only the count decides and the list
            # displayed, but a line dropped by the rendering would print
            # "41 of 42" above a list of 40 and leave the reader to work out
            # which half lied.
            #
            # ONE PREDICATE SERVES BOTH: --verdicts lists exactly the packages
            # --reported counts, so the count is this list's length by
            # construction and a disagreement is not expressible. A pointer to
            # the TIMELINE table above would also have been one source, but it
            # asks the reader to scroll a 1400-second log to answer the question
            # the line beside it just raised.
            echo "--- reported, from the record, with each package's own elapsed:"
            if [ -n "$PY" ]; then
              timeout 60 "$PY" tools/test-timeline.py --json ../test.json --verdicts \
                || echo "(the verdict list could not be read from ../test.json)"
            else
              echo "(no python3, so the record could not be listed)"
            fi
            # THE COUNT MATCHES THE LIST, and it did not for one commit: the
            # list is `^(ok|FAIL)` and the count was `^ok`, so a FAILED package
            # was printed as completed and left out of the figure -- making
            # "the rest were still running" name a package that had finished.
            # Reachable on exactly this path (ratchet, coop r8/162): `go test
            # ./...` reports each package as it finishes, so a FAIL lands while
            # others run and the budget expires after it. rc 124 with a FAIL in
            # the log is the ordinary shape of a slow suite with one broken
            # package, which is the case the diagnostic most needs to be right
            # about. A package that FAILED is still a package that REPORTED.
            # THE NUMERATOR COMES OUT OF THE RECORD'S FIELDS, which is the
            # ruling's second condition. It counted `^(ok|FAIL|\?)` lines in
            # the log until this head, and those anchors match NOTHING in
            # ../test.json -- measured, a `grep -cE '^ok[[:space:]]'` over the
            # record answers 0 -- so repointing the fraction at the record
            # without changing its instrument would have read zero packages and
            # called it a total shortfall.
            #
            # IT STILL COUNTS THE SET THE DENOMINATOR DOES, which is ratchet's
            # defect at coop r8/162 and the `?` omission that made this figure
            # lie a third time. A package reaches a verdict by emitting pass,
            # fail or skip with a Package and no Test. Measured 2026-11-17: a
            # package with NO TEST FILES emits `skip` and is counted, and one
            # that fails to BUILD emits `fail` and is counted. Both are in
            # `go list ./...`, so neither side can drift to a subset.
            if [ -n "$PY" ]; then
              reported=$(timeout 60 "$PY" tools/test-timeline.py --json ../test.json --reported 2>/dev/null || echo "?")
            else
              reported="? (no python3, so the record could not be counted)"
            fi
            echo "--- $reported of $(timeout 60 "$GO" list ./... | wc -l | tr -d ' ') package(s) reported, the count from ../test.json and the denominator from go list; a difference here is a package still running, and NONE means the work finished and the run did not exit"
            exit 124
          }
          # THE WHOLE LOG GOES INTO THE JOB LOG ON FAILURE (fable, coop
          # r9/146), because ../test.log dies with the runner's workspace and
          # the job log is the one place that outlives it WITHOUT a runner
          # feature nobody here has measured. actions/upload-artifact is
          # declined until `node --version` on the runner is measured -- it is
          # a JavaScript action, the same class this file refuses for
          # actions/checkout at the top.
          #
          # PRINTING AND SURVIVING ARE DIFFERENT HALVES: the mined view above
          # fixes what a reader SEES FIRST, and this fixes what is still there
          # tomorrow. A failure that cost its own words twice is why both are
          # here rather than either.
          test "$rc" -eq 0 || {
            echo "go test exited $rc"
            # NO COMMAND SUBSTITUTION AND A GUARDED cat, because this is the
            # FAILURE path: a printer that can itself fail is worst placed
            # exactly where the only remaining evidence is being printed. A
            # line count would have been nice and is not worth a `wc` that can
            # exit nonzero here.
            echo "--- WHOLE test.log BELOW: the view above is mined, this is the copy ---"
            cat ../test.log || echo "(test.log could not be read, so the view above is all there is)"
            exit "$rc"
          }
          # AND A GREEN RUN WHOSE FAILURE VIEW WAS BROKEN IS NOT GREEN. The
          # branches above exit on their own rc, so this reaches only a run that
          # passed -- where an unsearched log is the one case nothing else would
          # ever report.
          test "$view_broken" -eq 0 || { echo "the failure view did not run, so this pass is unverified"; exit 1; }
          # and a value only execution produces: the harness's own per-package
          # verdict. `go test` prints `ok <pkg> <elapsed>` for each package that
          # ran, so its absence means no package ran at all -- which is what a
          # build-only success looks like.
          # COMPUTED FROM THE RECORD: a package passed when it emits `pass`
          # with a Package and no Test. The grep this replaces was
          # `^ok<TAB>forge...` over the rendering, and its claim is unchanged.
          passed=0
          if [ -n "$PY" ]; then
            passed=$(timeout 60 "$PY" tools/test-timeline.py --json ../test.json --passed 2>/dev/null || echo 0)
          else
            echo "no python3, so the pass count cannot be read from the record"; exit 1
          fi
          test "$passed" -gt 0 \
            || { echo "no package passed: the harness did not run any package"; exit 1; }
          # A `(cached)` LINE IS THE ORACLE FOR THE FLAG ABOVE, and the reason
          # this is a refusal rather than a filter: with -count=1 the cache is
          # bypassed, so a cached verdict means the flag did not take -- a
          # future edit dropping it, a wrapper re-adding GOFLAGS, a toolchain
          # that ignores it. Merely subtracting them from the count would hide
          # exactly that. The comment above claims an absent ok-line means no
          # package ran; `ok <pkg> (cached)` is a present ok-line for a package
          # that did not run, which is the claim it falsifies.
          # AND THE CACHED CHECK READS OUTPUT EVENTS ONLY, not the whole
          # record. A bare `grep '(cached)' ../test.json` would also match a
          # test that printed those nine characters itself -- and this check
          # EXITS THE BUILD, so a false positive costs a good run. The mode
          # looks at package-level output events whose text begins `ok`, which
          # is the shape `go test` uses and nothing else does. Driven both
          # ways: a real cached line is reported, a test printing the word is
          # not.
          cached=$(timeout 60 "$PY" tools/test-timeline.py --json ../test.json --cached 2>/dev/null || echo "VIEW-BROKEN")
          if [ "$cached" = "VIEW-BROKEN" ]; then
            echo "CACHED CHECK BROKEN: the record could not be read for cached verdicts"; exit 1
          fi
          if [ -n "$cached" ]; then
            echo "CACHED VERDICT with -count=1 set, so the flag did not take:"
            printf '%s\n' "$cached"
            echo "a cached pass is not a run, and this step's PROOF counts runs"
            exit 1
          fi
          echo "PROOF $passed package(s) reported ok, 0 cached"

      - name: the suite's own PROOF lines (mined, not tailed)
        run: |
          set -o pipefail
          # WHAT THIS EXISTS FOR. 111 sites in this tree call `t.Logf("PROOF ...`
          # to say what an arm actually drove -- which seed, which profile, how
          # many steps, which finding. Every one of them was invisible to this
          # job: `go test` drops a passing test's log output without -v, and the
          # test step echoed `tail -20`, which under -v is the last package's
          # verbose spam rather than anybody's evidence. So the suite's own
          # statements of what it proved reached no reader, while this file's
          # SHELL echoes of the word PROOF always did -- two producers of one
          # looking line, and the loud one masking the silent one (rook, coop
          # rumor/1117; ratchet, rumor/1123).
          #
          # THREE CONDITIONS AND THEY ARE AND, not or (fable, coop rumor/1124):
          # -v puts the lines in the file, this step mines them out of it, and a
          # count of ZERO REFUSES. Without the third, a step that finds nothing
          # prints nothing and reads exactly like a step that found everything,
          # which is the tail -20 one layer out.
          # THE RECORD AND NOT THE RENDERING, because this step DECIDES: it
          # exits 1 when it finds nothing, so it is an instrument and condition
          # (5) at coop r10/22 puts every instrument on ../test.json. `PROOF `
          # is a mid-line literal inside an Output string, so the grep needs no
          # anchors and none of its meaning is lost.
          test -f test.json || { echo "no test.json: the test step did not run, so there is nothing to mine"; exit 1; }
          n=$(grep -c 'PROOF ' test.json) || n=0
          if test "$n" -eq 0; then
            echo "NO PROOF LINE IN test.json, and this step refuses rather than passing quietly."
            echo "The suite has 111 Logf(\"PROOF sites; zero reaching the log means either -v"
            echo "was dropped from the test step above, or the lines were renamed. Either way"
            echo "the evidence a reader would act on is not in this job's output."
            exit 1
          fi
          echo "PROOF $n test-side PROOF line(s) mined from test.json:"
          grep -n 'PROOF ' test.json

      - name: fmt
        run: |
          set -o pipefail
          cd src-tree
          FMT=""
          for c in gofmt126 gofmt127 gofmt125 gofmt; do
            command -v "$c" >/dev/null 2>&1 && { FMT="$c"; break; }
          done
          test -n "$FMT" || { echo "no gofmt, gofmt127, gofmt126 or gofmt125 on PATH: PROVISIONING finding"; exit 1; }
          # gofmt -l LISTS unformatted files and exits 0 either way, so the
          # status cannot be the gate -- the output is. This is the one step
          # whose verdict is a count rather than an rc, and that is why it is
          # written out instead of trusting `test "$rc" -eq 0`.
          rc=0
          timeout 120 "$FMT" -l . > ../fmt.log 2>&1 || rc=$?
          cat ../fmt.log
          test "$rc" -eq 124 && { echo "HANG: gofmt exceeded 120s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "gofmt exited $rc, which is a tool failure and not an unformatted tree"; exit "$rc"; }
          test ! -s ../fmt.log || { echo "gofmt lists the files above as unformatted"; exit 1; }
          echo "PROOF fmt checked with $(timeout 60 "$FMT" --help 2>&1 | head -1 || true); zero files listed"

      - name: vet
        run: |
          set -o pipefail
          cd src-tree
          GO=""
          for c in go126 go127 go125 go; do
            command -v "$c" >/dev/null 2>&1 && { GO="$c"; break; }
          done
          test -n "$GO" || { echo "no go127, go126, go125 or go on PATH: PROVISIONING finding"; exit 1; }
          # See the build step for why this is a gate and not a preference.
          export GOTOOLCHAIN=local
          # AND THE CHOSEN TOOLCHAIN IS THE WHOLE ENVIRONMENT, NOT JUST $GO.
          # Run 1287 is why: with go126 leading, this step's $GO was go1.26.11
          # and govulncheck was rebuilt under it -- then govulncheck shelled out
          # to the BARE `go`, which on this runner is a SYMLINK to go127, and
          # its go1.26 loader met go1.27's `go list`: "uses version go1.26 of
          # the source-processing packages but runs version go1.27 of 'go
          # list'", refusing go1.27-tagged files in opa and dsig. The gate
          # BLOCKED, correctly, and the cause was two Gos in one step.
          #
          # GOROOT/bin AND NOT THE DIRECTORY $GO LIVES IN: /usr/local/bin holds
          # go126, go127 AND the bare `go` symlink, so prepending it changes
          # nothing. `$GO env GOROOT`/bin holds exactly one go and one gofmt --
          # the chosen toolchain's -- so after this, every bare name in the step
          # and in anything it spawns is the Go the loop picked (fable, coop
          # main/1019: no step may see two Gos).
          GOROOT_BIN="$(timeout 30 "$GO" env GOROOT)/bin"
          test -x "$GOROOT_BIN/go" || { echo "the chosen toolchain $GO reports GOROOT $GOROOT_BIN with no go in it: PROVISIONING finding, and the bare name would still be another Go"; exit 1; }
          export PATH="$GOROOT_BIN:$PATH"
          rc=0
          timeout 300 "$GO" vet ./... > ../vet.log 2>&1 || rc=$?
          tail -30 ../vet.log
          test "$rc" -eq 124 && { echo "HANG: go vet exceeded 300s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "go vet exited $rc: a check fired, named above"; exit "$rc"; }
          echo "PROOF vet ran under $(timeout 30 "$GO" version)"

      - name: docs coverage
        run: |
          set -o pipefail
          cd src-tree
          GO=""
          for c in go126 go127 go125 go; do
            command -v "$c" >/dev/null 2>&1 && { GO="$c"; break; }
          done
          test -n "$GO" || { echo "no go127, go126, go125 or go on PATH: PROVISIONING finding"; exit 1; }
          # See the build step for why this is a gate and not a preference.
          export GOTOOLCHAIN=local
          # AND THE CHOSEN TOOLCHAIN IS THE WHOLE ENVIRONMENT, NOT JUST $GO.
          # Run 1287 is why: with go126 leading, this step's $GO was go1.26.11
          # and govulncheck was rebuilt under it -- then govulncheck shelled out
          # to the BARE `go`, which on this runner is a SYMLINK to go127, and
          # its go1.26 loader met go1.27's `go list`: "uses version go1.26 of
          # the source-processing packages but runs version go1.27 of 'go
          # list'", refusing go1.27-tagged files in opa and dsig. The gate
          # BLOCKED, correctly, and the cause was two Gos in one step.
          #
          # GOROOT/bin AND NOT THE DIRECTORY $GO LIVES IN: /usr/local/bin holds
          # go126, go127 AND the bare `go` symlink, so prepending it changes
          # nothing. `$GO env GOROOT`/bin holds exactly one go and one gofmt --
          # the chosen toolchain's -- so after this, every bare name in the step
          # and in anything it spawns is the Go the loop picked (fable, coop
          # main/1019: no step may see two Gos).
          GOROOT_BIN="$(timeout 30 "$GO" env GOROOT)/bin"
          test -x "$GOROOT_BIN/go" || { echo "the chosen toolchain $GO reports GOROOT $GOROOT_BIN with no go in it: PROVISIONING finding, and the bare name would still be another Go"; exit 1; }
          export PATH="$GOROOT_BIN:$PATH"
          rc=0
          timeout 300 "$GO" run ./cmd/rumor docs --check > ../docs.log 2>&1 || rc=$?
          cat ../docs.log
          test "$rc" -eq 124 && { echo "HANG: docs --check exceeded 300s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "docs --check exited $rc: an unmapped path, named above"; exit "$rc"; }
          # a count only the check itself can compute
          grep -qE '[0-9]+ path\(s\), every one mapped' ../docs.log \
            || { echo "no coverage count: the check did not run"; exit 1; }
          echo "PROOF $(grep -oE '[0-9]+ path\(s\), every one mapped' ../docs.log | head -1 || true)"

      - name: validate's arm accounting (the literal, with the adapter reachable)
        run: |
          set -o pipefail
          cd src-tree
          GO=""
          for c in go126 go127 go125 go; do
            command -v "$c" >/dev/null 2>&1 && { GO="$c"; break; }
          done
          test -n "$GO" || { echo "no go127, go126, go125 or go on PATH: PROVISIONING finding"; exit 1; }
          # See the build step for why this is a gate and not a preference.
          export GOTOOLCHAIN=local
          # AND THE CHOSEN TOOLCHAIN IS THE WHOLE ENVIRONMENT, NOT JUST $GO.
          # Run 1287 is why: with go126 leading, this step's $GO was go1.26.11
          # and govulncheck was rebuilt under it -- then govulncheck shelled out
          # to the BARE `go`, which on this runner is a SYMLINK to go127, and
          # its go1.26 loader met go1.27's `go list`: "uses version go1.26 of
          # the source-processing packages but runs version go1.27 of 'go
          # list'", refusing go1.27-tagged files in opa and dsig. The gate
          # BLOCKED, correctly, and the cause was two Gos in one step.
          #
          # GOROOT/bin AND NOT THE DIRECTORY $GO LIVES IN: /usr/local/bin holds
          # go126, go127 AND the bare `go` symlink, so prepending it changes
          # nothing. `$GO env GOROOT`/bin holds exactly one go and one gofmt --
          # the chosen toolchain's -- so after this, every bare name in the step
          # and in anything it spawns is the Go the loop picked (fable, coop
          # main/1019: no step may see two Gos).
          GOROOT_BIN="$(timeout 30 "$GO" env GOROOT)/bin"
          test -x "$GOROOT_BIN/go" || { echo "the chosen toolchain $GO reports GOROOT $GOROOT_BIN with no go in it: PROVISIONING finding, and the bare name would still be another Go"; exit 1; }
          export PATH="$GOROOT_BIN:$PATH"
          # THE BINARY HAS TO BE CALLED `rumor` HERE. The build step writes
          # ../rumor-bin, outside the clone and under that name on purpose, but
          # examples/twin's [adapter].command is ["rumor", "fake-adapter", ...]
          # -- what a real project writes -- so five arms need a `rumor` to
          # spawn. A link under the right name in a scratch dir on PATH is how
          # tests/validate's TestMain does it too.
          bindir="$RUNNER_TEMP/validate-bin"
          mkdir -p "$bindir"
          cp ../rumor-bin "$bindir/rumor" || { echo "no rumor-bin to link: the build step did not run"; exit 1; }
          rc=0
          PATH="$bindir:$PATH" timeout 300 ./../rumor-bin validate examples/twin > ../validate.log 2>&1 || rc=$?
          cat ../validate.log
          test "$rc" -eq 124 && { echo "HANG: validate exceeded 300s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "validate exited $rc on the permitted twin, which must PASS: an arm fired, or a declaration could not be read"; exit "$rc"; }
          # THE LITERAL. fable ruled the count at coop breakout-r4/6 and the
          # reading at r4/77: every run accounts for EVERY arm, each evaluated
          # or skipped with its reason, and the twin -- which D9 requires to pass
          # with NONE skipped -- evaluates them all. The number is deliberately
          # not restated in this comment: the grep below is the one copy of it
          # that lives outside Go, and a comment repeating it is a second copy
          # with no oracle (R9.1, rook coop r9/20). This
          # line moves only with a count posted in the live phase thread first
          # (r4/6's rule, honored in R6.2 at r6/28 with r4 closed), together
          # with internal/validate.TotalArms and docs/testing-methodology.md.
          #
          # AND IT IS NO LONGER UNWATCHED. This grep is the one copy of the
          # count that lives outside Go, and the R6.2 bump moved every other
          # copy while leaving it: `go test ./...`, vet, gofmt and golangci-lint
          # were all green on a commit that failed HERE, at the last step, with
          # a message that reads like a dropped arm. tests/validate's
          # TestTheWorkflowsArmCountIsTotalArms reads this file now, so the next
          # bump fails locally in a second instead of in CI in six minutes.
          grep -q '25 of 25 arm(s) evaluated' ../validate.log \
            || { echo "the twin did not report 25 of 25 arms evaluated: an arm was added or removed without this literal, or an arm skipped where D9 requires none"; exit 1; }
          grep -q '0 refusal(s)' ../validate.log \
            || { echo "the twin was refused, and the permitted twin is the one project that must pass"; exit 1; }
          grep -q 'skipped' ../validate.log \
            && { echo "an arm skipped on the twin: D9 requires every arm evaluated and none skipped"; exit 1; }
          echo "PROOF $(grep -oE '[0-9]+ of [0-9]+ arm\(s\) evaluated' ../validate.log | sed -n 1p)"
          # AND THE TOY, WHICH IS A PROJECT WITH A REAL PROCESS BEHIND IT (R5.2,
          # issue 73). examples/toy's [adapter].command is ["toy-adapter"], and
          # that adapter starts cmd/toy itself, so this is the only arm that
          # proves the pair works end to end on the runner: the twin's adapter
          # answers from a recorded surface, the toy's answers by driving an
          # application over HTTP.
          #
          # BOTH BINARIES GO ON PATH UNDER THEIR OWN NAMES, for the reason the
          # rumor link above exists: the project names them as a real project
          # would, and a run that found neither would report could-not-run on
          # five arms and still account for every one of them.
          timeout 300 "$GO" build -o "$bindir/toy" ./cmd/toy || { echo "cmd/toy did not build"; exit 1; }
          timeout 300 "$GO" build -o "$bindir/toy-adapter" ./cmd/toy-adapter || { echo "cmd/toy-adapter did not build"; exit 1; }
          rc=0
          PATH="$bindir:$PATH" timeout 300 ./../rumor-bin validate examples/toy > ../validate-toy.log 2>&1 || rc=$?
          cat ../validate-toy.log
          test "$rc" -eq 124 && { echo "HANG: validate on the toy exceeded 300s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "validate exited $rc on the toy, which issue 73 requires to pass"; exit "$rc"; }
          grep -q '25 of 25 arm(s) evaluated' ../validate-toy.log \
            || { echo "the toy did not report 25 of 25 arms evaluated"; exit 1; }
          grep -q '0 refusal(s)' ../validate-toy.log \
            || { echo "the toy was refused, and issue 73 requires it to validate"; exit 1; }
          grep -q 'skipped' ../validate-toy.log \
            && { echo "an arm skipped on the toy: it declares a browser stage and a direct observation so that none has to"; exit 1; }
          echo "PROOF the toy $(grep -oE '[0-9]+ of [0-9]+ arm\(s\) evaluated' ../validate-toy.log | sed -n 1p), adapter and application both spawned"

      - name: go.mod is ACCURATE, not merely present
        run: |
          set -o pipefail
          cd src-tree
          GO=""
          for c in go126 go127 go125 go; do
            command -v "$c" >/dev/null 2>&1 && { GO="$c"; break; }
          done
          test -n "$GO" || { echo "no go127, go126, go125 or go on PATH: PROVISIONING finding"; exit 1; }
          # See the build step for why this is a gate and not a preference.
          export GOTOOLCHAIN=local
          # AND THE CHOSEN TOOLCHAIN IS THE WHOLE ENVIRONMENT, NOT JUST $GO.
          # Run 1287 is why: with go126 leading, this step's $GO was go1.26.11
          # and govulncheck was rebuilt under it -- then govulncheck shelled out
          # to the BARE `go`, which on this runner is a SYMLINK to go127, and
          # its go1.26 loader met go1.27's `go list`: "uses version go1.26 of
          # the source-processing packages but runs version go1.27 of 'go
          # list'", refusing go1.27-tagged files in opa and dsig. The gate
          # BLOCKED, correctly, and the cause was two Gos in one step.
          #
          # GOROOT/bin AND NOT THE DIRECTORY $GO LIVES IN: /usr/local/bin holds
          # go126, go127 AND the bare `go` symlink, so prepending it changes
          # nothing. `$GO env GOROOT`/bin holds exactly one go and one gofmt --
          # the chosen toolchain's -- so after this, every bare name in the step
          # and in anything it spawns is the Go the loop picked (fable, coop
          # main/1019: no step may see two Gos).
          GOROOT_BIN="$(timeout 30 "$GO" env GOROOT)/bin"
          test -x "$GOROOT_BIN/go" || { echo "the chosen toolchain $GO reports GOROOT $GOROOT_BIN with no go in it: PROVISIONING finding, and the bare name would still be another Go"; exit 1; }
          export PATH="$GOROOT_BIN:$PATH"
          # THE GATE ASSERTED go.mod EXISTS AND NEVER THAT IT WAS RIGHT. The
          # fetch step's `test -f go.mod` is a wrong-tree guard and reads none
          # of the file's content, so through every release to v0.1.19 an
          # unused require, a missing one, or a go.sum short an entry could
          # travel to a tag with nothing to say so (ibis, thread:rumor).
          #
          # THE DIFF IS ON STDOUT AND THE EXCUSE IS ON STDERR, which is why
          # they are captured apart: tidy exits non-zero BOTH for "these files
          # are not what tidying would write" and for "I could not read the
          # module graph", and it needs the network to answer at all -- it
          # resolves the test-only dependencies of dependencies, 32 modules on
          # a cold cache, measured. The READING is
          # tools/gomod-accuracy-verdict.sh's, with its own battery in the
          # verdict-scripts step below, because a classification written inline
          # here is one a push is the only way to exercise.
          rc=0
          timeout 300 "$GO" mod tidy -diff > ../tidy.diff 2> ../tidy.err || rc=$?
          v=0
          timeout 60 sh tools/gomod-accuracy-verdict.sh ../tidy.diff ../tidy.err "$rc" go.sum || v=$?
          # The verdict's own codes travel out of this step: 3 a verdict on the
          # tree, 2 a defect in this step or in our reading of the tool, 1 no
          # answer reached. The clause and its reason are on stdout above.
          test "$v" -eq 0 || { echo "the manifest arm answered $v, named by the clause above"; exit "$v"; }
          echo "PROOF go.mod and go.sum are tidy, by the clause above"

      - name: golangci-lint
        run: |
          set -o pipefail
          cd src-tree
          GO=""
          for c in go126 go127 go125 go; do
            command -v "$c" >/dev/null 2>&1 && { GO="$c"; break; }
          done
          test -n "$GO" || { echo "no go127, go126, go125 or go on PATH: PROVISIONING finding"; exit 1; }
          # See the build step for why this is a gate and not a preference.
          export GOTOOLCHAIN=local
          # AND THE CHOSEN TOOLCHAIN IS THE WHOLE ENVIRONMENT, NOT JUST $GO.
          # Run 1287 is why: with go126 leading, this step's $GO was go1.26.11
          # and govulncheck was rebuilt under it -- then govulncheck shelled out
          # to the BARE `go`, which on this runner is a SYMLINK to go127, and
          # its go1.26 loader met go1.27's `go list`: "uses version go1.26 of
          # the source-processing packages but runs version go1.27 of 'go
          # list'", refusing go1.27-tagged files in opa and dsig. The gate
          # BLOCKED, correctly, and the cause was two Gos in one step.
          #
          # GOROOT/bin AND NOT THE DIRECTORY $GO LIVES IN: /usr/local/bin holds
          # go126, go127 AND the bare `go` symlink, so prepending it changes
          # nothing. `$GO env GOROOT`/bin holds exactly one go and one gofmt --
          # the chosen toolchain's -- so after this, every bare name in the step
          # and in anything it spawns is the Go the loop picked (fable, coop
          # main/1019: no step may see two Gos).
          GOROOT_BIN="$(timeout 30 "$GO" env GOROOT)/bin"
          test -x "$GOROOT_BIN/go" || { echo "the chosen toolchain $GO reports GOROOT $GOROOT_BIN with no go in it: PROVISIONING finding, and the bare name would still be another Go"; exit 1; }
          export PATH="$GOROOT_BIN:$PATH"
          # PINNED, and the pin is MEASURED: v2.14.0 is what proxy.golang.org
          # reported as latest for github.com/golangci/golangci-lint/v2 on
          # 2026-10-14 (published 2026-09-24). An unpinned @latest is a gate
          # whose verdict can change with no commit here saying so -- ratchet
          # r0.2/4's drift guard, which the Rust file learned the hard way.
          # `go env` is local and instant, and bounded anyway: "it is instant in
          # practice" is the exact reasoning this file records as the cause of a
          # 17-minute run, and the bounds checker now reads a $VAR command as an
          # invocation, so an unbounded one here is a finding rather than a habit.
          # THE SIBLING OF THE govulncheck FIX, AND IT COST A RED TO FIND:
          # keying that step's cache by toolchain and leaving this one alone was
          # half a fix. MEASURED, run 721 on c583b1f: with the toolchain finally
          # at go1.27.4, the golangci-lint left by the go1.26 runs PANICKED
          # inside go/types -- every frame in `/usr/local/go126/src/go/types/`,
          # a binary type-checking sources newer than the stdlib compiled into
          # it. A VERSION CHECK CANNOT SEE THIS: that copy IS the pinned 2.14.0
          # and passed the assertion below. Version is not provenance.
          GOVER="$(timeout 30 "$GO" version | awk '{print $3}')"
          GOBIN_DIR="$(timeout 30 "$GO" env GOPATH)/bin/$GOVER"
          BIN="$GOBIN_DIR/golangci-lint"
          # AND THE TOOL SAYS WHICH TOOLCHAIN BUILT IT, in the same line this
          # step already reads for the pin: "built with go1.27.2". So a copy on
          # PATH is accepted only when that matches, and nothing is deleted --
          # a provisioned binary belongs to whoever provisioned it.
          if command -v golangci-lint >/dev/null 2>&1; then
            FOUND="$(command -v golangci-lint)"
            BUILT="$(timeout 60 "$FOUND" --version 2>&1 | sed -n 1p | sed -n 's/.*built with \(go[0-9][0-9.]*\).*/\1/p')"
            if test "$BUILT" = "$GOVER"; then
              BIN="$FOUND"
              echo "PROOF reusing $FOUND, built with $BUILT, which is this step's $GOVER"
            else
              echo "PROOF ignoring $FOUND: built with ${BUILT:-a toolchain it would not name}, this step resolved $GOVER"
            fi
          fi
          test -x "$BIN" || {
                 # THE PRE-CHECK TAKES THE CAUSAL CLAIM OUT OF THE TIMEOUT (ibis
                 # r0.2/36). A bounded install that returns 124 proves only that
                 # the bound elapsed; a 60 s module lookup fails in its OWN words
                 # when there is no route, so by the time the wrapper can fire,
                 # no-route is excluded and "too slow" is the only reading left.
                 rc=0
                 timeout 60 "$GO" list -m github.com/golangci/golangci-lint/v2@v2.14.0 > ../lintidx.log 2>&1 || rc=$?
                 tail -3 ../lintidx.log
                 test "$rc" -eq 124 && { echo "the module proxy did not answer in 60s. That is the bound, not a diagnosis. The install was never attempted"; exit 1; }
                 test "$rc" -eq 0 || { echo "go list -m exited $rc: the proxy is unreachable or refused the pin, and the install was never attempted"; exit 1; }
                 echo "PROOF the proxy answered for the pin in under 60s, so a slow install can only mean slow"
                 rc=0
                 GOBIN="$GOBIN_DIR" timeout 900 "$GO" install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 > ../lintinst.log 2>&1 || rc=$?
                 tail -20 ../lintinst.log
                 test "$rc" -eq 124 && { echo "HANG: go install golangci-lint exceeded 900s. The proxy answered above, so this is NOT no-route. RUNNER finding, and it blocks the lint gate rather than failing it."; exit 124; }
                 test "$rc" -eq 0 || { echo "go install golangci-lint exited $rc"; exit "$rc"; } }
          test -x "$BIN" || { echo "golangci-lint still absent at $BIN after install"; exit 1; }
          # ASSERT the version, do not merely print it. The literal is duplicated
          # from the install line ON PURPOSE: reading it out of a shared variable
          # would make this agree with itself whatever got installed.
          v="$(timeout 60 "$BIN" --version 2>&1 | sed -n 1p)"
          echo "$v"
          case "$v" in
            *2.14.0*) : ;;
            *) echo "golangci-lint is not the pinned 2.14.0: $v. A provisioned copy at the wrong version is a provisioning finding, not something to install over"; exit 1 ;;
          esac
          rc=0
          # BOTH CAPS OFF, because a capped count reads as a complete one.
          # golangci-lint defaults `issues.max-same-issues` to 3 and
          # `issues.max-issues-per-linter` to 50 (`pkg/commands/flagsets.go`
          # lines 118 and 120 in v2.14.0), and max-same-issues caps on the
          # issue TEXT (`pkg/result/processors/max_same_issues.go`, keyed on
          # `issue.Text`) -- so N identical findings are REPORTED as 3 and the
          # remainder goes to `Infof`, which this step's `tail -30` cannot
          # reach. MEASURED on f9ba5c9 with this same 2.14.0 binary: the
          # default run prints `3 issues: errcheck: 3` and the same tree with
          # these flags prints `4 issues: errcheck: 4`, the fourth being
          # internal/attaint/attaint.go:517. Task 231 failed on the capped
          # three; fixing exactly those would have failed task 232 on the
          # fourth. The cap moves the list and the summary together, so nothing
          # inside that output disagrees with anything and a reader cannot tell
          # a cap from a count -- wren, thread:rumor/607. tools/check-workflows.py
          # pins both flags here.
          timeout 900 "$BIN" run --max-same-issues=0 --max-issues-per-linter=0 ./... > ../lint.log 2>&1 || rc=$?
          tail -30 ../lint.log
          test "$rc" -eq 124 && { echo "HANG: golangci-lint exceeded 900s. RUNNER finding."; exit 124; }
          # ISSUES AND A CRASH ARE DIFFERENT VERDICTS, and this line used to call
          # both "a linter fired, named above". `--issues-exit-code` defaults to
          # 1, so ONE is findings and anything else is the tool failing: on run
          # 721's panic it exited 2, and the reader was sent to look above for a
          # linter that had never run. A gate that misnames its own failure
          # spends the reader's time on the tree instead of on the gate.
          test "$rc" -eq 1 && { echo "golangci-lint exited 1: a linter fired, named above"; exit 1; }
          test "$rc" -eq 0 || { echo "golangci-lint exited $rc, which is NOT its issues-found code (1): the TOOL failed rather than the tree. Read the output above as a crash or a refusal, not as a finding"; exit "$rc"; }
          echo "PROOF lint ran with $v"

      - name: the verdict scripts' own batteries
        run: |
          set -o pipefail
          cd src-tree
          # A BATTERY THAT NEVER RUNS IN CI IS A BATTERY THAT CAN ROT. Two
          # steps in this project delegate a classification to a script
          # precisely because a workflow step cannot be driven without pushing;
          # the scripts carry their own cases, and this is where those cases are
          # exercised on the runner rather than only on an author's machine.
          rc=0
          timeout 120 sh tools/govulncheck-verdict.sh --self-test > ../gv-self.log 2>&1 || rc=$?
          cat ../gv-self.log
          test "$rc" -eq 124 && { echo "HANG: the govulncheck verdict's self-test exceeded 120s. RUNNER finding; the verdict was NOT checked."; exit 124; }
          test "$rc" -eq 0 || { echo "the govulncheck verdict's own self-test FAILED, so its reading of any scan below means nothing"; exit "$rc"; }
          # THE DECLARED COUNT, not just a zero exit: a clause removed along
          # with its case would leave this green. 9 clauses over 10 cases --
          # two cases reach `vulnerabilities-found`, one for a standard-library
          # entry and one for a module entry.
          grep -qE 'all 9 clauses answered as expected over 10 case\(s\)' ../gv-self.log \
            || { echo "the self-test did not report all 9 clauses over 10 cases: a clause stopped being reached, or the script's clauses changed without this literal"; exit 1; }
          rc=0
          timeout 120 sh tools/gomod-accuracy-verdict.sh --self-test > ../gm-self.log 2>&1 || rc=$?
          cat ../gm-self.log
          test "$rc" -eq 124 && { echo "HANG: the manifest verdict's self-test exceeded 120s. RUNNER finding; the verdict was NOT checked."; exit 124; }
          test "$rc" -eq 0 || { echo "the manifest verdict's own self-test FAILED, so its reading of go mod tidy -diff means nothing"; exit "$rc"; }
          # THE DECLARED COUNT, as above. 9 clauses over 10 cases -- two cases
          # reach `nothing-to-be-accurate-about`, for an empty go.sum and an
          # absent one. That it is the same 9-over-10 as the govulncheck
          # verdict is a coincidence and not a copied line: the counts are
          # grepped out of two different logs, named here so a reader does not
          # read one literal as serving both.
          grep -qE 'all 9 clauses answered as expected over 10 case\(s\)' ../gm-self.log \
            || { echo "the self-test did not report all 9 clauses over 10 cases: a clause stopped being reached, or the script's clauses changed without this literal"; exit 1; }
          rc=0
          timeout 120 sh tools/verify-tag-verdict.sh --self-test > ../vt-self.log 2>&1 || rc=$?
          cat ../vt-self.log
          test "$rc" -eq 124 && { echo "HANG: the tag verdict's self-test exceeded 120s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "the tag verdict's own self-test FAILED, so the tag pipeline's reading of git verify-tag means nothing"; exit "$rc"; }
          # NO DECLARED COUNT FOR THIS ONE, and the reason is stated rather
          # than left as an inconsistency: tools/verify-tag-verdict.sh belongs
          # to the tag pipeline (issue 39), and pinning its case count here
          # would make this file fail on a deliberate change to that script in
          # a run that does not touch this file. Its own PROOF line carries the
          # count, and it is printed above.
          # THE FOURTH BATTERY, AND IT IS HERE BECAUSE IT ROTTED WHILE IT WAS
          # NOT (ibis, coop rumor/2005; fable's assignment at /2007). This step's
          # own comment says a battery that never runs in CI is a battery that
          # can rot, and tools/test_d4control.sh was the one verdict battery
          # absent from the list: its `add-all-declared` cell went red at
          # be91186 on 2026-11-01, when issue 111's three cases joined
          # d4control.py's ADDED_BY and the cell's stated list was not grown
          # with it, and it stayed red through the v0.1.49 release because
          # nothing anywhere ran it -- `git grep test_d4control` found a
          # coverage.toml path and one line of prose, no caller.
          #
          # IT IS NOT A `--self-test`: this script IS the battery, so it is
          # invoked plainly, and its declared count is pinned like the first two
          # siblings' rather than left out like the third's -- d4control.py and
          # this battery are both rumor's own, so a deliberate change to either
          # is a change this file should hear about.
          rc=0
          timeout 120 sh tools/test_d4control.sh > ../d4c-self.log 2>&1 || rc=$?
          cat ../d4c-self.log
          test "$rc" -eq 124 && { echo "HANG: the d4 control's battery exceeded 120s. RUNNER finding; the control was NOT checked."; exit 124; }
          test "$rc" -eq 0 || { echo "the d4 control's own battery FAILED, so its reading of any checkpoint drift means nothing"; exit "$rc"; }
          grep -qE 'D4CONTROL ARMS: 17 passed, 0 failed' ../d4c-self.log \
            || { echo "the battery did not report all 17 arms passing: an arm stopped being reached, or the battery's arms changed without this literal"; exit 1; }
          echo "PROOF all four verdict scripts' batteries ran on this runner"

      - name: govulncheck
        run: |
          set -o pipefail
          cd src-tree
          GO=""
          for c in go126 go127 go125 go; do
            command -v "$c" >/dev/null 2>&1 && { GO="$c"; break; }
          done
          test -n "$GO" || { echo "no go127, go126, go125 or go on PATH: PROVISIONING finding"; exit 1; }
          # See the build step for why this is a gate and not a preference.
          export GOTOOLCHAIN=local
          # AND THE CHOSEN TOOLCHAIN IS THE WHOLE ENVIRONMENT, NOT JUST $GO.
          # Run 1287 is why: with go126 leading, this step's $GO was go1.26.11
          # and govulncheck was rebuilt under it -- then govulncheck shelled out
          # to the BARE `go`, which on this runner is a SYMLINK to go127, and
          # its go1.26 loader met go1.27's `go list`: "uses version go1.26 of
          # the source-processing packages but runs version go1.27 of 'go
          # list'", refusing go1.27-tagged files in opa and dsig. The gate
          # BLOCKED, correctly, and the cause was two Gos in one step.
          #
          # GOROOT/bin AND NOT THE DIRECTORY $GO LIVES IN: /usr/local/bin holds
          # go126, go127 AND the bare `go` symlink, so prepending it changes
          # nothing. `$GO env GOROOT`/bin holds exactly one go and one gofmt --
          # the chosen toolchain's -- so after this, every bare name in the step
          # and in anything it spawns is the Go the loop picked (fable, coop
          # main/1019: no step may see two Gos).
          GOROOT_BIN="$(timeout 30 "$GO" env GOROOT)/bin"
          test -x "$GOROOT_BIN/go" || { echo "the chosen toolchain $GO reports GOROOT $GOROOT_BIN with no go in it: PROVISIONING finding, and the bare name would still be another Go"; exit 1; }
          export PATH="$GOROOT_BIN:$PATH"
          # PINNED AND MEASURED, same reasoning: golang.org/x/vuln v1.9.0 is what
          # the proxy reported as latest on 2026-10-14 (published 2026-10-11).
          # `go env` is local and instant, and bounded anyway: "it is instant in
          # practice" is the exact reasoning this file records as the cause of a
          # 17-minute run, and the bounds checker now reads a $VAR command as an
          # invocation, so an unbounded one here is a finding rather than a habit.
          # A CACHED TOOL BINARY IS ONLY VALID FOR THE TOOLCHAIN THAT BUILT
          # IT, and this step used to reuse whatever it found. MEASURED on the
          # ci jail 2026-11-12 while moving it to go127: the govulncheck left
          # behind by the go1.26 runs cannot analyse go1.27 sources and says so
          # for every package -- "This application uses version go1.26 of the
          # source-processing packages but runs version go1.27 of `go list`" --
          # an ANALYSIS failure in the shape of a clean scan. So the install
          # directory is keyed BY TOOLCHAIN, which makes a stale binary a
          # different path rather than a wrong answer, and a govulncheck found
          # on PATH is accepted only if its own build toolchain matches. Nothing
          # is deleted: a provisioned binary belongs to whoever provisioned it.
          GOVER="$(timeout 30 "$GO" version | awk '{print $3}')"
          GOBIN_DIR="$(timeout 30 "$GO" env GOPATH)/bin/$GOVER"
          BIN="$GOBIN_DIR/govulncheck"
          if command -v govulncheck >/dev/null 2>&1; then
            FOUND="$(command -v govulncheck)"
            BUILT="$(timeout 30 "$GO" version "$FOUND" 2>/dev/null | awk '{print $NF}')"
            if test "$BUILT" = "$GOVER"; then
              BIN="$FOUND"
              echo "PROOF reusing $FOUND, built by $BUILT, which is this step's $GOVER"
            else
              echo "PROOF ignoring $FOUND: built by ${BUILT:-an unreadable toolchain}, this step resolved $GOVER"
            fi
          fi
          test -x "$BIN" || {
                 rc=0
                 timeout 60 "$GO" list -m golang.org/x/vuln@v1.9.0 > ../vulnidx.log 2>&1 || rc=$?
                 tail -3 ../vulnidx.log
                 test "$rc" -eq 124 && { echo "the module proxy did not answer in 60s. That is the bound, not a diagnosis. The install was never attempted"; exit 1; }
                 test "$rc" -eq 0 || { echo "go list -m exited $rc: the proxy is unreachable or refused the pin, and the install was never attempted"; exit 1; }
                 echo "PROOF the proxy answered for the pin in under 60s"
                 rc=0
                 GOBIN="$GOBIN_DIR" timeout 900 "$GO" install golang.org/x/vuln/cmd/govulncheck@v1.9.0 > ../vulninst.log 2>&1 || rc=$?
                 tail -20 ../vulninst.log
                 test "$rc" -eq 124 && { echo "HANG: go install govulncheck exceeded 900s. The proxy answered above, so NOT no-route. RUNNER finding."; exit 124; }
                 test "$rc" -eq 0 || { echo "go install govulncheck exited $rc"; exit "$rc"; } }
          test -x "$BIN" || { echo "govulncheck still absent at $BIN after install"; exit 1; }
          # govulncheck READS A DATABASE OVER THE NETWORK, which makes it the one
          # gate here whose verdict depends on a third party being up. That is why
          # its failure is read apart from the others: an unreachable vuln.go.dev
          # is a RUNNER/route finding, not a vulnerable tree.
          #
          # THE VERDICT COMES FROM tools/govulncheck-verdict.sh, one
          # implementation with a battery over the strings this project has
          # really seen -- including run 192's. The classification used to be
          # inline here and said the OPPOSITE of what rc 3 means: govulncheck's
          # own source sets errVulnerabilitiesFound to code 3 (x/vuln v1.9.0,
          # internal/scan/errors.go) and its doc.go says so in prose, while this
          # step announced "it could not load the vulnerability database. Route
          # finding, not a vulnerable tree". Run 192's log carries both lines
          # four apart: "Your code is affected by 9 vulnerabilities from the Go
          # standard library", then the route claim. The job failed either way,
          # so the defect was the DIAGNOSIS, which is the worse kind -- the
          # reason is what gets acted on, and this one sent a reader to the
          # network instead of to nine CVEs. A step is only exercised by
          # pushing, so the logic lives where it can be driven.
          # THE ARM FABLE ASKED FOR, AND IT WOULD HAVE BEEN RED FOR NINETEEN
          # DAYS: govulncheck is the one tool here that SHELLS OUT to the Go on
          # PATH rather than using the one it was told about, so this step is
          # where two Gos become a wrong answer instead of a slower one. The
          # binary is keyed to $GOVER above; this requires the BARE name to
          # report the same version, by reading it rather than assuming the
          # PATH export took. Equality is asserted on the full version string,
          # not just the number, so a cross-compiled or differently-built go of
          # the same version is still a finding.
          BARE="$(timeout 30 go version)"
          CHOSE="$(timeout 30 "$GO" version)"
          test "$BARE" = "$CHOSE" || { echo "the bare toolchain name reports \"$BARE\" and this step chose \"$CHOSE\": govulncheck shells out to the bare name, so its loader and the go list it spawns would be different toolchains -- which is run 1287's CLAUSE tool-failed. BLOCKED, not passed"; exit 1; }
          echo "PROOF the bare toolchain name in this step is $BARE, the same toolchain the loop chose"
          rc=0
          timeout 900 "$BIN" ./... > ../vuln.log 2>&1 || rc=$?
          tail -30 ../vuln.log
          test "$rc" -eq 124 && { echo "HANG: govulncheck exceeded 900s. RUNNER finding; it blocks the vulnerability gate rather than failing it."; exit 124; }
          vrc=0
          timeout 60 sh tools/govulncheck-verdict.sh ../vuln.log "$rc" || vrc=$?
          case "$vrc" in
            0) echo "PROOF the scan ran and this tree's code reaches nothing the database knows about" ;;
            3) echo "REFUSED: a vulnerability this tree's own code reaches, named above. A Standard library entry is the runner's toolchain and a Module entry is a bump"; exit 3 ;;
            2) echo "STEP DEFECT: govulncheck refused this step's invocation, which is not a finding about the tree"; exit 2 ;;
            *) echo "BLOCKED: the vulnerability gate did not reach a verdict, for the clause named above. Not a pass"; exit 1 ;;
          esac
          # The summary-line check that used to sit here is now the verdict
          # script's `clean` clause, which refuses rc 0 with no summary of its
          # own: one rule in one place, since two implementations of it are how
          # they drift apart.
          echo "PROOF scan ran with $(timeout 60 "$BIN" -version 2>&1 | head -2 | tr '\n' ' ' || true)"

      - name: licences (the built surface, against R0.2's allowlist)
        run: |
          set -o pipefail
          cd src-tree
          GO=""
          for c in go126 go127 go125 go; do
            command -v "$c" >/dev/null 2>&1 && { GO="$c"; break; }
          done
          test -n "$GO" || { echo "no go127, go126, go125 or go on PATH: PROVISIONING finding"; exit 1; }
          # See the build step for why this is a gate and not a preference.
          export GOTOOLCHAIN=local
          # AND THE CHOSEN TOOLCHAIN IS THE WHOLE ENVIRONMENT, NOT JUST $GO.
          # Run 1287 is why: with go126 leading, this step's $GO was go1.26.11
          # and govulncheck was rebuilt under it -- then govulncheck shelled out
          # to the BARE `go`, which on this runner is a SYMLINK to go127, and
          # its go1.26 loader met go1.27's `go list`: "uses version go1.26 of
          # the source-processing packages but runs version go1.27 of 'go
          # list'", refusing go1.27-tagged files in opa and dsig. The gate
          # BLOCKED, correctly, and the cause was two Gos in one step.
          #
          # GOROOT/bin AND NOT THE DIRECTORY $GO LIVES IN: /usr/local/bin holds
          # go126, go127 AND the bare `go` symlink, so prepending it changes
          # nothing. `$GO env GOROOT`/bin holds exactly one go and one gofmt --
          # the chosen toolchain's -- so after this, every bare name in the step
          # and in anything it spawns is the Go the loop picked (fable, coop
          # main/1019: no step may see two Gos).
          GOROOT_BIN="$(timeout 30 "$GO" env GOROOT)/bin"
          test -x "$GOROOT_BIN/go" || { echo "the chosen toolchain $GO reports GOROOT $GOROOT_BIN with no go in it: PROVISIONING finding, and the bare name would still be another Go"; exit 1; }
          export PATH="$GOROOT_BIN:$PATH"
          # THIS STEP REPLACED A TRIPWIRE, AND THE TRIPWIRE DID ITS JOB. Until
          # G3 this asserted the module graph held exactly ONE module, because a
          # zero-dependency tree has no licence surface and a ported deny.toml
          # would have read green with nothing to judge. OPA is the first real
          # dependency and broke that assertion by design, which is what it was
          # for (rook rumor/499).
          #
          # The gate is now tests/licences, a Go TEST rather than a tool: it is
          # already inside `go test ./...`, so gating licences adds no new
          # dependency to this file. It is run again by name here so the surface
          # has its own row -- a verdict folded into another step's output is one
          # nobody reads -- and because `go test ./...` would report it as a
          # package name with no figure.
          #
          # The oracle is `go list -deps -test ./...`: what is actually built,
          # tests included. Not the module graph, which over-counts, and not
          # bare -deps, which is blind to a test-only import. go-port/4 and /5.
          rc=0
          timeout 600 "$GO" test ./tests/licences/ -v > ../lic.log 2>&1 || rc=$?
          grep -E 'PROOF|FAIL|---' ../lic.log | tail -20
          test "$rc" -eq 124 && { echo "HANG: the licence gate exceeded 600s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "the licence gate refused, named above"; exit "$rc"; }
          # a count only the gate itself computes
          grep -qE 'PROOF [0-9]+ of [0-9]+ built module\(s\) carry a licence inside' ../lic.log \
            || { echo "no licence count: the gate did not reach a verdict over the surface"; exit 1; }
          echo "PROOF $(grep -oE '[0-9]+ of [0-9]+ built module\(s\) carry a licence inside[^"]*' ../lic.log | sed -n 1p)"
          # THE ALLOWLIST PAIR IS ASSERTED, NOT MERELY PRINTED (ratchet,
          # thread:go-port/54). The -v above makes a SKIP visible in this log,
          # and visible is not asserted: the only assertion here was the count,
          # so TestTheAllowlistsAgree silently becoming a pass -- or a skip --
          # changed the log and failed nothing.
          #
          # THE REVIEW ASKED FOR THE SKIP TO BE ASSERTED BY NAME. That is now
          # the wrong assertion: with R0.2's ids enumerated in docs/design.md
          # the arm reads the document and no longer skips at all, so asserting
          # a skip would pin a state this repository can no longer reach. The
          # agreement is asserted instead, and ANY skip in this suite is a
          # finding -- a test that stops running is the thing both versions of
          # this check were worried about.
          grep -q 'PROOF the document and this file name the same 8 licence(s)' ../lic.log \
            || { echo "the allowlist pair did not agree, or TestTheAllowlistsAgree did not run: R0.2's ids live in docs/design.md and this suite carries its own copy, and the two must match"; exit 1; }
          echo "PROOF the allowlist pair agreed on 8 ids, document against test"
          # AND THE PROJECT'S OWN LICENSE, FOR THE SAME REASON AS THE PAIR ABOVE.
          # The arm above was asserted because an arm that stops running leaves
          # a green suite; the arm that holds docs/design.md's project-license
          # sentence against LICENSE's own title is new (quill, coop r10/49) and
          # carries exactly that risk -- delete it and this suite still passes.
          #
          # THE PREFIX AND NOT THE WHOLE LINE, deliberately: the arm itself
          # compares the two names, so this step only has to know it reached a
          # verdict. Spelling the license here would make ci.yml a THIRD copy of
          # the fact whose two copies drifting is the thing being fixed.
          grep -q "PROOF the project's license is one fact in two copies:" ../lic.log \
            || { echo "the project-license pair did not agree, or TestTheProjectsOwnLicenceIsNamedTheSameInBothCopies did not run: LICENSE names the license this project ships under and docs/design.md is where that decision lives, and the two must match"; exit 1; }
          echo "PROOF the project-license pair agreed, LICENSE against docs/design.md"
          # AND THE STEP READS LICENSE ITSELF TO SEE WHICH BRANCH THE ARM SHOULD
          # HAVE TAKEN (quill, coop r10/54). The arm's version read is
          # conditional on LICENSE carrying a `Version x.y.z` line, and the
          # suite now refuses a version in the document that LICENSE does not
          # state -- so the name-only branch is legitimate ONLY when neither
          # copy is versioned. This asserts that from OUTSIDE the arm: if the
          # file on disk has a version line, the log must carry the
          # version-holding PROOF. It spells no license, so the fact still
          # lives in exactly two places.
          #
          # THE PATH IS `LICENSE`, NOT `../../LICENSE`: this step has already
          # cd'd into src-tree, and `../../LICENSE` is the path from the test's
          # own directory. A wrong path here fails the `if` quietly and hands
          # back the free escape, which is why tests/hygiene drives this
          # fragment both ways.
          if grep -q '^Version ' LICENSE; then
            grep -q 'at version "' ../lic.log \
              || { echo "LICENSE states a version line and the licence suite's PROOF does not carry a version: the arm took its name-only branch over a versioned license, so the version half of the project-license pair ran on nothing"; exit 1; }
            echo "PROOF LICENSE states a version and the suite's PROOF carries it"
          else
            echo "PROOF LICENSE states no version line, so the pair is held by name and the suite says so"
          fi
          if grep -q '^--- SKIP:' ../lic.log; then
            grep '^--- SKIP:' ../lic.log
            echo "a test in the licence suite SKIPPED. Every arm here is meant to run on every tree; a skip is a gap this step will not pass over."
            exit 1
          fi
          echo "PROOF no arm of the licence suite skipped"
