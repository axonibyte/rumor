# CI for the rumor workspace -- G1, issue 32, ported from the Rust ci.yml at
# 20675b3 for cal's pivot to Go with embedded OPA.
#
# WHAT CARRIES OVER UNCHANGED, because none of it was about Rust: one FreeBSD
# job; no actions/checkout; a timeout(1) on every external call plus a
# timeout-minutes backstop; rc 124 reported separately from a failure; `set -o
# pipefail` in every step; redirect-then-read-status-then-format rather than a
# pipe; a non-fatal probe first; and every step emitting a value only execution
# could have produced. The paragraphs below are the reasons, kept because the
# defects they record are not language-specific.
#
# ONE JOB, FREEBSD ONLY. cal ruled 2026-10-10: "no linux runner, just freebsd
# for now." A second job whose label no runner answers would QUEUE FOREVER, and
# a queued job is not red -- it reads as "no failure" rather than "never ran",
# which makes every green in this file ambiguous.
#
# `runs-on` binds to the runner's LABEL, not its name. cal renamed the runner
# forge-01_jail on 2026-10-10 (was forge-01-ci-jail) and ibis measured the label
# unchanged across the rename (r0.runners run #6).
#
# EVERY STEP PROVES IT RAN. A zero-elapsed success is what a FAST run and a
# PHANTOM run both look like (ibis, r0.runners/4, after it cost two pushes), so
# elapsed time cannot settle execution in either direction. Each step therefore
# emits a value only execution could have produced -- a version string, a count
# it computed, a name resolved out of the module graph -- never a duration and
# never the absence of red. fable ruled that form at rumor/96.
#
# EVERY EXTERNAL CALL IS BOUNDED, AND A HANG IS A NAMED FINDING. Added after a
# probe drove three unbounded `pkg` calls and ran 17+ minutes on 2026-10-10;
# this runner is SINGLE-CONCURRENCY, so that one hang head-of-line blocked three
# queued runs and every push anyone else would have made. Two mechanisms,
# deliberately:
#
#   timeout-minutes      bounds the JOB whatever hangs, including something this
#                        file does not anticipate. It is a RUNNER feature and
#                        nobody here has observed act_runner honouring it, so it
#                        is the backstop, not the guarantee.
#   timeout(1) per call  plain POSIX, works whatever the runner implements, and
#                        is what the per-step bounds below actually rely on.
#
# rc 124 IS REPORTED SEPARATELY FROM A FAILURE at every step, because they are
# different findings: 124 says the tool never answered inside its bound, which
# is a statement about the RUNNER; any other non-zero says the tool answered and
# the answer was no, which is a statement about the CODE. Collapsing them is how
# a wedged runner gets filed as a broken build.
#
# `tools/check-workflows.py --self-test` refuses this file if any job or
# invocation loses its bound; its own 25 arms are green. It is python and
# LOCAL-ONLY on purpose: adding a python dependency to CI would depend on an
# unmeasured interpreter. (The Rust header called it check-workflow-bounds.py,
# which is not a file that exists -- corrected here.)
#
# STEP 1 IS A PROBE AND IS DELIBERATELY NON-FATAL. If a later step dies for want
# of a tool, step 1 has already named which. A red probe would tell us less than
# a green one that lists what is absent.
#
# NO actions/checkout. It is a JavaScript action and needs node ON THE RUNNER
# (ibis, r0.runners-smoke). git is the narrower dependency and the repo is
# public, so an anonymous clone needs no credential on the runner -- no secret
# reaches CI from this file.
#
# THE GO BINARY IS RESOLVED, NOT NAMED. rook's jail carries go1.25.14 and
# go1.26.8 as `go125` and `go126` with NO bare `go` on PATH, which is the
# FreeBSD ports convention; forge-01_jail's Go is not yet provisioned, so its
# naming is unknown. Each step therefore resolves the first of go, go127, go126,
# go125 that exists and FAILS NAMING ALL FOUR if none does. The resolver is
# repeated per step rather than exported once, because carrying it between steps
# would need $GITHUB_ENV, a runner feature nobody here has measured -- the same
# reasoning that makes timeout-minutes the backstop rather than the guarantee.
#
# go127 LEADS THE NUMBERED NAMES FOR A MEASURED REASON AND NOT FOR BEING NEWEST.
# GO-2026-6859 is in net/http up to go1.26.10, which is what the ci jail had, and
# 41 call paths in this tree reach it -- so run 718 was REFUSED by govulncheck
# with the suite green, which is a toolchain finding wearing a code finding's
# clothes (ibis, coop main/801). It is fixed in go1.26.11 and go1.27.4; 1.26.11
# is in no repo this project can reach, including upstream quarterly and latest,
# and go127-1.27.4 is, so that is what the jail now carries. MEASURED there on
# 2026-11-12: govulncheck v1.9.0 rebuilt under go1.27.4 answers "No
# vulnerabilities found" on this tree, where the same scan under go1.26.10
# reported GO-2026-6859. A bare `go` still wins when one exists, unchanged: that
# is the jail operator's choice and not this file's.
#
# THE TRIGGER IS EVERY BRANCH, and that is this file's own doing rather than a
# repo setting: the Rust version fired only on push to r0.2-ci, so rows 160-164
# all came from workflow_dispatch and a pushed branch produced no run at all
# (rook rumor/475). A workflow's trigger is read from the file ON THE PUSHED
# BRANCH (fable rumor/497), so widening it here is what gives a Go branch its
# row -- nothing on main has to change first.

name: ci

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  freebsd:
    runs-on: freebsd-15-jail
    # The backstop. Sized above the sum of the per-step bounds below so that a
    # step's own timeout fires FIRST and names which step hung; this one only
    # catches a hang somewhere the per-step bounds do not reach.
    timeout-minutes: 45
    steps:
      - name: probe the runner (non-fatal; names what is absent)
        run: |
          # pipefail: without it a pipeline reports its LAST stage's status, so a
          # failing gate piped to a formatter exits 0 and this step goes GREEN.
          # ratchet r0.2/12; driven locally -- a gate exiting 4 piped to `tail -5`
          # continues and exits 0, and exits 4 with this line present.
          set -o pipefail
          echo "uname   $(uname -a)"
          echo "whoami  $(whoami)"
          echo "cwd     $(pwd)"
          for t in git go go127 go126 go125 gofmt gofmt127 gofmt126 gofmt125 node curl; do
            p=$(command -v "$t" 2>/dev/null) && echo "$t  FOUND  $p" || echo "$t  ABSENT"
          done
          # bounded even here. A `version` that cannot answer in 20 s is itself
          # the finding, and "it is instant in practice" is the exact reasoning
          # that produced the 17-minute run.
          for c in go go127 go126 go125; do
            command -v "$c" >/dev/null 2>&1 \
              && { timeout 20 "$c" version 2>/dev/null || echo "$c: did not answer in 20s"; }
          done
          timeout 20 git --version 2>/dev/null || echo "git: none or did not answer in 20s"

      - name: fetch the tree with git, not a JS action
        run: |
          set -o pipefail
          rm -rf src-tree
          rc=0
          timeout 180 git clone --quiet --depth 1 --branch "${GITHUB_REF_NAME:-main}" \
            https://forge.axonibyte.com/axonibyte/rumor.git src-tree || rc=$?
          test "$rc" -eq 124 && { echo "HANG: git clone exceeded 180s. rc 124 proves only that 180s elapsed -- a clone that would have finished at 181s gives this same status, so 'could not reach the forge' is not something this bound can tell you. RUNNER finding; read the step output above for whether any object transfer started."; exit 124; }
          test "$rc" -eq 0 || { echo "git clone exited $rc"; exit "$rc"; }
          cd src-tree
          echo "HEAD $(timeout 30 git rev-parse HEAD)"
          test -f go.mod || { echo "no go.mod: wrong tree"; exit 1; }

      - name: build
        run: |
          set -o pipefail
          cd src-tree
          GO=""
          for c in go go127 go126 go125; do
            command -v "$c" >/dev/null 2>&1 && { GO="$c"; break; }
          done
          test -n "$GO" || { echo "no go, go127, go126 or go125 on PATH: this jail has no Go toolchain, which is a PROVISIONING finding and not a code one"; exit 1; }
          # GOTOOLCHAIN=local, AND IT IS A GATE NOT A PREFERENCE (ratchet
          # go-port/6, reproduced here). Under the default `auto`, a go
          # directive above the installed toolchain is SILENTLY SATISFIED by
          # downloading another one: with a 1.26.8 directive, `go125 test`
          # printed "downloading go1.26.8" and then ok. So naming the versioned
          # binary does not pin what compiles the code, and a dependency can
          # raise the directive underneath us -- OPA v1.21.2 declares go 1.26.0.
          # With `local` the same command refuses, naming both versions. That
          # turns a silent substitution into a loud finding, and it also keeps
          # an unbounded toolchain download from being charged to a step's own
          # timeout and then misread as a build hang.
          export GOTOOLCHAIN=local
          echo "PROOF toolchain $(timeout 30 "$GO" version)"
          # NOT `go build | tail`: a pipeline's status is the LAST stage's, so
          # tail's success would mask a failing build -- the exact defect this
          # gate exists to catch. Redirect, then read the status, then format.
          # -o ../rumor-bin, OUTSIDE the clone, and that is load-bearing rather
          # than tidiness. Writing it into src-tree made `go test` red on run
          # 142: TestCommittedTreeIsFullyMapped walks the tree and reported
          # "rumor-bin matches no entry in docs/coverage.toml". .gitignore does
          # NOT help here -- the walk never reads it, which is why the /rumor
          # entry added for `go build`'s default name stops a commit and not a
          # red suite. The only fix is to keep artefacts out of the tree.
          rc=0
          timeout 900 "$GO" build -o ../rumor-bin ./cmd/rumor > ../build.log 2>&1 || rc=$?
          tail -20 ../build.log
          test "$rc" -eq 124 && { echo "HANG: go build exceeded 900s. rc 124 proves only that the time elapsed, so read build.log rather than this line: a stall with no output at all is route or DNS to the module proxy, though this module has no dependencies to fetch. RUNNER finding either way."; exit 124; }
          test "$rc" -eq 0 || { echo "go build exited $rc"; exit "$rc"; }
          test -x ../rumor-bin || { echo "no binary produced"; exit 1; }
          # a value only execution produces: the binary's own usage line, which
          # it writes to stderr and exits 2 for. `|| true` because exit 2 is the
          # correct answer here and would otherwise fail the step.
          # `sed -n 1p` AND NOT `head -1`, AND IT IS NOT A STYLE CHOICE. This step
          # runs under `set -o pipefail`, and `head -1` EXITS after its line -- so a
          # writer still flushing meets a closed pipe, the pipeline reports 141, and
          # the step dies having printed nothing at all. Run 628 died exactly here:
          # rc 141 after `PROOF toolchain` and before `PROOF compiled by`, which is
          # the only pipefail-exposed pipeline between them. `sed -n 1p` reads the
          # whole stream, so there is no close to race. FOUR SIBLINGS had the same
          # shape and are changed with it (validate's two PROOF lines, the lint
          # version, the licences PROOF); the ones carrying `|| true` or `|| echo`
          # are deliberately masked and are left as they are.
          # THE PROOF IS THE BINARY'S OWN RECORDED TOOLCHAIN, not the version
          # of whatever I invoked. `go version -m` reads what actually compiled
          # it, which is the only form of this line that GOTOOLCHAIN cannot make
          # lie -- and with `local` above it cannot diverge in the first place,
          # so the two together are the claim and its cross-check.
          built_with="$(timeout 30 "$GO" version -m ../rumor-bin 2>&1 | sed -n 1p)"
          echo "PROOF compiled by: $built_with"
          echo "PROOF built binary says: $(timeout 30 ../rumor-bin 2>&1 | head -1 || true)"
          invoked="$(timeout 30 "$GO" env GOVERSION)"
          case "$built_with" in
            *"$invoked"*) : ;;
            *) echo "the binary records a different toolchain than the one invoked: $built_with against $invoked. GOTOOLCHAIN=local should have made this impossible, so read it as a finding about the runner rather than about this code"; exit 1 ;;
          esac

      - name: test
        run: |
          set -o pipefail
          cd src-tree
          GO=""
          for c in go go127 go126 go125; do
            command -v "$c" >/dev/null 2>&1 && { GO="$c"; break; }
          done
          test -n "$GO" || { echo "no go, go127, go126 or go125 on PATH: PROVISIONING finding"; exit 1; }
          # See the build step for why this is a gate and not a preference.
          export GOTOOLCHAIN=local
          rc=0
          # -count=1 IS A GATE AND NOT A PREFERENCE. Without it the build cache
          # serves a PASS for any package whose inputs have not moved, and the
          # harness prints `ok <pkg> (cached)` -- which this step's own PROOF
          # line counted as a package that ran. rook r5/231 and ratchet r5/232
          # and /233 settled what the cache actually keys on: the files the TEST
          # PROCESS ITSELF opens, so a suite reading .go files with WalkDir moves
          # the key while one spawning `go build` does not, and a mutant selected
          # by an env var moves nothing at all. So whether a mutation is seen is
          # a property of how the suite reads its subject -- which is exactly the
          # thing a gate must not depend on.
          # -v IS A GATE TOO, AND IT IS WHAT PUTS THE SUITE'S OWN EVIDENCE IN
          # THE FILE. Without it `go test` discards every `t.Logf` of a PASSING
          # test, so the project's 111 `Logf("PROOF ...` sites -- each one a
          # suite saying what it actually drove -- were in no log this job
          # produced: measured at dd614ba, 0 PROOF lines of 37 plain and 344 of
          # 2275 with -v (rook, coop rumor/1119). The mining step below is what
          # reads them; this flag is what makes them exist to read.
          # THE CAP IS A BUDGET AND NOT A CHECK, so it moves: fable ruled 900 -> 1800
          # at coop rumor/1665 after runs 619 and 622 both died here at exactly 900s
          # with NO test failing -- rc 124, "(no FAIL or panic line in test.log)".
          # WHERE THE TIME GOES, from run 995's own package lines, the last green
          # run before the crossing: tests/run 598.000s, tests/attaint 424.883s,
          # tests/clock 84.998s, tests/engine 78.091s. `go test ./...` runs packages
          # in parallel, so the wall clock is the critical path and tests/run is it.
          # The suite's growth is recorded for 111's bump notes rather than chased
          # here, and this line is the budget that stops a slow suite reading as a
          # broken one.
          #
          # CONTENTION IS NOT THE CAUSE, measured rather than assumed: nothing
          # overlapped 622's window on the runner, while 995 -- which PASSED -- was
          # overlapped for four minutes.
          # AND THE INNER WATCHDOG MOVES WITH THE OUTER BUDGET, which is the
          # half that did not when fable raised 900 -> 1800 at coop rumor/1665.
          # `go test` has its OWN per-binary timeout and its default is 10m, so
          # from that moment this suite carried two budgets for one run with the
          # smaller one undeclared and invisible -- and the smaller one is the
          # one that fires.
          #
          # MEASURED ACROSS THE CROSSING, in this jail, on tests/run:
          #     task 995   598.000s   ok
          #     task 1011  607.591s   FAIL
          #     task 1012  607.258s   FAIL
          # 598 under the default and 607 over it, each red being roughly 600s
          # plus the goroutine-stack dump the panic prints. The suite did not
          # break between those runs; it grew past a bound nobody had declared.
          #
          # WHY RAISING IT IS NOT WEAKENING A CHECK. The watchdog exists to turn
          # a HUNG test into stacks instead of silence. What changes is that a
          # package taking 607s on a slow runner is no longer treated as hung --
          # the thing the measurement above shows it is not.
          #
          # 20m -> 30m, AND THE ORDER INVERTS: THE INNER BOUND NOW EQUALS THE
          # OUTER, so the step's own budget is the only one that can fire. fable
          # ruled it at coop thread:rumor/1835 on run 987, and the run is the
          # argument: 892d0308 PASSED this workflow on r7.5-dst in 1237s and
          # FAILED it on main in 1220s. Same sha, same file, no `if:` anywhere
          # in it -- 1200s of per-binary watchdog plus a ~20s pre-test phase
          # (measured: a warm-cache build of that sha is 7.477s at load 4.27,
          # and task 1070's FULL clone plus a dozen git steps took 16s wall).
          # A green release's own sha went red on main for contention.
          #
          # AND NO INNER BOUND BELOW THE OUTER IS SAFE, which is the half I got
          # wrong first (thread:rumor/1836, corrected at /1837). The only
          # contended figure anyone here holds is CENSORED: tests/attaint was
          # KILLED at 1200.035s under load 16, where alone it is 717.898s. So
          # ">1200s" is all that datum says, nothing bounds a contended package
          # from above, and a watchdog chosen to clear it is a number chosen
          # against a truncation. The per-binary bound cannot be the contention
          # guard at all; the outer budget is, and it answers rc 124 with the
          # diagnostic below instead of a red that names a test.
          #
          # WHAT THIS TRADES, stated because it is a capability and not a
          # detail: with the two equal, a package that TRULY hangs no longer
          # panics with its goroutine stacks -- the outer `timeout` reaches it
          # first and prints nothing about where it stopped. The rc-124 branch
          # below is what carries the diagnosis now, and it names the packages
          # that never reported rather than the line that hung. Narrowing the
          # inner bound again to recover the stacks re-arms exactly the failure
          # run 987 is, so the stacks are the price and this comment is where it
          # is recorded. `tests/hygiene` holds the relation as an arm.
          #
          # AND THE WATCHDOG PANIC IS WHY A HUNG RUN LOOKED LIKE A CLEAN ONE: a
          # binary killed by it never runs its cleanup, so the toy descendants
          # it started outlive it, hold the stdout they inherited, and `go test`
          # waits on a pipe that cannot reach EOF -- every package reported, and
          # the process does not exit. That is the shape the rc-124 diagnostic
          # below reports as "the work finished and the run did not exit".
          timeout 1800 "$GO" test -count=1 -timeout 30m -v ./... > ../test.log 2>&1 || rc=$?
          # THE FAILURE VIEW IS MINED AND NOT ONLY TAILED, because -v moved what
          # the last 20 lines contain: under -v a tail is the verbose output of
          # whichever package finished last, so a FAIL twenty packages earlier
          # scrolls off. The mined lines come first for the same reason the
          # licences step mines its log -- a verdict a reader has to scroll for
          # is a verdict that gets missed.
          # NO `\t` IN THE PATTERN, which is measured and not style. BSD grep
          # 2.6.0-FreeBSD refuses `^\t+--- FAIL` outright -- "grep: trailing
          # backslash (\)" -- so the WHOLE grep exits 2 and prints nothing, and
          # under `set -o pipefail` the `||` branch then printed "(no FAIL or
          # panic line in test.log)". Run 1012 said that sentence over a log
          # holding `--- FAIL`, `FAIL` and `FAIL ... tests/run 607.258s`: the
          # failure view had never searched anything, and the run read as a
          # clean hang for as long as nobody opened the log.
          #
          # AND A BROKEN SEARCH IS NOT AN EMPTY LOG. rc 1 is "no match" and is
          # the ONLY rc the reassuring sentence may be printed for; rc above 1
          # is the instrument failing, which is louder than anything it could
          # have found and fails the step on its own. That distinction is the
          # defect, not the regexp: a pattern can be fixed in one line, while
          # "no output means nothing was wrong" mis-reads every future break
          # the same way.
          #
          # NO PIPE, so the rc is grep's own and not `head`'s, and so a reader
          # that stops early cannot kill the writer (`sed -n` consumes the
          # stream where `head` closes it).
          # AND THE rc IS CAPTURED THROUGH `||`, WHICH IS NOT STYLE EITHER. The
          # runner invokes a step with -e, and under -e a BARE command exiting
          # nonzero ends the script there -- no output, rc 1. The first cut of
          # this block ran the grep bare, so on a run whose suite PASSED the
          # grep found nothing, exited 1, and killed the step: task 1014 spent
          # 11.5 minutes on a green suite and reported `exit status 1` with an
          # empty log. The `|| echo` form this replaced was doing two jobs at
          # once -- it masked grep's error AND it kept -e from firing -- and
          # removing the mask took the guard with it.
          #
          # `|| frc=$?` DOES BOTH CORRECTLY: the grep sits in an AND-OR list, so
          # -e does not apply to it, and the rc still reaches the case below.
          view_broken=0
          frc=0
          # `-C` AND NOT `-A` OR `-B`, WHICH IS MEASURED (rook, coop r9/147).
          # This view printed the matching lines ALONE, so an arm's own
          # `t.Errorf` words never reached the log and a CI-only failure arrived
          # with no diagnostic -- twice. The first cut of the fix said `-A`, and
          # driven against real `go test -v` output `-A 3` captured NONE of
          # those words: go prints a test's diagnostic BEFORE its `--- FAIL`
          # line, not after.
          #
          # AND THIS PATTERN MATCHES TWO KINDS WITH OPPOSITE DIRECTIONS: a
          # `--- FAIL`'s words come before it, a `^panic:` trace comes after it.
          # One-sided context serves one of them, so both sides are taken.
          grep -nE -C 5 '^(--- )?FAIL|^panic:|^[[:space:]]+--- FAIL' ../test.log > ../fails.txt || frc=$?
          case "$frc" in
            # THE CAP RISES WITH THE CONTEXT: at 40 lines a -C 5 view holds
            # about three matches, and a suite failing in four packages would
            # have its fourth scroll off the thing built to show it. The whole
            # log is printed beneath on failure, so this stays a SUMMARY and
            # the cap is a courtesy rather than the only copy.
            0) sed -n '1,200p' ../fails.txt ;;
            1) echo "(no FAIL or panic line in test.log)" ;;
            *) echo "FAILURE VIEW BROKEN: the FAIL/panic grep exited $frc, so this log has NOT been searched and no verdict below rests on it"
               view_broken=1 ;;
          esac
          tail -20 ../test.log
          test "$rc" -eq 124 && {
            echo "HANG: go test exceeded 1800s. The CONSEQUENCE holds either way -- this is a finding against the test, not a red build -- but the premise does not: rc 124 proves only that 1800s elapsed, and a test taking 1801s terminates."
            # AND WHICH PACKAGES FINISHED, BY NAME AND WITH THEIR OWN ELAPSED.
            # This branch has said "read test.log for which package started
            # last" since it was written and never printed it -- and test.log
            # lives in the runner's workspace, so it is gone with the job and
            # the one reader who could answer never had it. The cost is
            # measured rather than supposed: a timeout has now been diagnosed
            # TWICE by reading a GREEN run's log on the box for per-package
            # figures, because the RED one carries a tail of whichever package
            # finished last and nothing else.
            #
            # THE HUNG PACKAGE IS THE DIFFERENCE, which is why the total is
            # printed beside the list: `go test ./...` reports a package when it
            # finishes, so the ones missing from this list are the ones still
            # running when the budget expired.
            # `?` IS A REPORT TOO, and leaving it out made this instrument lie a
            # THIRD time in one day. A package with no test files prints
            # `?  <pkg>  [no test files]` and can never appear in an ok/FAIL
            # list -- while `go list ./...` counts it -- so the figure read
            # "41 of 42, the rest were still running" on a run where EVERY
            # testable package had reported and nothing was running at all.
            # internal/vocabulary is that package today.
            #
            # THE NUMERATOR AND THE DENOMINATOR MUST COUNT THE SAME SET. That is
            # the same defect ratchet caught here at coop r8/162 (the list said
            # `^(ok|FAIL)` and the count said `^ok`), now on the other side of
            # the fraction: the denominator was every package and the numerator
            # only the ones that run tests.
            echo "--- reported, with each package's own elapsed:"
            grep -aE '^(ok|FAIL|\?)[[:space:]]+forge\.axonibyte\.com/' ../test.log || echo "(none reported)"
            # THE COUNT MATCHES THE LIST, and it did not for one commit: the
            # list is `^(ok|FAIL)` and the count was `^ok`, so a FAILED package
            # was printed as completed and left out of the figure -- making
            # "the rest were still running" name a package that had finished.
            # Reachable on exactly this path (ratchet, coop r8/162): `go test
            # ./...` reports each package as it finishes, so a FAIL lands while
            # others run and the budget expires after it. rc 124 with a FAIL in
            # the log is the ordinary shape of a slow suite with one broken
            # package, which is the case the diagnostic most needs to be right
            # about. A package that FAILED is still a package that REPORTED.
            echo "--- $(grep -acE '^(ok|FAIL|\?)[[:space:]]+forge\.axonibyte\.com/' ../test.log) of $(timeout 60 "$GO" list ./... | wc -l | tr -d ' ') package(s) reported; a difference here is a package still running, and NONE means the work finished and the run did not exit"
            exit 124
          }
          # THE WHOLE LOG GOES INTO THE JOB LOG ON FAILURE (fable, coop
          # r9/146), because ../test.log dies with the runner's workspace and
          # the job log is the one place that outlives it WITHOUT a runner
          # feature nobody here has measured. actions/upload-artifact is
          # declined until `node --version` on the runner is measured -- it is
          # a JavaScript action, the same class this file refuses for
          # actions/checkout at the top.
          #
          # PRINTING AND SURVIVING ARE DIFFERENT HALVES: the mined view above
          # fixes what a reader SEES FIRST, and this fixes what is still there
          # tomorrow. A failure that cost its own words twice is why both are
          # here rather than either.
          test "$rc" -eq 0 || {
            echo "go test exited $rc"
            # NO COMMAND SUBSTITUTION AND A GUARDED cat, because this is the
            # FAILURE path: a printer that can itself fail is worst placed
            # exactly where the only remaining evidence is being printed. A
            # line count would have been nice and is not worth a `wc` that can
            # exit nonzero here.
            echo "--- WHOLE test.log BELOW: the view above is mined, this is the copy ---"
            cat ../test.log || echo "(test.log could not be read, so the view above is all there is)"
            exit "$rc"
          }
          # AND A GREEN RUN WHOSE FAILURE VIEW WAS BROKEN IS NOT GREEN. The
          # branches above exit on their own rc, so this reaches only a run that
          # passed -- where an unsearched log is the one case nothing else would
          # ever report.
          test "$view_broken" -eq 0 || { echo "the failure view did not run, so this pass is unverified"; exit 1; }
          # and a value only execution produces: the harness's own per-package
          # verdict. `go test` prints `ok <pkg> <elapsed>` for each package that
          # ran, so its absence means no package ran at all -- which is what a
          # build-only success looks like.
          grep -E '^ok[[:space:]]+forge\.axonibyte\.com/' ../test.log \
            || { echo "no ok-package line: the harness did not run any package"; exit 1; }
          # A `(cached)` LINE IS THE ORACLE FOR THE FLAG ABOVE, and the reason
          # this is a refusal rather than a filter: with -count=1 the cache is
          # bypassed, so a cached verdict means the flag did not take -- a
          # future edit dropping it, a wrapper re-adding GOFLAGS, a toolchain
          # that ignores it. Merely subtracting them from the count would hide
          # exactly that. The comment above claims an absent ok-line means no
          # package ran; `ok <pkg> (cached)` is a present ok-line for a package
          # that did not run, which is the claim it falsifies.
          if grep -qE '^ok[[:space:]]+forge\.axonibyte\.com/.*\(cached\)' ../test.log; then
            echo "CACHED VERDICT with -count=1 set, so the flag did not take:"
            grep -nE '^ok[[:space:]]+forge\.axonibyte\.com/.*\(cached\)' ../test.log
            echo "a cached pass is not a run, and this step's PROOF counts runs"
            exit 1
          fi
          echo "PROOF $(grep -cE '^ok[[:space:]]+forge\.axonibyte\.com/' ../test.log) package(s) reported ok, 0 cached"

      - name: the suite's own PROOF lines (mined, not tailed)
        run: |
          set -o pipefail
          # WHAT THIS EXISTS FOR. 111 sites in this tree call `t.Logf("PROOF ...`
          # to say what an arm actually drove -- which seed, which profile, how
          # many steps, which finding. Every one of them was invisible to this
          # job: `go test` drops a passing test's log output without -v, and the
          # test step echoed `tail -20`, which under -v is the last package's
          # verbose spam rather than anybody's evidence. So the suite's own
          # statements of what it proved reached no reader, while this file's
          # SHELL echoes of the word PROOF always did -- two producers of one
          # looking line, and the loud one masking the silent one (rook, coop
          # rumor/1117; ratchet, rumor/1123).
          #
          # THREE CONDITIONS AND THEY ARE AND, not or (fable, coop rumor/1124):
          # -v puts the lines in the file, this step mines them out of it, and a
          # count of ZERO REFUSES. Without the third, a step that finds nothing
          # prints nothing and reads exactly like a step that found everything,
          # which is the tail -20 one layer out.
          test -f test.log || { echo "no test.log: the test step did not run, so there is nothing to mine"; exit 1; }
          n=$(grep -c 'PROOF ' test.log) || n=0
          if test "$n" -eq 0; then
            echo "NO PROOF LINE IN test.log, and this step refuses rather than passing quietly."
            echo "The suite has 111 Logf(\"PROOF sites; zero reaching the log means either -v"
            echo "was dropped from the test step above, or the lines were renamed. Either way"
            echo "the evidence a reader would act on is not in this job's output."
            exit 1
          fi
          echo "PROOF $n test-side PROOF line(s) mined from test.log:"
          grep -n 'PROOF ' test.log

      - name: fmt
        run: |
          set -o pipefail
          cd src-tree
          FMT=""
          for c in gofmt gofmt127 gofmt126 gofmt125; do
            command -v "$c" >/dev/null 2>&1 && { FMT="$c"; break; }
          done
          test -n "$FMT" || { echo "no gofmt, gofmt127, gofmt126 or gofmt125 on PATH: PROVISIONING finding"; exit 1; }
          # gofmt -l LISTS unformatted files and exits 0 either way, so the
          # status cannot be the gate -- the output is. This is the one step
          # whose verdict is a count rather than an rc, and that is why it is
          # written out instead of trusting `test "$rc" -eq 0`.
          rc=0
          timeout 120 "$FMT" -l . > ../fmt.log 2>&1 || rc=$?
          cat ../fmt.log
          test "$rc" -eq 124 && { echo "HANG: gofmt exceeded 120s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "gofmt exited $rc, which is a tool failure and not an unformatted tree"; exit "$rc"; }
          test ! -s ../fmt.log || { echo "gofmt lists the files above as unformatted"; exit 1; }
          echo "PROOF fmt checked with $(timeout 60 "$FMT" --help 2>&1 | head -1 || true); zero files listed"

      - name: vet
        run: |
          set -o pipefail
          cd src-tree
          GO=""
          for c in go go127 go126 go125; do
            command -v "$c" >/dev/null 2>&1 && { GO="$c"; break; }
          done
          test -n "$GO" || { echo "no go, go127, go126 or go125 on PATH: PROVISIONING finding"; exit 1; }
          # See the build step for why this is a gate and not a preference.
