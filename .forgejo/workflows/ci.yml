          timeout 300 "$GO" vet ./... > ../vet.log 2>&1 || rc=$?
          tail -30 ../vet.log
          test "$rc" -eq 124 && { echo "HANG: go vet exceeded 300s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "go vet exited $rc: a check fired, named above"; exit "$rc"; }
          echo "PROOF vet ran under $(timeout 30 "$GO" version)"

      - name: docs coverage
        run: |
          set -o pipefail
          cd src-tree
          GO=""
          for c in go go127 go126 go125; do
            command -v "$c" >/dev/null 2>&1 && { GO="$c"; break; }
          done
          test -n "$GO" || { echo "no go, go127, go126 or go125 on PATH: PROVISIONING finding"; exit 1; }
          # See the build step for why this is a gate and not a preference.
          export GOTOOLCHAIN=local
          rc=0
          timeout 300 "$GO" run ./cmd/rumor docs --check > ../docs.log 2>&1 || rc=$?
          cat ../docs.log
          test "$rc" -eq 124 && { echo "HANG: docs --check exceeded 300s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "docs --check exited $rc: an unmapped path, named above"; exit "$rc"; }
          # a count only the check itself can compute
          grep -qE '[0-9]+ path\(s\), every one mapped' ../docs.log \
            || { echo "no coverage count: the check did not run"; exit 1; }
          echo "PROOF $(grep -oE '[0-9]+ path\(s\), every one mapped' ../docs.log | head -1 || true)"

      - name: validate's arm accounting (the literal, with the adapter reachable)
        run: |
          set -o pipefail
          cd src-tree
          GO=""
          for c in go go127 go126 go125; do
            command -v "$c" >/dev/null 2>&1 && { GO="$c"; break; }
          done
          test -n "$GO" || { echo "no go, go127, go126 or go125 on PATH: PROVISIONING finding"; exit 1; }
          # See the build step for why this is a gate and not a preference.
          export GOTOOLCHAIN=local
          # THE BINARY HAS TO BE CALLED `rumor` HERE. The build step writes
          # ../rumor-bin, outside the clone and under that name on purpose, but
          # examples/twin's [adapter].command is ["rumor", "fake-adapter", ...]
          # -- what a real project writes -- so five arms need a `rumor` to
          # spawn. A link under the right name in a scratch dir on PATH is how
          # tests/validate's TestMain does it too.
          bindir="$RUNNER_TEMP/validate-bin"
          mkdir -p "$bindir"
          cp ../rumor-bin "$bindir/rumor" || { echo "no rumor-bin to link: the build step did not run"; exit 1; }
          rc=0
          PATH="$bindir:$PATH" timeout 300 ./../rumor-bin validate examples/twin > ../validate.log 2>&1 || rc=$?
          cat ../validate.log
          test "$rc" -eq 124 && { echo "HANG: validate exceeded 300s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "validate exited $rc on the permitted twin, which must PASS: an arm fired, or a declaration could not be read"; exit "$rc"; }
          # THE LITERAL. fable ruled the count at coop breakout-r4/6 and the
          # reading at r4/77: every run accounts for EVERY arm, each evaluated
          # or skipped with its reason, and the twin -- which D9 requires to pass
          # with NONE skipped -- evaluates them all. The number is deliberately
          # not restated in this comment: the grep below is the one copy of it
          # that lives outside Go, and a comment repeating it is a second copy
          # with no oracle (R9.1, rook coop r9/20). This
          # line moves only with a count posted in the live phase thread first
          # (r4/6's rule, honored in R6.2 at r6/28 with r4 closed), together
          # with internal/validate.TotalArms and docs/testing-methodology.md.
          #
          # AND IT IS NO LONGER UNWATCHED. This grep is the one copy of the
          # count that lives outside Go, and the R6.2 bump moved every other
          # copy while leaving it: `go test ./...`, vet, gofmt and golangci-lint
          # were all green on a commit that failed HERE, at the last step, with
          # a message that reads like a dropped arm. tests/validate's
          # TestTheWorkflowsArmCountIsTotalArms reads this file now, so the next
          # bump fails locally in a second instead of in CI in six minutes.
          grep -q '25 of 25 arm(s) evaluated' ../validate.log \
            || { echo "the twin did not report 25 of 25 arms evaluated: an arm was added or removed without this literal, or an arm skipped where D9 requires none"; exit 1; }
          grep -q '0 refusal(s)' ../validate.log \
            || { echo "the twin was refused, and the permitted twin is the one project that must pass"; exit 1; }
          grep -q 'skipped' ../validate.log \
            && { echo "an arm skipped on the twin: D9 requires every arm evaluated and none skipped"; exit 1; }
          echo "PROOF $(grep -oE '[0-9]+ of [0-9]+ arm\(s\) evaluated' ../validate.log | sed -n 1p)"
          # AND THE TOY, WHICH IS A PROJECT WITH A REAL PROCESS BEHIND IT (R5.2,
          # issue 73). examples/toy's [adapter].command is ["toy-adapter"], and
          # that adapter starts cmd/toy itself, so this is the only arm that
          # proves the pair works end to end on the runner: the twin's adapter
          # answers from a recorded surface, the toy's answers by driving an
          # application over HTTP.
          #
          # BOTH BINARIES GO ON PATH UNDER THEIR OWN NAMES, for the reason the
          # rumor link above exists: the project names them as a real project
          # would, and a run that found neither would report could-not-run on
          # five arms and still account for every one of them.
          timeout 300 "$GO" build -o "$bindir/toy" ./cmd/toy || { echo "cmd/toy did not build"; exit 1; }
          timeout 300 "$GO" build -o "$bindir/toy-adapter" ./cmd/toy-adapter || { echo "cmd/toy-adapter did not build"; exit 1; }
          rc=0
          PATH="$bindir:$PATH" timeout 300 ./../rumor-bin validate examples/toy > ../validate-toy.log 2>&1 || rc=$?
          cat ../validate-toy.log
          test "$rc" -eq 124 && { echo "HANG: validate on the toy exceeded 300s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "validate exited $rc on the toy, which issue 73 requires to pass"; exit "$rc"; }
          grep -q '25 of 25 arm(s) evaluated' ../validate-toy.log \
            || { echo "the toy did not report 25 of 25 arms evaluated"; exit 1; }
          grep -q '0 refusal(s)' ../validate-toy.log \
            || { echo "the toy was refused, and issue 73 requires it to validate"; exit 1; }
          grep -q 'skipped' ../validate-toy.log \
            && { echo "an arm skipped on the toy: it declares a browser stage and a direct observation so that none has to"; exit 1; }
          echo "PROOF the toy $(grep -oE '[0-9]+ of [0-9]+ arm\(s\) evaluated' ../validate-toy.log | sed -n 1p), adapter and application both spawned"

      - name: go.mod is ACCURATE, not merely present
        run: |
          set -o pipefail
          cd src-tree
          GO=""
          for c in go go127 go126 go125; do
            command -v "$c" >/dev/null 2>&1 && { GO="$c"; break; }
          done
          test -n "$GO" || { echo "no go, go127, go126 or go125 on PATH: PROVISIONING finding"; exit 1; }
          # See the build step for why this is a gate and not a preference.
          export GOTOOLCHAIN=local
          # THE GATE ASSERTED go.mod EXISTS AND NEVER THAT IT WAS RIGHT. The
          # fetch step's `test -f go.mod` is a wrong-tree guard and reads none
          # of the file's content, so through every release to v0.1.19 an
          # unused require, a missing one, or a go.sum short an entry could
          # travel to a tag with nothing to say so (ibis, thread:rumor).
          #
          # THE DIFF IS ON STDOUT AND THE EXCUSE IS ON STDERR, which is why
          # they are captured apart: tidy exits non-zero BOTH for "these files
          # are not what tidying would write" and for "I could not read the
          # module graph", and it needs the network to answer at all -- it
          # resolves the test-only dependencies of dependencies, 32 modules on
          # a cold cache, measured. The READING is
          # tools/gomod-accuracy-verdict.sh's, with its own battery in the
          # verdict-scripts step below, because a classification written inline
          # here is one a push is the only way to exercise.
          rc=0
          timeout 300 "$GO" mod tidy -diff > ../tidy.diff 2> ../tidy.err || rc=$?
          v=0
          timeout 60 sh tools/gomod-accuracy-verdict.sh ../tidy.diff ../tidy.err "$rc" go.sum || v=$?
          # The verdict's own codes travel out of this step: 3 a verdict on the
          # tree, 2 a defect in this step or in our reading of the tool, 1 no
          # answer reached. The clause and its reason are on stdout above.
          test "$v" -eq 0 || { echo "the manifest arm answered $v, named by the clause above"; exit "$v"; }
          echo "PROOF go.mod and go.sum are tidy, by the clause above"

      - name: golangci-lint
        run: |
          set -o pipefail
          cd src-tree
          GO=""
          for c in go go127 go126 go125; do
            command -v "$c" >/dev/null 2>&1 && { GO="$c"; break; }
          done
          test -n "$GO" || { echo "no go, go127, go126 or go125 on PATH: PROVISIONING finding"; exit 1; }
          # See the build step for why this is a gate and not a preference.
          export GOTOOLCHAIN=local
          # PINNED, and the pin is MEASURED: v2.14.0 is what proxy.golang.org
          # reported as latest for github.com/golangci/golangci-lint/v2 on
          # 2026-10-14 (published 2026-09-24). An unpinned @latest is a gate
          # whose verdict can change with no commit here saying so -- ratchet
          # r0.2/4's drift guard, which the Rust file learned the hard way.
          # `go env` is local and instant, and bounded anyway: "it is instant in
          # practice" is the exact reasoning this file records as the cause of a
          # 17-minute run, and the bounds checker now reads a $VAR command as an
          # invocation, so an unbounded one here is a finding rather than a habit.
          GOBIN_DIR="$(timeout 30 "$GO" env GOPATH)/bin"
          BIN="$GOBIN_DIR/golangci-lint"
          command -v golangci-lint >/dev/null 2>&1 && BIN="$(command -v golangci-lint)"
          test -x "$BIN" || {
                 # THE PRE-CHECK TAKES THE CAUSAL CLAIM OUT OF THE TIMEOUT (ibis
                 # r0.2/36). A bounded install that returns 124 proves only that
                 # the bound elapsed; a 60 s module lookup fails in its OWN words
                 # when there is no route, so by the time the wrapper can fire,
                 # no-route is excluded and "too slow" is the only reading left.
                 rc=0
                 timeout 60 "$GO" list -m github.com/golangci/golangci-lint/v2@v2.14.0 > ../lintidx.log 2>&1 || rc=$?
                 tail -3 ../lintidx.log
                 test "$rc" -eq 124 && { echo "the module proxy did not answer in 60s. That is the bound, not a diagnosis. The install was never attempted"; exit 1; }
                 test "$rc" -eq 0 || { echo "go list -m exited $rc: the proxy is unreachable or refused the pin, and the install was never attempted"; exit 1; }
                 echo "PROOF the proxy answered for the pin in under 60s, so a slow install can only mean slow"
                 rc=0
                 timeout 900 "$GO" install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 > ../lintinst.log 2>&1 || rc=$?
                 tail -20 ../lintinst.log
                 test "$rc" -eq 124 && { echo "HANG: go install golangci-lint exceeded 900s. The proxy answered above, so this is NOT no-route. RUNNER finding, and it blocks the lint gate rather than failing it."; exit 124; }
                 test "$rc" -eq 0 || { echo "go install golangci-lint exited $rc"; exit "$rc"; } }
          test -x "$BIN" || { echo "golangci-lint still absent at $BIN after install"; exit 1; }
          # ASSERT the version, do not merely print it. The literal is duplicated
          # from the install line ON PURPOSE: reading it out of a shared variable
          # would make this agree with itself whatever got installed.
          v="$(timeout 60 "$BIN" --version 2>&1 | sed -n 1p)"
          echo "$v"
          case "$v" in
            *2.14.0*) : ;;
            *) echo "golangci-lint is not the pinned 2.14.0: $v. A provisioned copy at the wrong version is a provisioning finding, not something to install over"; exit 1 ;;
          esac
          rc=0
          # BOTH CAPS OFF, because a capped count reads as a complete one.
          # golangci-lint defaults `issues.max-same-issues` to 3 and
          # `issues.max-issues-per-linter` to 50 (`pkg/commands/flagsets.go`
          # lines 118 and 120 in v2.14.0), and max-same-issues caps on the
          # issue TEXT (`pkg/result/processors/max_same_issues.go`, keyed on
          # `issue.Text`) -- so N identical findings are REPORTED as 3 and the
          # remainder goes to `Infof`, which this step's `tail -30` cannot
          # reach. MEASURED on f9ba5c9 with this same 2.14.0 binary: the
          # default run prints `3 issues: errcheck: 3` and the same tree with
          # these flags prints `4 issues: errcheck: 4`, the fourth being
          # internal/attaint/attaint.go:517. Task 231 failed on the capped
          # three; fixing exactly those would have failed task 232 on the
          # fourth. The cap moves the list and the summary together, so nothing
          # inside that output disagrees with anything and a reader cannot tell
          # a cap from a count -- wren, thread:rumor/607. tools/check-workflows.py
          # pins both flags here.
          timeout 900 "$BIN" run --max-same-issues=0 --max-issues-per-linter=0 ./... > ../lint.log 2>&1 || rc=$?
          tail -30 ../lint.log
          test "$rc" -eq 124 && { echo "HANG: golangci-lint exceeded 900s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "golangci-lint exited $rc: a linter fired, named above"; exit "$rc"; }
          echo "PROOF lint ran with $v"

      - name: the verdict scripts' own batteries
        run: |
          set -o pipefail
          cd src-tree
          # A BATTERY THAT NEVER RUNS IN CI IS A BATTERY THAT CAN ROT. Two
          # steps in this project delegate a classification to a script
          # precisely because a workflow step cannot be driven without pushing;
          # the scripts carry their own cases, and this is where those cases are
          # exercised on the runner rather than only on an author's machine.
          rc=0
          timeout 120 sh tools/govulncheck-verdict.sh --self-test > ../gv-self.log 2>&1 || rc=$?
          cat ../gv-self.log
          test "$rc" -eq 124 && { echo "HANG: the govulncheck verdict's self-test exceeded 120s. RUNNER finding; the verdict was NOT checked."; exit 124; }
          test "$rc" -eq 0 || { echo "the govulncheck verdict's own self-test FAILED, so its reading of any scan below means nothing"; exit "$rc"; }
          # THE DECLARED COUNT, not just a zero exit: a clause removed along
          # with its case would leave this green. 9 clauses over 10 cases --
          # two cases reach `vulnerabilities-found`, one for a standard-library
          # entry and one for a module entry.
          grep -qE 'all 9 clauses answered as expected over 10 case\(s\)' ../gv-self.log \
            || { echo "the self-test did not report all 9 clauses over 10 cases: a clause stopped being reached, or the script's clauses changed without this literal"; exit 1; }
          rc=0
          timeout 120 sh tools/gomod-accuracy-verdict.sh --self-test > ../gm-self.log 2>&1 || rc=$?
          cat ../gm-self.log
          test "$rc" -eq 124 && { echo "HANG: the manifest verdict's self-test exceeded 120s. RUNNER finding; the verdict was NOT checked."; exit 124; }
          test "$rc" -eq 0 || { echo "the manifest verdict's own self-test FAILED, so its reading of go mod tidy -diff means nothing"; exit "$rc"; }
          # THE DECLARED COUNT, as above. 9 clauses over 10 cases -- two cases
          # reach `nothing-to-be-accurate-about`, for an empty go.sum and an
          # absent one. That it is the same 9-over-10 as the govulncheck
          # verdict is a coincidence and not a copied line: the counts are
          # grepped out of two different logs, named here so a reader does not
          # read one literal as serving both.
          grep -qE 'all 9 clauses answered as expected over 10 case\(s\)' ../gm-self.log \
            || { echo "the self-test did not report all 9 clauses over 10 cases: a clause stopped being reached, or the script's clauses changed without this literal"; exit 1; }
          rc=0
          timeout 120 sh tools/verify-tag-verdict.sh --self-test > ../vt-self.log 2>&1 || rc=$?
          cat ../vt-self.log
          test "$rc" -eq 124 && { echo "HANG: the tag verdict's self-test exceeded 120s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "the tag verdict's own self-test FAILED, so the tag pipeline's reading of git verify-tag means nothing"; exit "$rc"; }
          # NO DECLARED COUNT FOR THIS ONE, and the reason is stated rather
          # than left as an inconsistency: tools/verify-tag-verdict.sh belongs
          # to the tag pipeline (issue 39), and pinning its case count here
          # would make this file fail on a deliberate change to that script in
          # a run that does not touch this file. Its own PROOF line carries the
          # count, and it is printed above.
          echo "PROOF all three verdict scripts' batteries ran on this runner"

      - name: govulncheck
        run: |
          set -o pipefail
          cd src-tree
          GO=""
          for c in go go127 go126 go125; do
            command -v "$c" >/dev/null 2>&1 && { GO="$c"; break; }
          done
          test -n "$GO" || { echo "no go, go127, go126 or go125 on PATH: PROVISIONING finding"; exit 1; }
          # See the build step for why this is a gate and not a preference.
          export GOTOOLCHAIN=local
          # PINNED AND MEASURED, same reasoning: golang.org/x/vuln v1.9.0 is what
          # the proxy reported as latest on 2026-10-14 (published 2026-10-11).
          # `go env` is local and instant, and bounded anyway: "it is instant in
          # practice" is the exact reasoning this file records as the cause of a
          # 17-minute run, and the bounds checker now reads a $VAR command as an
          # invocation, so an unbounded one here is a finding rather than a habit.
          # A CACHED TOOL BINARY IS ONLY VALID FOR THE TOOLCHAIN THAT BUILT
          # IT, and this step used to reuse whatever it found. MEASURED on the
          # ci jail 2026-11-12 while moving it to go127: the govulncheck left
          # behind by the go1.26 runs cannot analyse go1.27 sources and says so
          # for every package -- "This application uses version go1.26 of the
          # source-processing packages but runs version go1.27 of `go list`" --
          # an ANALYSIS failure in the shape of a clean scan. So the install
          # directory is keyed BY TOOLCHAIN, which makes a stale binary a
          # different path rather than a wrong answer, and a govulncheck found
          # on PATH is accepted only if its own build toolchain matches. Nothing
          # is deleted: a provisioned binary belongs to whoever provisioned it.
          GOVER="$(timeout 30 "$GO" version | awk '{print $3}')"
          GOBIN_DIR="$(timeout 30 "$GO" env GOPATH)/bin/$GOVER"
          BIN="$GOBIN_DIR/govulncheck"
          if command -v govulncheck >/dev/null 2>&1; then
            FOUND="$(command -v govulncheck)"
            BUILT="$(timeout 30 "$GO" version "$FOUND" 2>/dev/null | awk '{print $NF}')"
            if test "$BUILT" = "$GOVER"; then
              BIN="$FOUND"
              echo "PROOF reusing $FOUND, built by $BUILT, which is this step's $GOVER"
            else
              echo "PROOF ignoring $FOUND: built by ${BUILT:-an unreadable toolchain}, this step resolved $GOVER"
            fi
          fi
          test -x "$BIN" || {
                 rc=0
                 timeout 60 "$GO" list -m golang.org/x/vuln@v1.9.0 > ../vulnidx.log 2>&1 || rc=$?
                 tail -3 ../vulnidx.log
                 test "$rc" -eq 124 && { echo "the module proxy did not answer in 60s. That is the bound, not a diagnosis. The install was never attempted"; exit 1; }
                 test "$rc" -eq 0 || { echo "go list -m exited $rc: the proxy is unreachable or refused the pin, and the install was never attempted"; exit 1; }
                 echo "PROOF the proxy answered for the pin in under 60s"
                 rc=0
                 GOBIN="$GOBIN_DIR" timeout 900 "$GO" install golang.org/x/vuln/cmd/govulncheck@v1.9.0 > ../vulninst.log 2>&1 || rc=$?
                 tail -20 ../vulninst.log
                 test "$rc" -eq 124 && { echo "HANG: go install govulncheck exceeded 900s. The proxy answered above, so NOT no-route. RUNNER finding."; exit 124; }
                 test "$rc" -eq 0 || { echo "go install govulncheck exited $rc"; exit "$rc"; } }
          test -x "$BIN" || { echo "govulncheck still absent at $BIN after install"; exit 1; }
          # govulncheck READS A DATABASE OVER THE NETWORK, which makes it the one
          # gate here whose verdict depends on a third party being up. That is why
          # its failure is read apart from the others: an unreachable vuln.go.dev
          # is a RUNNER/route finding, not a vulnerable tree.
          #
          # THE VERDICT COMES FROM tools/govulncheck-verdict.sh, one
          # implementation with a battery over the strings this project has
          # really seen -- including run 192's. The classification used to be
          # inline here and said the OPPOSITE of what rc 3 means: govulncheck's
          # own source sets errVulnerabilitiesFound to code 3 (x/vuln v1.9.0,
          # internal/scan/errors.go) and its doc.go says so in prose, while this
          # step announced "it could not load the vulnerability database. Route
          # finding, not a vulnerable tree". Run 192's log carries both lines
          # four apart: "Your code is affected by 9 vulnerabilities from the Go
          # standard library", then the route claim. The job failed either way,
          # so the defect was the DIAGNOSIS, which is the worse kind -- the
          # reason is what gets acted on, and this one sent a reader to the
          # network instead of to nine CVEs. A step is only exercised by
          # pushing, so the logic lives where it can be driven.
          rc=0
          timeout 900 "$BIN" ./... > ../vuln.log 2>&1 || rc=$?
          tail -30 ../vuln.log
          test "$rc" -eq 124 && { echo "HANG: govulncheck exceeded 900s. RUNNER finding; it blocks the vulnerability gate rather than failing it."; exit 124; }
          vrc=0
          timeout 60 sh tools/govulncheck-verdict.sh ../vuln.log "$rc" || vrc=$?
          case "$vrc" in
            0) echo "PROOF the scan ran and this tree's code reaches nothing the database knows about" ;;
            3) echo "REFUSED: a vulnerability this tree's own code reaches, named above. A Standard library entry is the runner's toolchain and a Module entry is a bump"; exit 3 ;;
            2) echo "STEP DEFECT: govulncheck refused this step's invocation, which is not a finding about the tree"; exit 2 ;;
            *) echo "BLOCKED: the vulnerability gate did not reach a verdict, for the clause named above. Not a pass"; exit 1 ;;
          esac
          # The summary-line check that used to sit here is now the verdict
          # script's `clean` clause, which refuses rc 0 with no summary of its
          # own: one rule in one place, since two implementations of it are how
          # they drift apart.
          echo "PROOF scan ran with $(timeout 60 "$BIN" -version 2>&1 | head -2 | tr '\n' ' ' || true)"

      - name: licences (the built surface, against R0.2's allowlist)
        run: |
          set -o pipefail
          cd src-tree
          GO=""
          for c in go go127 go126 go125; do
            command -v "$c" >/dev/null 2>&1 && { GO="$c"; break; }
          done
          test -n "$GO" || { echo "no go, go127, go126 or go125 on PATH: PROVISIONING finding"; exit 1; }
          # See the build step for why this is a gate and not a preference.
          export GOTOOLCHAIN=local
          # THIS STEP REPLACED A TRIPWIRE, AND THE TRIPWIRE DID ITS JOB. Until
          # G3 this asserted the module graph held exactly ONE module, because a
          # zero-dependency tree has no licence surface and a ported deny.toml
          # would have read green with nothing to judge. OPA is the first real
          # dependency and broke that assertion by design, which is what it was
          # for (rook rumor/499).
          #
          # The gate is now tests/licences, a Go TEST rather than a tool: it is
          # already inside `go test ./...`, so gating licences adds no new
          # dependency to this file. It is run again by name here so the surface
          # has its own row -- a verdict folded into another step's output is one
          # nobody reads -- and because `go test ./...` would report it as a
          # package name with no figure.
          #
          # The oracle is `go list -deps -test ./...`: what is actually built,
          # tests included. Not the module graph, which over-counts, and not
          # bare -deps, which is blind to a test-only import. go-port/4 and /5.
          rc=0
          timeout 600 "$GO" test ./tests/licences/ -v > ../lic.log 2>&1 || rc=$?
          grep -E 'PROOF|FAIL|---' ../lic.log | tail -20
          test "$rc" -eq 124 && { echo "HANG: the licence gate exceeded 600s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "the licence gate refused, named above"; exit "$rc"; }
          # a count only the gate itself computes
          grep -qE 'PROOF [0-9]+ of [0-9]+ built module\(s\) carry a licence inside' ../lic.log \
            || { echo "no licence count: the gate did not reach a verdict over the surface"; exit 1; }
          echo "PROOF $(grep -oE '[0-9]+ of [0-9]+ built module\(s\) carry a licence inside[^"]*' ../lic.log | sed -n 1p)"
          # THE ALLOWLIST PAIR IS ASSERTED, NOT MERELY PRINTED (ratchet,
          # thread:go-port/54). The -v above makes a SKIP visible in this log,
          # and visible is not asserted: the only assertion here was the count,
          # so TestTheAllowlistsAgree silently becoming a pass -- or a skip --
          # changed the log and failed nothing.
          #
          # THE REVIEW ASKED FOR THE SKIP TO BE ASSERTED BY NAME. That is now
          # the wrong assertion: with R0.2's ids enumerated in docs/design.md
          # the arm reads the document and no longer skips at all, so asserting
          # a skip would pin a state this repository can no longer reach. The
          # agreement is asserted instead, and ANY skip in this suite is a
          # finding -- a test that stops running is the thing both versions of
          # this check were worried about.
          grep -q 'PROOF the document and this file name the same 8 licence(s)' ../lic.log \
            || { echo "the allowlist pair did not agree, or TestTheAllowlistsAgree did not run: R0.2's ids live in docs/design.md and this suite carries its own copy, and the two must match"; exit 1; }
          echo "PROOF the allowlist pair agreed on 8 ids, document against test"
          if grep -q '^--- SKIP:' ../lic.log; then
            grep '^--- SKIP:' ../lic.log
            echo "a test in the licence suite SKIPPED. Every arm here is meant to run on every tree; a skip is a gap this step will not pass over."
            exit 1
          fi
          echo "PROOF no arm of the licence suite skipped"
