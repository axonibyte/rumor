# CI for the rumor workspace -- R0.2, issue 3.
#
# ONE JOB, FREEBSD ONLY. cal ruled 2026-10-10: "no linux runner, just freebsd
# for now." Linux is R0.2b and returns when a host exists. A second job whose
# label no runner answers would QUEUE FOREVER, and a queued job is not red --
# it reads as "no failure" rather than "never ran", which makes every green in
# this file ambiguous. One job that can run beats two where one cannot.
#
# `runs-on` binds to the runner's LABEL, not its name. cal renamed the runner
# forge-01_jail on 2026-10-10 (was forge-01-ci-jail) and ibis measured the label
# unchanged across the rename (r0.runners run #6, an 8 s probe reporting 8 s).
# Change this only if a registration changes the label.
#
# EVERY STEP PROVES IT RAN, which is the design decision in this file rather
# than the step list. A zero-elapsed success is what a FAST run and a PHANTOM
# run both look like (ibis, r0.runners/4, after it cost two pushes), so elapsed
# time cannot settle execution in either direction. Each step therefore emits a
# value only execution could have produced -- a version string, a count it
# computed, a name resolved out of Cargo.lock -- never a duration and never the
# absence of red. fable ruled that form at rumor/96.
#
# EVERY EXTERNAL CALL IS BOUNDED, AND A HANG IS A NAMED FINDING. Added after my
# own probe-pkg drove three unbounded `pkg` calls and ran 17+ minutes on
# 2026-10-10; this runner is SINGLE-CONCURRENCY, so that one hang head-of-line
# blocked three queued runs and every push anyone else would have made. The
# epic's rule -- "any task that drives an external process carries a timeout and
# writes a hang report; a hang is recorded as a finding, never waited out" --
# was already written and I had broken it in the probe AND here, in the file
# that actually matters. Two mechanisms, deliberately:
#
#   timeout-minutes      bounds the JOB whatever hangs, including something this
#                        file does not anticipate. It is a RUNNER feature and
#                        nobody here has observed act_runner honouring it (run
#                        logs are 404 to us), so it is the backstop, not the
#                        guarantee.
#   timeout(1) per call  plain POSIX, works whatever the runner implements, and
#                        is what the per-step bounds below actually rely on.
#
# rc 124 IS REPORTED SEPARATELY FROM A FAILURE at every step, because they are
# different findings: 124 says the tool never answered inside its bound, which
# is a statement about the RUNNER; any other non-zero says the tool answered and
# the answer was no, which is a statement about the CODE. Collapsing them is how
# a wedged runner gets filed as a broken build.
#
# `tools/check-workflow-bounds.py --self-test` refuses this file if any job or
# invocation loses its bound. It is python and LOCAL-ONLY on purpose: the runner
# cannot compile anything (probe-rustc fails on one file with no manifest), so a
# Rust gate could not run there, and adding a python dependency to CI would
# repeat the actions/checkout mistake of depending on an unmeasured interpreter.
# It becomes a `rumor` subcommand beside `docs --check` once that jail builds.
#
# STEP 1 IS A PROBE AND IS DELIBERATELY NON-FATAL. Nobody had measured what this
# runner carries; ibis's smoke test proved execution and left the toolchain to
# R0.2 "with its own evidence". If a later step dies for want of a tool, step 1
# has already named which. A red probe would tell us less than a green one that
# lists what is absent.
#
# NO actions/checkout. It is a JavaScript action and needs node ON THE RUNNER
# (ibis, r0.runners-smoke). If node is absent there, checkout fails for a reason
# that has nothing to do with the code under test. git is the narrower
# dependency and the repo is public, so an anonymous clone needs no credential
# on the runner -- no secret reaches CI from this file.

name: ci

on:
  push:
    branches:
      - r0.2-ci
  workflow_dispatch:

jobs:
  freebsd:
    runs-on: freebsd-15-jail
    # The backstop. Sized above the sum of the per-step bounds below so that a
    # step's own timeout fires FIRST and names which step hung; this one only
    # catches a hang somewhere the per-step bounds do not reach.
    timeout-minutes: 45
    steps:
      - name: probe the runner (non-fatal; names what is absent)
        run: |
          # pipefail: without it a pipeline reports its LAST stage's status, so a
          # failing gate piped to a formatter exits 0 and this step goes GREEN.
          # ratchet r0.2/12; driven locally -- a gate exiting 4 piped to `tail -5`
          # continues and exits 0, and exits 4 with this line present.
          set -o pipefail
          echo "uname   $(uname -a)"
          echo "whoami  $(whoami)"
          echo "cwd     $(pwd)"
          for t in git cargo rustc node curl; do
            p=$(command -v "$t" 2>/dev/null) && echo "$t  FOUND  $p" || echo "$t  ABSENT"
          done
          # bounded even here. A `--version` that cannot answer in 20 s is
          # itself the finding, and "it is instant in practice" is the exact
          # reasoning that produced the 17-minute run.
          timeout 20 cargo --version 2>/dev/null || echo "cargo: none or did not answer in 20s"
          timeout 20 rustc --version 2>/dev/null || echo "rustc: none or did not answer in 20s"
          timeout 20 git   --version 2>/dev/null || echo "git: none or did not answer in 20s"

      - name: fetch the tree with git, not a JS action
        run: |
          # pipefail: without it a pipeline reports its LAST stage's status, so a
          # failing gate piped to a formatter exits 0 and this step goes GREEN.
          # ratchet r0.2/12; driven locally -- a gate exiting 4 piped to `tail -5`
          # continues and exits 0, and exits 4 with this line present.
          set -o pipefail
          rm -rf src-tree
          rc=0
          timeout 180 git clone --quiet --depth 1 --branch "${GITHUB_REF_NAME:-r0.2-ci}" \
            https://forge.axonibyte.com/axonibyte/rumor.git src-tree || rc=$?
          test "$rc" -eq 124 && { echo "HANG: git clone exceeded 180s. The runner could not reach or finish reading the forge; this is a RUNNER finding, not a code failure."; exit 124; }
          test "$rc" -eq 0 || { echo "git clone exited $rc"; exit "$rc"; }
          cd src-tree
          echo "HEAD $(timeout 30 git rev-parse HEAD)"
          test -f Cargo.toml || { echo "no Cargo.toml: wrong tree"; exit 1; }

      - name: build
        run: |
          # pipefail: without it a pipeline reports its LAST stage's status, so a
          # failing gate piped to a formatter exits 0 and this step goes GREEN.
          # ratchet r0.2/12; driven locally -- a gate exiting 4 piped to `tail -5`
          # continues and exits 0, and exits 4 with this line present.
          set -o pipefail
          cd src-tree
          # NOT `cargo build | tail`: a pipeline's status is the LAST stage's, so
          # tail's success would mask a failing build -- the exact defect this
          # gate exists to catch, and the sixth instance of it in this room.
          # Redirect, then read the status, then format.
          rc=0
          timeout 900 cargo build --locked --all-targets > ../build.log 2>&1 || rc=$?
          tail -20 ../build.log
          test "$rc" -eq 124 && { echo "HANG: cargo build exceeded 900s -- most likely a registry fetch with no route out. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "cargo build exited $rc"; exit "$rc"; }
          test -x target/debug/rumor || { echo "no binary produced"; exit 1; }
          echo "PROOF built binary: $(timeout 30 ./target/debug/rumor 2>&1 | head -1 || true)"

      - name: test
        run: |
          # pipefail: without it a pipeline reports its LAST stage's status, so a
          # failing gate piped to a formatter exits 0 and this step goes GREEN.
          # ratchet r0.2/12; driven locally -- a gate exiting 4 piped to `tail -5`
          # continues and exits 0, and exits 4 with this line present.
          set -o pipefail
          cd src-tree
          # same reason as the build step: `| tee | tail` returns tail's status.
          rc=0
          timeout 900 cargo test --locked > ../test.log 2>&1 || rc=$?
          tail -20 ../test.log
          test "$rc" -eq 124 && { echo "HANG: cargo test exceeded 900s. A test that does not terminate is a finding against the test, not a red build."; exit 124; }
          test "$rc" -eq 0 || { echo "cargo test exited $rc"; exit "$rc"; }
          # and a value only execution produces: the harness's own pass count
          grep -E 'test result: ok\. [0-9]+ passed' ../test.log \
            || { echo "no test-result line: the harness did not run"; exit 1; }
          echo "PROOF $(grep -oE 'test result: ok\. [0-9]+ passed' ../test.log | head -1 || true)"

      - name: fmt
        run: |
          # pipefail: without it a pipeline reports its LAST stage's status, so a
          # failing gate piped to a formatter exits 0 and this step goes GREEN.
          # ratchet r0.2/12; driven locally -- a gate exiting 4 piped to `tail -5`
          # continues and exits 0, and exits 4 with this line present.
          set -o pipefail
          cd src-tree
          timeout 60 cargo fmt --version
          rc=0
          timeout 120 cargo fmt --all --check > ../fmt.log 2>&1 || rc=$?
          cat ../fmt.log
          test "$rc" -eq 124 && { echo "HANG: cargo fmt exceeded 120s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "cargo fmt --check exited $rc: the tree is not formatted, diff above"; exit "$rc"; }
          echo "PROOF fmt checked with $(timeout 60 cargo fmt --version)"

      - name: clippy
        run: |
          # pipefail: without it a pipeline reports its LAST stage's status, so a
          # failing gate piped to a formatter exits 0 and this step goes GREEN.
          # ratchet r0.2/12; driven locally -- a gate exiting 4 piped to `tail -5`
          # continues and exits 0, and exits 4 with this line present.
          set -o pipefail
          cd src-tree
          timeout 60 cargo clippy --version
          rc=0
          timeout 900 cargo clippy --locked --all-targets -- -D warnings > ../clippy.log 2>&1 || rc=$?
          tail -30 ../clippy.log
          test "$rc" -eq 124 && { echo "HANG: cargo clippy exceeded 900s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "cargo clippy exited $rc: a lint fired, named above"; exit "$rc"; }
          echo "PROOF clippy ran with $(timeout 60 cargo clippy --version)"

      - name: docs coverage
        run: |
          # pipefail: without it a pipeline reports its LAST stage's status, so a
          # failing gate piped to a formatter exits 0 and this step goes GREEN.
          # ratchet r0.2/12; driven locally -- a gate exiting 4 piped to `tail -5`
          # continues and exits 0, and exits 4 with this line present.
          set -o pipefail
          cd src-tree
          rc=0
          timeout 300 cargo run --locked -q -- docs --check > ../docs.log 2>&1 || rc=$?
          cat ../docs.log
          test "$rc" -eq 124 && { echo "HANG: docs --check exceeded 300s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "docs --check exited $rc: an unmapped path, named above"; exit "$rc"; }
          # a count only the check itself can compute
          grep -qE '[0-9]+ path\(s\), every one mapped' ../docs.log \
            || { echo "no coverage count: the check did not run"; exit 1; }
          echo "PROOF $(grep -oE '[0-9]+ path\(s\), every one mapped' ../docs.log | head -1 || true)"

      - name: deny (licences)
        run: |
          # pipefail: without it a pipeline reports its LAST stage's status, so a
          # failing gate piped to a formatter exits 0 and this step goes GREEN.
          # ratchet r0.2/12; driven locally -- a gate exiting 4 piped to `tail -5`
          # continues and exits 0, and exits 4 with this line present.
          set -o pipefail
          cd src-tree
          # pinned: an unpinned gate tool means the verdict can change with no commit.
          # No FreeBSD binary release exists, so absent a provisioned copy it builds.
          #
          # THE 900 s IS MEASURED AND ON THE WRONG MACHINE, which is the honest
          # statement of it. ratchet r0.2/18 timed a genuinely cold build -- empty
          # CARGO_HOME, empty --root, verified by the artefact rather than the
          # wrapper's exit code -- at 274 s including the index update and the
          # downloads. So 900 s is 3.28x cold with 626 s of margin. Their earlier
          # "5m08s warm" was in fact a CONTENDED COLD build, which is why cold came
          # out faster than their warm. But that is their jail's CPU and network,
          # not this runner's, so the bound still wants one validating run here,
          # read from the step's own elapsed output. No bigger bound: at 900 s a
          # genuine hang already costs a single-concurrency runner a quarter hour,
          # and that cost is the harm this file exists to bound, not the fix.
          #
          # IF THE JAIL PROVISIONS cargo-deny, `command -v` finds it and this
          # install never runs -- which is the better answer (fable rumor/105 asked
          # for 0.20.2 in the toolchain act) and needs no change here. A provisioned
          # copy at the WRONG version then fails loudly at the assertion below
          # rather than being silently overwritten by an install: a provisioning
          # mismatch is a finding, and quietly installing over it would hide which
          # of the two is wrong.
          command -v cargo-deny >/dev/null 2>&1 \
            || { rc=0
                 timeout 900 cargo install cargo-deny --locked --version 0.20.2 > ../install.log 2>&1 || rc=$?
                 tail -20 ../install.log
                 test "$rc" -eq 124 && { echo "HANG: cargo install cargo-deny exceeded 900s -- almost certainly no route to the registry. RUNNER finding, and it blocks the licence gate rather than failing it."; exit 124; }
                 test "$rc" -eq 0 || { echo "cargo install cargo-deny exited $rc"; exit "$rc"; } }
          # ASSERT the pinned version, do not merely print it. ratchet r0.2/4's
          # drift guard: a gate tool whose version can move is a gate whose
          # verdict can change with no commit, and I shipped this as a bare
          # `--version` that printed whatever was there and checked nothing.
          # The literal 0.20.2 is duplicated from the install line ON PURPOSE --
          # reading it out of a variable the install also used would make the
          # check agree with itself no matter what. The duplication IS the check:
          # move the pin without moving this and the step fails.
          rc=0
          timeout 60 cargo deny --version > ../denyver.log 2>&1 || rc=$?
          cat ../denyver.log
          test "$rc" -eq 124 && { echo "HANG: cargo deny --version exceeded 60s. A hung --version wedges the runner exactly as a hung install does (ratchet r0.2/10)."; exit 124; }
          test "$rc" -eq 0 || { echo "cargo deny --version exited $rc"; exit "$rc"; }
          grep -q '0\.20\.2' ../denyver.log \
            || { echo "cargo-deny is not the pinned 0.20.2: the licence verdict could change with no commit"; exit 1; }
          echo "PROOF cargo-deny $(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' ../denyver.log | head -1 || true) matches the pin"
          # NO -D. Default is green on an unused allowlist entry; under -D a
          # cosmetic warning and a real licence violation both return 4 and are
          # indistinguishable by exit status. 7 warnings are EXPECTED while the
          # workspace has no dependencies (ratchet, r0.2/0) and are not silenced.
          # redirect then read the status: exit 4 (a licence outside the allowlist)
          # and exit 1 (the config did not deserialize, so the gate never ran) are
          # opposite problems and a pipe would hide both behind tee's success.
          rc=0
          timeout 300 cargo deny check licenses > ../deny.log 2>&1 || rc=$?
          cat ../deny.log
          test "$rc" -eq 124 && { echo "HANG: cargo deny check exceeded 300s. RUNNER finding; the gate did NOT run."; exit 124; }
          test "$rc" -eq 1 && { echo "deny exited 1: deny.toml did not deserialize, the gate did NOT run"; exit 1; }
          test "$rc" -eq 0 || { echo "deny exited $rc: a licence is outside the allowlist, named above"; exit "$rc"; }
          grep -q 'licenses ok' ../deny.log \
            || { echo "no 'licenses ok' line: the gate did not run"; exit 1; }
          # the crate name AND its version DERIVED from the manifest, never a
          # literal: ratchet's example string carried 0.1.3 from their own branch
          # and would fail here at 0.1.0 and again at every bump.
          rc=0
          timeout 120 cargo metadata --no-deps --format-version 1 > ../meta.json 2>&1 || rc=$?
          test "$rc" -eq 124 && { echo "HANG: cargo metadata exceeded 120s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { tail -5 ../meta.json; echo "cargo metadata exited $rc"; exit "$rc"; }
          # LOCAL text extraction, not an external call, and deliberately
          # separated from it: `head -1` closing the pipe can SIGPIPE sed to 141,
          # and under pipefail that would abort a step that had in fact
          # succeeded. The pipeline is guarded and the real oracle is the
          # emptiness test below.
          VER=$(sed -n 's/.*"name":"rumor-cli","version":"\([^"]*\)".*/\1/p' ../meta.json | head -1 || true)
          test -n "$VER" || { echo "could not derive the crate version from cargo metadata"; exit 1; }
          rc=0
          timeout 120 cargo deny list > ../denylist.log 2>&1 || rc=$?
          test "$rc" -eq 124 && { echo "HANG: cargo deny list exceeded 120s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { cat ../denylist.log; echo "deny list exited $rc"; exit "$rc"; }
          grep -q "rumor-cli@${VER}" ../denylist.log \
            || { echo "deny list did not name rumor-cli@${VER}"; exit 1; }
          echo "PROOF deny resolved rumor-cli@${VER} from Cargo.lock"
