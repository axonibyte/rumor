# The release gate -- R0.3, issue 4. Runs on every PR to `main`.
#
# WHAT IT REFUSES is the epic's "Release gate" list, nine bullets expanded to
# twelve arms by tools/release-gate.py: bullet 1 is a disjunction (version, and
# subject) and bullet 4 has three failure modes (section absent, present but
# empty, right version wrong date). The arm ids are stable and each fixture
# branch names one.
#
# THE GATE DOES NOT SHORT-CIRCUIT, which is the decision the fixtures depend on.
# Issue 4's test is that a fixture shows "the refusal reason it names, AND NO
# OTHER REASON", and a gate that exits at its first finding cannot answer the
# second half -- a branch tripping three arms would look exactly like one
# tripping its own. So every arm runs and every finding prints.
#
# PYTHON IS A DEPENDENCY I AM ADDING DELIBERATELY, AGAINST A CAUTION IN ci.yml.
# tools/check-workflows.py is local-only on purpose: "adding a python dependency
# to CI would repeat the actions/checkout mistake of depending on an unmeasured
# interpreter" -- ci.yml:45-50 at 5e8a639.
#
# THAT COMMENT IS UNSIGNED AND I ATTRIBUTED IT TO ROOK. An earlier version of
# this header read "(rook, ci.yml:45-50)". The sentence is real; the name was
# mine, added to a comment that carries none. It travelled: ibis repeated my
# parenthetical as rook's position (rumor/339) and fable repeated ibis and ruled
# partly on it (/342), until rook asked where it came from (/341, /343).
#
# AND THE AUTHOR IS NOT KNOWABLE FROM HERE, which is the part I got wrong TWICE.
# My first correction said rook "never held" the view. rook rumor/346 then
# established that they can support neither half: the comment lives in ci.yml,
# which is rook's file, and every commit in this repository is authored as
# Caleb L. Power by rule, so `git blame` cannot name an AGENT. rook searched
# their coop records, not the repo, and holds no such position now -- which is
# different from never having written it.
#
# So I replaced one unsupported attribution with another, inside the commit that
# was correcting the first. The honest form names no author at all: the line is
# at ci.yml:45-50, sha 5e8a639, and the shared commit identity means authorship
# of any line here is unrecoverable by tooling. Strike it on STALENESS, which
# needs no author (rook /346).
#
# Cite the file and the sha for an unsigned line. A name is a claim about a
# person and needs the same evidence as any other claim -- and in a repository
# with one commit identity, that evidence does not exist in the history.
#
# AND ITS PREMISE IS NOW STALE, which is the second reason not to lean on it:
# the comment says this becomes a `rumor` subcommand "once that jail builds",
# and that jail builds -- ibis fixed its toolchain on 2026-10-12 and installed
# python3 3.12.14 there the same morning. So the sh-versus-subcommand question
# is open on its own merits rather than closed by a runner that could not
# compile.
#
# The caution is still right about the SHAPE of the risk, and it is why the
# probe below MEASURES python3 rather than assuming it, and why the gate step
# FAILS LOUDLY when it is absent instead of skipping. The alternatives were
# worse: re-implementing twelve arms in sh gives up the self-test that found
# five defects in them before a branch was cut, and a `rumor` subcommand is a
# Rust change issue 4 does not ask for. If the probe shows python3 absent, the
# honest fix is that subcommand, not a quietly skipped gate -- and the run says
# so.
#
# A GATE THAT CANNOT RUN IS NOT A GATE THAT PASSED. release-gate.py exits 2 for
# "could not reach a verdict", distinct from 1 for "refused", and this file
# treats 2 as a failure of the run rather than a pass. The same reasoning as
# ci.yml's rc 124: a tool that never answered is a statement about the runner,
# and collapsing it into either verdict is how a broken gate reads as a green
# one.
#
# NO actions/checkout, for ci.yml's reason: it is a JavaScript action needing
# node on the runner, and git is the narrower dependency. The gate needs BOTH
# the PR head and `main`, so the clone is not shallow-single-branch -- a
# --depth 1 clone of one ref cannot compute a merge-base and every arm depends
# on one.

name: release-gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  freebsd:
    runs-on: freebsd-15-jail
    # The backstop, above the sum of the per-step bounds so a step's own
    # timeout fires first and names which step hung.
    timeout-minutes: 30
    steps:
      - name: probe the runner (non-fatal; names what is absent)
        run: |
          # pipefail: without it a pipeline reports its LAST stage's status, so a
          # failing gate piped to a formatter exits 0 and this step goes GREEN.
          set -o pipefail
          # THE LINES BELOW ARE A CENSUS, NOT A PROOF, and are deliberately
          # left as bare substitutions. They are not labeled PROOF and assert
          # nothing: a blank `uname` degrades the record without claiming
          # anything false, which is the distinction the swept sites failed.
          # The `command -v` line is the pattern to copy -- its status is
          # consumed into FOUND/ABSENT branches rather than discarded.
          # Interpolations inside REFUSAL branches elsewhere in this file are
          # also left alone: an empty one is itself information, and the step is
          # already exiting non-zero.
          echo "uname   $(uname -a)"
          echo "whoami  $(whoami)"
          # `go go126 go125` REPLACE `cargo`, WHICH THIS PROJECT NO LONGER
          # BUILDS WITH. The census was still naming the Rust toolchain and not
          # the Go one, while release-gate.py's run_doc_blocks arm executes
          # docs/cli.md's sample -- which invokes Go. So the one job that needs
          # a Go toolchain was the one job whose record could not say whether it
          # had one, and rook's missing `go` had to be diagnosed by hand (/749).
          for t in git python3 python go go126 go125; do
            p=$(command -v "$t" 2>/dev/null) && echo "$t  FOUND  $p" || echo "$t  ABSENT"
          done
          timeout 20 python3 --version 2>/dev/null || echo "python3: none or did not answer in 20s"
          timeout 20 git --version 2>/dev/null || echo "git: none or did not answer in 20s"

      - name: fetch the tree and main, with git
        run: |
          set -o pipefail
          rm -rf src-tree
          rc=0
          # NOT --depth 1 and NOT --single-branch: the gate computes a
          # merge-base against main, and a shallow single-ref clone has no main
          # to compute it against. Every arm rests on that merge-base.
          timeout 300 git clone --quiet \
            https://forge.axonibyte.com/axonibyte/rumor.git src-tree || rc=$?
          test "$rc" -eq 124 && { echo "HANG: git clone exceeded 300s. rc 124 proves only that 300s elapsed -- a clone finishing at 301s gives this same status, so this is not a reachability diagnosis. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "git clone exited $rc"; exit "$rc"; }
          cd src-tree
          rc=0
          # THE PR NUMBER, INDEPENDENT OF HOW THE REF IS SPELLED (fable
          # rumor/386). This forge spelled the same AGit PR three ways in one
          # run: GITHUB_REF_NAME=8, GITHUB_HEAD_REF=refs/pull/8/head, and the PR
          # page calls it #8. A branch PR spells them differently again. So the
          # number is extracted as digits rather than assumed to be bare, which
          # accepts "8", "refs/pull/8/head" and "#8" alike -- and is REFUSED when
          # it comes out empty, because a pull_request run with no PR number has
          # no head to fetch and must not quietly gate the default branch, which
          # is the defect this whole commit is about.
          PRREF="${GITHUB_REF:-${GITHUB_REF_NAME:-}}"
          PRNUM=$(printf '%s' "$PRREF" | tr -dc '0-9')
          test -n "$PRNUM" || { echo "could not derive a PR number from GITHUB_REF='${GITHUB_REF:-}' / GITHUB_REF_NAME='${GITHUB_REF_NAME:-}', so there is no PR head to fetch"; exit 1; }
          echo "PROOF PR number $PRNUM from '$PRREF'"
          timeout 120 git fetch --quiet origin "+refs/pull/${PRNUM}/head:refs/pr-head" || rc=$?
          # AND THEN CHECK IT OUT, WHICH THIS STEP DID NOT DO. Measured on the
          # first pull_request run this forge ever executed (PR 8, task 143): the
          # fetch SUCCEEDED, refs/pr-head existed, and nothing checked it out --
          # so HEAD stayed on the clone's default branch and the log read
          #
          #     PROOF clone head 5e8a6392c4c612b72fc2006b070a7e3513af3158
          #     PROOF origin/main 5e8a6392c4c612b72fc2006b070a7e3513af3158
          #
          # identical shas, main against main. The gate then could not find
          # tools/release-gate.py, because main does not carry it, and the job
          # failed with "self-test FAILED" one second in. It was gating the WRONG
          # TREE, and only the gate's absence from main made that visible: had
          # the file been there, the run would have gated main against main and
          # reported a clean PR. That is the always-pass shape, reached by
          # omission rather than by a bad arm.
          if [ "$rc" -eq 0 ]; then
            timeout 60 git checkout -q --detach refs/pr-head \
              || { echo "fetched refs/pull/${PRNUM}/head but could not check it out"; exit 1; }
          else
            echo "no refs/pull head for PR ${PRNUM}; falling back to the event sha"
            test -n "${GITHUB_SHA:-}" \
              || { echo "no refs/pull head AND no GITHUB_SHA: there is no tree to gate"; exit 1; }
            timeout 60 git checkout -q --detach "$GITHUB_SHA" \
              || { echo "could not check out GITHUB_SHA $GITHUB_SHA"; exit 1; }
          fi
          # THE GATE CANNOT JUDGE A TREE THAT DOES NOT CARRY IT. This is the
          # assertion that would have caught the above in one line, so it is here
          # rather than in a comment: if the checked-out tree has no
          # tools/release-gate.py, the checkout is not the run.
          test -f tools/release-gate.py \
            || { echo "the checked-out tree has no tools/release-gate.py, so it is not the run this PR proposes -- refusing rather than gating the wrong tree"; exit 1; }
          # THESE TWO LINES ARE THE ONLY RECORD OF WHICH COMMITS THE GATE
          # JUDGED (ibis thread:r0.3/36), and they were interpolated command
          # substitutions with nothing asserting them, so a failed rev-parse
          # printed "PROOF clone head " and the run carried on to judge something
          # it could not name -- a verdict with no subject, which is the one
          # thing a gate's output must never be. The fetch above is allowed to
          # fail and fall back, which is exactly the path that makes this
          # reachable.
          #
          # NO SHELL OPTION CATCHES THIS, and the first version of this comment
          # said "there is no `set -e` here", which names a remedy that does not
          # work and would have sent the next reader to add one. A substitution's
          # status inside an ARGUMENT is discarded before the shell can act on
          # it. Measured on this box, /bin/sh and bash alike (ibis
          # thread:r0.3/40):
          #
          #     set -eo pipefail; echo "PROOF head $(false)"
          #     -> prints "PROOF head ", rc 0, and the next line still runs
          #
          # So assign-assert-print is not a verbose substitute for a shell
          # option. It is the only form that works.
          HEADSHA=$(timeout 30 git rev-parse HEAD) || HEADSHA=""
          test -n "$HEADSHA" || { echo "could not read the clone's HEAD, so this run cannot record WHICH commit it judged. A verdict without a subject is not a verdict."; exit 1; }
          MAINSHA=$(timeout 30 git rev-parse origin/main) || MAINSHA=""
          test -n "$MAINSHA" || { echo "could not read origin/main, which every arm's merge-base rests on."; exit 1; }
          echo "PROOF clone head $HEADSHA"
          echo "PROOF origin/main $MAINSHA"

      - name: python3 is present, or the gate cannot run
        run: |
          set -o pipefail
          rc=0
          timeout 20 python3 --version > ../py.log 2>&1 || rc=$?
          cat ../py.log
          test "$rc" -eq 124 && { echo "HANG: python3 --version exceeded 20s. RUNNER finding."; exit 124; }
          test "$rc" -eq 0 || { echo "python3 is ABSENT on this runner, so the release gate CANNOT RUN. This is NOT a pass: twelve refusal arms went unmeasured. The fix is a rumor subcommand, not a skipped step -- see this file's header."; exit 1; }
          # THE PROOF READS THE RUN THAT WAS CHECKED, not a second one. This
          # line used to invoke python3 AGAIN to interpolate its version, so the
          # rc assertion above covered one execution and the evidence came from
          # a different one -- ibis thread:r0.3/36 separates this as a weaker
          # class than a wrong proof, and it is: the CLAIM is pinned, only the
          # DATA was unasserted. It is still worth closing, because WHICH python3
          # ran is the whole substance of this step, and a second invocation on a
          # box with two interpreters on PATH can answer differently from the one
          # that passed.
          PYVER=""
          read -r PYVER < ../py.log || true
          test -n "$PYVER" || { echo "python3 --version exited 0 and printed nothing, so WHICH python3 ran is unrecorded and this step proves only that something exited 0."; exit 1; }
          echo "PROOF python3 $PYVER"

      - name: the gate's own self-test, before it judges anything
        run: |
          set -o pipefail
          cd src-tree
          # THE GATE IS CHECKED BEFORE IT IS TRUSTED, which is the half a run on
          # the subject alone cannot give. Twelve cases, each asserting its arm
          # fires ALONE; a gate whose arms have stopped discriminating would
          # otherwise refuse or admit a PR with nobody the wiser.
          rc=0
          timeout 300 python3 tools/release-gate.py --self-test > ../self.log 2>&1 || rc=$?
          cat ../self.log
          test "$rc" -eq 124 && { echo "HANG: the gate's self-test exceeded 300s. RUNNER finding; the gate was NOT checked."; exit 124; }
          test "$rc" -eq 0 || { echo "the gate's own self-test FAILED, so its verdict on this PR means nothing"; exit "$rc"; }
          # BOTH COUNTS ARE PINNED, AND THIS IS THE SECOND VANTAGE RATHER THAN
          # THE MECHANISM. The gate declares EXPECT_CASES and
          # EXPECT_TRAILER_CHECKS and asserts its own counts against them in
          # both directions, so a case that stops running fails there first
          # (ibis thread:r0.3/25, rook /26). What that assertion CANNOT catch is
          # an edit that removes a case and lowers the declaration to match: the
          # gate then agrees with itself. This literal is in a different file,
          # so that edit has to be made twice to pass, and the second edit is
          # the one a reviewer sees.
          #
          # `0 failed` alone is not enough: it passes a self-consistent `N of N`
          # for any N, including 0.
          #
          # WHY 14 WAS WRONG, not merely what 16 is: G1 added two self-test
          # cases driving the VERSION gate -- a malformed version file, and a
          # mapped version file that is still exempt -- taking the declaration
          # from 14 to 16, and this literal was not raised with them. It also
          # gained a third counter, the seven-shape docs-verdict battery, which
          # prints BETWEEN the trailer checks and `0 failed`, so the old string
          # could not match even with the right numbers. The line did exactly
          # what its comment promises: a declared count moved and the literal in
          # the other file refused. The defect was mine for moving one and not
          # the other, and it surfaced as PR 36's required check (task 179).
          #
          # AND IT CAUGHT THE SAME DEFECT AGAIN, from the same hand, at 16 -> 19:
          # the release-boundary rule added three cases -- an earlier bump's
          # trailer must not lend, this run's own bump trailer must still exempt,
          # and the accepted-release control -- and the declaration moved while
          # this literal did not. It surfaced as PR 58's required check (task
          # 264) with every other arm green. Twice is a pattern rather than a
          # slip: raising EXPECT_CASES is one edit of three, and the other two
          # are this grep and the count written out in
          # docs/testing-methodology.md's "Self-test the oracle".
          grep -q '20 of 20 cases ok, 15 of 15 trailer checks ok, 7 of 7 docs-verdict checks ok, 0 failed' ../self.log \
            || { echo "the self-test did not report 20 of 20 cases, 15 of 15 trailer checks and 7 of 7 docs-verdict checks: a case did not run, or the gate's declared counts were changed without this literal"; exit 1; }
          # THIS PROOF IS NOT A SECOND COPY OF THE ASSERTION ABOVE. The grep
          # above pins the NUMBERS; this one pins the SHAPE and displays what
          # actually ran, with a pattern deliberately not coupled to the
          # literal. It earns its place only because it is asserted non-empty:
          # with `|| true` and no test, a summary whose FORMAT changed matched
          # nothing and the step printed a bare "PROOF " and stayed green.
          # That is not hypothetical -- it happened here, when the summary grew
          # the trailer-check tally and this pattern stopped matching. A check
          # whose status is discarded is not a check (rook thread:r0.3/29).
          #
          # IT HAS NOW HAPPENED TWICE, which is why this pattern no longer
          # ENUMERATES the counters. G1 added a third tally, the docs-verdict
          # battery, and this line broke exactly as the paragraph above records
          # it breaking for the second one -- PR 37's check, task 181. A pattern
          # that lists the counters by name has to be edited every time one is
          # added, and the edit is invisible until a run fails.
          #
          # So the shape is now "cases, then ONE OR MORE `N of N <name> checks
          # ok` tallies, then `N failed`". That is the actual invariant of the
          # summary line. It does not weaken the step: the NUMBERS are pinned by
          # the literal above, in another file, and what this one owes is proof
          # that the summary still has the shape it is read with -- plus the
          # display of what ran. A fourth tally will now be shown rather than
          # silently dropping this to a bare "PROOF ".
          #
          # Extracted by redirect, not `| head`: an early-closing consumer
          # SIGPIPEs the producer to 141, which under pipefail fails a step that
          # succeeded. The scratch file lives outside the checkout.
          grep -oE '[0-9]+ of [0-9]+ cases ok,( [0-9]+ of [0-9]+ [a-z-]+ checks ok,)+ [0-9]+ failed' \
            ../self.log > ../proof.txt || true
          PROOF=""
          read -r PROOF < ../proof.txt || true
          test -n "$PROOF" || { echo "the self-test summary did not match the expected SHAPE, so this step cannot show what it ran: the gate's summary format and this pattern have diverged"; exit 1; }
          echo "PROOF $PROOF"

      - name: gate this run against main
        run: |
          set -o pipefail
          cd src-tree
          HEAD_SHA="${GITHUB_SHA:-HEAD}"
          rc=0
          timeout 600 python3 tools/release-gate.py \
            --base origin/main --head "$HEAD_SHA" --ids-to ../gate-ids.txt > ../gate.log 2>&1 || rc=$?
          cat ../gate.log
          test "$rc" -eq 124 && { echo "HANG: the release gate exceeded 600s. RUNNER finding; the gate did NOT reach a verdict and this is not a pass."; exit 124; }
          test "$rc" -eq 2 && { echo "the gate CANNOT RUN on this input, which is neither a pass nor a refusal -- read the reason above"; exit 1; }
          test "$rc" -eq 1 && { echo "the release gate REFUSED this run, naming each reason above"; exit 1; }
          test "$rc" -eq 0 || { echo "the gate exited $rc, which is not one of its three statuses"; exit 1; }
          grep -q 'PROOF the release gate found nothing' ../gate.log \
            || { echo "the gate exited 0 without its own clean line: it did not run to completion"; exit 1; }
          echo "PROOF the release gate admitted this run with every arm measured"

      - name: a fixture branch must name its arm AND NO OTHER
        if: always()
        run: |
          set -o pipefail
          # IBIS r0.3/8: the step above runs the gate PLAIN, so a fixture PR goes
          # red and NOTHING asserts "and no other reason" -- two arms firing give
          # the same red as one. The mechanism was in the gate and the workflow
          # never called it. `--expect` alone cannot fix it either: it exits 0 on a
          # match, so a correctly-refused fixture would go GREEN and contradict the
          # same Test's first half. So: plain above for the red, and the SET
          # asserted here. Red either way, and the step names which kind of red.
          #
          # THE ARM IS DECLARED BY THE BRANCH NAME, r0.3-fix-<arm-id>, which is the
          # convention docs/release.md states. Deriving it from the ref rather than
          # from a file in the branch means the declaration and the branch cannot
          # drift apart.
          BR="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          # A RE-CUT KEEPS ITS ARM. A pushed branch is never rewritten here, it is
          # re-cut under a new name -- which in practice means a `-2` suffix, as
          # r0.2-ci-2 was. So a trailing -<digits> is stripped before the arm is
          # read, or the room's own remedy for a pushed branch would silently
          # turn the declaration into a name no arm matches. Found by naming a
          # re-cut rather than by reading this back.
          case "$BR" in
            r0.3-fix-*) WANT="${BR#r0.3-fix-}"; WANT="$(printf '%s' "$WANT" | sed -E 's/-[0-9]+$//')" ;;
            *) echo "not a fixture branch ($BR): the gate's own verdict above stands and there is no declared arm to compare"; exit 0 ;;
          esac
          # ROOK r0.3/9: compare the gate's MACHINE-READABLE id list, never its
          # human log. A second oracle that greps the first's prose shares a
          # corpus with it, and a finding whose TEXT quoted an id would be read
          # as a finding. Both scratch files live OUTSIDE the checkout, because
          # the docs walk exempts only .git and target and any untracked file in
          # the tree fails `docs --check` -- rook's own third hazard, r0.3/0.
          test -f ../gate-ids.txt || { echo "no gate-ids.txt: the gate step did not run, so its finding set cannot be checked"; exit 1; }
          echo "declared arm: ${WANT}"
          echo "findings:"; cat ../gate-ids.txt
          printf '%s\n' "$WANT" > ../want-ids.txt
          cmp -s ../gate-ids.txt ../want-ids.txt \
            || { echo "FIXTURE DOES NOT ISOLATE ITS ARM: branch ${BR} declares ${WANT} and the gate found $(tr '\n' ' ' < ../gate-ids.txt). Issue 4 requires the reason it names AND NO OTHER -- a fixture tripping two arms shows neither."; exit 1; }
          echo "PROOF the fixture tripped exactly [${WANT}] and no other arm"
          # AND THE RED IS STILL REQUIRED. A fixture whose gate run went GREEN has
          # not shown a refusal at all, which is the Test's first half.
          grep -q "^REFUSED \[${WANT}\]" gate.log \
            || { echo "the gate did not refuse ${WANT} at all, so this fixture shows nothing"; exit 1; }
          echo "PROOF the gate was RED for ${WANT}, which is the half a passing expectation would hide"
