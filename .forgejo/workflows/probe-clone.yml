# probe-clone -- fails iff `git clone` over HTTPS does not work on the runner.
#
# probe-net proved the runner reaches the forge with CURL. It says nothing about
# git-over-HTTPS, which needs git's own TLS and CA trust -- a different thing,
# and ci.yml's step 2 depends on it. Narrowing by one bit rather than guessing
# which of step 1 or step 2 killed run 9.
#
# Instrument, not a test. Comes out with the others.

name: probe-clone

on:
  push:
    branches:
      - r0.2-ci
  workflow_dispatch:

jobs:
  freebsd:
    runs-on: freebsd-15-jail
    steps:
      - name: git clone over https
        run: |
          rm -rf probe-tree
          git clone --quiet --depth 1 https://forge.axonibyte.com/axonibyte/rumor.git probe-tree
          test -f probe-tree/Cargo.toml
