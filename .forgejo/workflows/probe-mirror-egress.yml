# probe-mirror-egress -- can this runner reach the FreeBSD package mirror?
#
# ratchet's design, r0.2/7, adopted verbatim including the bound. It replaces my
# probe-pkg, which asked the same question with three unbounded `pkg` calls and
# wedged the runner for 17+ minutes doing it.
#
# THE QUESTION IT SETTLES, and it is a fork in R0.2's road:
#   green  the runner reaches the mirror, so ratchet r0.2/4's compiler-free route
#          to the licence gate (devel/cargo-deny at 0.20.2_2, the exact version
#          deny.toml pins) is blocked only by PRIVILEGE, which cal can grant
#   red    no egress, and that route is dead -- the licence gate then waits on
#          cal's toolchain fix with the other four steps
#
# WHY NOT `pkg` AT ALL: `pkg rquery` and `pkg install -n` both need the remote
# catalogue and both can block for many minutes with no route out, which is the
# leading hypothesis for what hung run 97. ratchet measured the contrast from
# their own jail: there, mirror egress WORKS and pkg refuses instantly and
# readably with `mkdir(/var/db/pkg): Permission denied` -- rc, not a timeout. A
# refusal is readable; a hang is not. This probe asks only the egress half, with
# one request that cannot outlive its own ceiling.
#
# `-m 10` IS THE WHOLE POINT and it is curl's ceiling on the ENTIRE operation,
# not --connect-timeout, which bounds only the handshake and would let a stalled
# transfer hang exactly as before. tools/check-workflow-bounds.py has an arm
# asserting that distinction.
#
# Instrument, not a test. Comes out in the commit that reads it -- which is what
# the thirteen probes it replaces also said, and they came out as promised.

name: probe-mirror-egress

# PUSH-TRIGGERED, not dispatch-only, and that is a capability decision rather
# than a convenience. A dispatch needs an API call I have never successfully
# made -- this token is scoped `write:repository`, `/api/v1/user` answers 403,
# and run logs are 404 -- so a dispatch-only instrument answers its question
# only if someone else happens to press a button. It is bounded at 2 minutes and
# cannot wedge the runner, so the cost of it running on each push to this branch
# is one short run, and it comes out in the commit that reads it anyway.
on:
  push:
    branches:
      - r0.2-ci
  workflow_dispatch:

jobs:
  freebsd:
    runs-on: freebsd-15-jail
    timeout-minutes: 2
    steps:
      - name: can the runner reach pkg.FreeBSD.org (no catalogue, no mutation)
        run: |
          # pipefail: without it a pipeline reports its LAST stage's status, so a
          # failing gate piped to a formatter exits 0 and this step goes GREEN.
          # ratchet r0.2/12; driven locally -- a gate exiting 4 piped to `tail -5`
          # continues and exits 0, and exits 4 with this line present.
          set -o pipefail
          # `|| rc=$?` and NOT `; rc=$?`: under the runner's `bash -e` a failing
          # curl aborts the step before a bare capture on the next line can run,
          # so the red/green discrimination below would be dead code. Measured,
          # not assumed -- see the comment block in ci.yml.
          rc=0
          curl -sf -m 10 -o /dev/null \
            https://pkg.FreeBSD.org/FreeBSD:15:amd64/latest/meta.conf || rc=$?
          test "$rc" -eq 0 \
            && echo "PROOF mirror reachable: meta.conf fetched inside 10s" \
            || echo "mirror NOT reachable: curl exited $rc (28 = its own timeout)"
          exit "$rc"
