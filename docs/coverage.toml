# Doc coverage map.
#
# Every path in the workspace must match at least one entry, and `rumor docs
# --check` fails naming the first path that does not. An entry maps a path
# glob to the documents that describe those paths: `*` matches within one path
# segment and `**` matches zero or more whole segments.
#
# The parser is deliberately strict. Any line it does not recognise is an
# error rather than a skip, because a lenient reader of this file would turn a
# typo into silent uncovered source.

[[entry]]
path = ".gitignore"
docs = ["docs/release.md"]

[[entry]]
path = "LICENSE"
docs = ["README.md"]

[[entry]]
path = "README.md"
docs = ["README.md"]

[[entry]]
path = "CHANGELOG.md"
docs = ["docs/release.md"]

[[entry]]
path = "docs/*.md"
docs = ["docs/release.md"]

[[entry]]
path = "docs/adr/*.md"
docs = ["docs/adr/README.md"]

[[entry]]
path = "docs/coverage.toml"
docs = ["docs/release.md"]

[[entry]]
# The three worked examples: statutes, the cases that fix their verdicts, and
# the mutants that prove each clause matters. Mapped to the testing methodology
# because what they establish is a METHOD -- every mutant red, every case green
# -- and to the vocabulary because the words they exercise (claim, told,
# planted, the four findings) are defined there. Carried from r1.2-examples byte
# for byte; this mapping is its own, unchanged.
path = "examples/**"
docs = ["docs/testing-methodology.md", "docs/vocabulary.md"]

[[entry]]
# The harness that walks examples/ and refuses a surviving mutant, and the
# licence gate over the built dependency surface. Both are tests rather than
# tools, which is why they answer for the methodology rather than the CLI.
path = "tests/statute/*.go"
docs = ["docs/testing-methodology.md"]

[[entry]]
# The ledger fixtures' check: design.md owns why the example cases become
# ledgers with RE-ASSIGNED positions, and the methodology owns why this test
# reads the committed file against the case instead of rebuilding it -- a
# validator that reconstructs its subject agrees with itself.
path = "tests/ledger/*.go"
docs = ["docs/design.md", "docs/testing-methodology.md"]

[[entry]]
# The harness that drives the three packages THROUGH the engine from R2.1's
# ledger files and requires the result to equal the bare statute tests' --
# including which case kills each mutant. Mapped to the testing methodology
# because what it establishes is a METHOD (two paths, no shared evaluator, and
# the three mutants that go equivalent once the bound is structural) and to the
# vocabulary because the words it exercises -- the four findings, the sealed
# prefix, `planted` -- are defined there.
path = "tests/engine/*.go"
docs = ["docs/testing-methodology.md", "docs/vocabulary.md"]

[[entry]]
# The quote oracle. Mapped to the vocabulary because that is the document it
# reads and holds this tree's comments to, and to the testing methodology
# because what it establishes is a METHOD -- a comment quoting a document is a
# claim about that document, and claims about things that move need a check.
path = "tests/vocabulary/*.go"
docs = ["docs/vocabulary.md", "docs/testing-methodology.md"]

[[entry]]
# The `run` block oracle. Mapped to cli.md because that is the page whose
# blocks it reads, to release.md because the gate that EXECUTES those blocks
# is release.md's, and to the testing methodology because the method is the
# general one: a doc fence marked `run` is executable code that no suite was
# reading, so it drifted from the toolchain discipline every workflow keeps.
path = "tests/docs/*.go"
docs = ["docs/cli.md", "docs/release.md", "docs/testing-methodology.md"]

[[entry]]
# D14 and applicability over the committed corpus (R5.1). Mapped to design.md
# because the precondition input's shape is stated in its evaluation section
# (fable, coop r5/16), and to the testing methodology because the ARM's own
# reach is the transferable part: it drives the shape that was ruled out and
# requires it to disagree, so the agreement it asserts cannot be a tautology.
path = "tests/schedule/*.go"
docs = ["docs/design.md", "docs/testing-methodology.md"]

[[entry]]
# The run's only source of chance (R5.1). Mapped to design.md because "The
# engine owns the seed" IS this package's prose -- one generator the walk
# holds, the seed printed first and accepted back, and nothing else in the
# system drawing randomness -- and that section is what R5 amends with what it
# measures. No cli.md entry yet: the package has no verb, and the verb is a
# thread decision rather than something to settle in a coverage table.
path = "internal/schedule/*.go"
docs = ["docs/design.md"]

[[entry]]
# THE STAGE DISPATCHER'S VOCABULARY (R8.1, issue 108). Mapped to contract.md
# because the stage NAMES are that document's -- `[stages.<name>]` is its
# schema row and this package is what refuses a name outside the set -- and to
# design.md because "which stage the walk IS" is a design reading rather than a
# schema rule. No cli.md entry: the dispatch prints nothing on either stream
# (fable rumor/1474), so there is no surface for that document to describe.
path = "internal/stage/*.go"
docs = ["docs/contract.md", "docs/design.md"]

[[entry]]
# The fan-out: two or more requests in flight against ONE system, which is the
# only way a check-then-act defect can be reached. Mapped to design.md because
# what it carries is a reading about the SHAPE of a concurrent attempt -- N
# sessions and not N outstanding requests on one, and N adapter processes that
# must be pointed at one world or they contend on nothing -- and both halves are
# consequences of decisions design.md and the wire contract already made. No
# contract.md entry: this package declares no schema and adds no wire request;
# it uses `[adapter].env` and TOY_ADDR exactly as they are already specified.
path = "internal/concurrency/*.go"
docs = ["docs/design.md"]

[[entry]]
# THE HOSTILE CORPUS (R8.1, issue 108). Mapped to design.md alone, and the
# reason is that this package DECLARES NOTHING: it reads `[[action.args]]`'s
# `source`, `from`, `of` and `value`, all of which contract.md already
# specifies, and turns them into cases. What is new is a design decision --
# the corpus is derived rather than written, and its classes are bounded by
# what a refusal can NAME -- so design.md is where that prose belongs. No
# cli.md entry: the stage's verb is 108's and lands with the dispatch, not
# with the derivation.
path = "internal/fuzz/*.go"
docs = ["docs/design.md"]

[[entry]]
# THE SETUP ORDER, SHARED BY TWO STAGES (R8.2, issue 109). It was
# internal/fuzz/setup.go through 108, where the hostile corpus was its only
# caller; the concurrency stage needs the same order for its own reason -- a
# fan-out cannot contend an event nothing created -- so it moved rather than
# being copied. Mapped to design.md for the fuzz entry's reason one step on:
# the fields it reads (`creates`, and an argument's `source` and `of`) are
# contract.md's already, and what is new is the decision that a stage's setup
# is DERIVED from them rather than written per project.
path = "internal/setup/*.go"
docs = ["docs/design.md"]

[[entry]]
# THE PROBER (R6.2, issue 90). It fills internal/schedule's `Prober` slot, which
# was declared at R6.1 with nothing implementing it. Mapped to contract.md
# because the probe's declaration and the `direct` observation it rides are that
# document's, and to design.md because "full reconciliation only after quiesce"
# is a design sentence rather than a contract one. NO cli.md entry: this package
# has no verb, and `run` already documents the statuses it spends.
path = "internal/quiesce/*.go"
docs = ["docs/contract.md", "docs/design.md"]

[[entry]]
# `rumor validate` itself (R4.3). Mapped to contract.md because that document
# IS this package's prose -- it states what the three declarations must agree
# on, and the exit statuses 0/1/2 including the rule that a decode refusal is
# could-not-run and never refused -- and to cli.md because the verb's surface
# lives there.
path = "internal/validate/*.go"
docs = ["docs/contract.md", "docs/cli.md"]

[[entry]]
# The arm fixtures: the permitted twin copied once per arm, each with exactly
# ONE change. Mapped to contract.md because each change is a key that document
# describes, and to the testing methodology for the method -- deliberately
# BROKEN projects, kept OUT of examples/ so `check` and `attaint` never walk
# them (fable, coop r4/63), and read only by validate's own suite.
path = "tests/validate/fixtures/**"
docs = ["docs/contract.md", "docs/testing-methodology.md"]

[[entry]]
# The arm oracle. Mapped to contract.md for the same reason as the package, and
# to the testing methodology because the METHOD is the transferable part: one
# fixture per arm, each the permitted twin with exactly ONE change, and an
# invariant that each trips its own arm and no other -- a fixture tripping two
# arms shows neither.
path = "tests/validate/*.go"
docs = ["docs/contract.md", "docs/testing-methodology.md"]

[[entry]]
# The shrinker's PAIRING suite: a seeds file written by internal/shrink.Promote,
# read by internal/validate's arm 10b. Mapped to contract.md because the seed
# grammar is that document's ("The seeds file", fixed in R4, which R5 may extend
# and may not contradict), and to the testing methodology because the method is
# the transferable part -- two copies of one schema need a check that reads
# BOTH, so the authority is the arm and never a third reading of the format.
path = "tests/shrink/*.go"
docs = ["docs/contract.md", "docs/testing-methodology.md"]

[[entry]]
# R6.3's walk-level quiesce arms: the bound a project declares has an effect on
# a WALK, which is the path the product runs. Mapped to the VOCABULARY because
# `pending` and `stale` are its definitions and this is where they are driven
# end to end, and to the design because the walk's shape is design.md's.
#
# IT IS A SUITE OF ITS OWN FOR THE REASON ITS OWN HEADER GIVES: every earlier
# `pending` arm drove engine.Judge on a fixture, and no production path called
# Judge at all (quill, coop r6/80). An arm proving a mechanism the live path
# never reaches is the defect this suite exists to make impossible.
path = "tests/quiesce/**"
docs = ["docs/vocabulary.md", "docs/design.md"]

[[entry]]
# R7.1's walk-level clock arms: a project declaring `[clock]` has the run's own
# time in its ledger at every seal, and one declaring none is walked exactly as
# it was. Mapped to the vocabulary because "Time is a ledger fact" and "wall-
# clock time never enters the ledger" are its sentences, and to the contract
# because the UNIT those facts carry is declared there.
#
# A SUITE OF ITS OWN FOR tests/quiesce's REASON, which is the one this phase
# inherited: clock facts had arms at the ledger tier from R2.3 and nothing in
# production wrote one, so what was armed was a type's behavior and not a run's.
path = "tests/clock/**"
docs = ["docs/vocabulary.md", "docs/contract.md"]

[[entry]]
# The tree-wide hygiene arms: checks no single package can make about itself.
# Mapped to the testing methodology because the transferable part is the
# method -- find a defect class by its SHAPE across the whole tree, and make
# the declared exceptions fail when their subject moves ("A cleanup that cannot
# run reads exactly like a cleanup").
path = "tests/hygiene/*.go"
docs = ["docs/testing-methodology.md"]

[[entry]]
path = "tests/licences/*.go"
docs = ["docs/testing-methodology.md", "docs/release.md"]

[[entry]]
# The lock. It records which version of every module in the licence surface was
# actually built, so release.md owns it the way it owned Cargo.lock.
path = "go.sum"
docs = ["docs/release.md"]

[[entry]]
# The committed version, and the only place it lives. go.mod has no version
# field, so this file is the second of the three sources the release gate and
# the tag pipeline make agree: the tag, this, and the CHANGELOG heading.
path = "VERSION"
docs = ["docs/release.md"]

[[entry]]
# The Go module declaration: the module path and the language version the
# toolchain is held to. design.md for what the binary is, release.md for the
# version source a release reads.
path = "go.mod"
docs = ["docs/design.md", "docs/release.md"]

[[entry]]
# The Go entry point. Mapped exactly as the Rust one was -- cli.md owns the
# command surface, design.md owns why there is one binary.
path = "cmd/rumor/**/*.go"
docs = ["docs/cli.md", "docs/design.md"]

[[entry]]
# The rollback trait and its registry (R5.2's C3). rollback.md owns the
# interface and what Verify has to prove; design.md owns why a shrink step runs
# on a verified clean world at all.
path = "internal/rollback/*.go"
docs = ["docs/rollback.md", "docs/design.md"]

[[entry]]
# The shrinker (R5.3). design.md owns the sequence -- replay the whole failure
# once on a verified clean world, mark the seed unstable if it does not come
# back, then bisect -- and rollback.md owns what Verify has to prove, which is
# the step this package refuses to skip.
path = "internal/shrink/*.go"
docs = ["docs/design.md", "docs/rollback.md"]

[[entry]]
# The one shipped provider: it restarts cmd/toy and makes the state file
# authoritative. Mapped to rollback.md's "Shipped providers" and to
# testing-methodology.md for the corpse case -- a verify that checked only the
# bytes would pass over a dead application.
path = "internal/rollback/toyrestart/*.go"
docs = ["docs/rollback.md", "docs/testing-methodology.md"]

[[entry]]
# The toy system under test (R5.2). NOT cli.md: this is not part of rumor's
# command surface -- it is the application the engine is proven against, and a
# reader looking for what `rumor` does should not find it here. design.md owns
# what the toy is and why it is a process, and testing-methodology.md owns the
# ledger bugs it carries deliberately.
path = "cmd/toy/**/*.go"
docs = ["docs/design.md", "docs/testing-methodology.md"]

[[entry]]
# The toy's adapter: it speaks R4's wire contract on stdio and drives the toy
# over HTTP, so contract.md owns the protocol half and design.md the process
# half. Also not a rumor subcommand, for the reason above.
path = "cmd/toy-adapter/**/*.go"
docs = ["docs/contract.md", "docs/design.md"]

[[entry]]
# `internal/coverage` IS the `docs --check` command, so cli.md describes it and
# design.md says why the check exists. The other internal packages are NOT
# mapped here, and that is the correction: a single `internal/**/*.go` entry
# pointed every library at the CLI document, so the release gate demanded a
# cli.md edit for a package that adds no command (rook, v0.1.9). A mapping that
# names the wrong document is worse than a missing one -- it gets satisfied by
# writing something untrue in the file it names.
path = "internal/coverage/*.go"
docs = ["docs/cli.md", "docs/design.md"]

[[entry]]
# The example walk behind `rumor check`: cli.md owns the command surface it
# answers for -- which is why this package, unlike the other libraries, does
# name cli.md -- and design.md owns why the claim is runnable from the binary
# rather than only from the suite.
path = "internal/examples/*.go"
docs = ["docs/cli.md", "docs/design.md"]

[[entry]]
# Flattening: design.md owns why `known(actor, claim_ref)` is computed outside
# Rego, and the testing methodology owns the part about driving it -- the untold
# claim read off the real fixture, and the mutation that found the hole where a
# tell carried the teller's knowledge. No CLI surface, so no cli.md.
path = "internal/flatten/*.go"
docs = ["docs/design.md", "docs/testing-methodology.md"]

[[entry]]
# The ledger store: design.md owns why positions are assigned by the store and
# what sealing buys, and the vocabulary owns the four fact kinds and the
# position rule, which this package's Validate duplicates DELIBERATELY so the
# two have to agree -- the same reasoning as internal/handle below. No CLI
# surface yet, so no cli.md.
path = "internal/ledger/*.go"
docs = ["docs/design.md", "docs/vocabulary.md"]

[[entry]]
# The evaluator: design.md owns why a finding carries the rule definition that
# produced it and its retained trace, and the testing methodology owns the part
# worth saying about the adapter -- that it is driven off the committed ledger
# fixtures rather than off inputs the test built, and that one of its mutants is
# equivalent rather than surviving. No CLI surface of its own; the subcommand
# that drives it is cmd/rumor.
path = "internal/attaint/*.go"
docs = ["docs/cli.md", "docs/testing-methodology.md"]

[[entry]]
# The harness that composes a damaged tree and runs fable's drills against it.
path = "tests/attaint/*.go"
docs = ["docs/testing-methodology.md"]

[[entry]]
# The drill fixtures (breakout-r3/0). Each drill directory ALSO carries its own
# README naming the arm it trips and the exact refusal text, which is what the
# gate reads; this entry maps the overlay files to the document that owns the
# method they demonstrate.
path = "tests/attaint/drills/**"
docs = ["docs/testing-methodology.md"]

[[entry]]
# R3's self-test. BOTH documents, because naming one would orphan the other
# reader: docs/cli.md describes the command a person runs, and
# docs/testing-methodology.md owns what the arms MEAN -- the corroboration
# control, the per-rule mutation pass and its dead-mutant half, and the vacuity
# guards. Filing a method under a command's reference is rook's breakout-r2/10
# finding, so it is mapped to both rather than to the nearer one.
path = "internal/engine/*.go"
docs = ["docs/design.md", "docs/testing-methodology.md"]

[[entry]]
# The handle table: design.md owns why it is per attempt and which collision
# v1 names, and the vocabulary owns the handle's form, which this package's
# shape duplicates deliberately so the two must agree.
path = "internal/handle/*.go"
docs = ["docs/design.md", "docs/vocabulary.md"]

[[entry]]
# `rumor run`: the seed printed first and accepted back, and a walk driven end
# to end through the wire client. cli.md owns the command's surface and
# design.md owns what a run IS -- the seeded walk, the weighted draw over
# applicable actions, the sequence over handles.
path = "tests/run/*.go"
docs = ["docs/cli.md", "docs/design.md"]

[[entry]]
# The verb's own walkable project. It is a FIXTURE and not an example: a
# project whose weight table is complete, which examples/twin and examples/toy
# were not on 2026-10-19 (the twin weights publish_doc and not publish_doc_ui;
# the toy weights no nemesis kind), so a verb arm resting on examples/ would
# have waited on arm 19's cell closing that and would then move whenever those
# tables did. design.md describes the walk it exercises; contract.md describes
# the platform and bindings shapes it is written in.
path = "tests/run/fixtures/**"
docs = ["docs/design.md", "docs/contract.md"]

[[entry]]
# The kept session, driven against a real spawned adapter. docs/contract.md's
# transport section is the subject -- it says the wire client spawns the adapter,
# sends describe first and keeps the process for the whole run, and these arms
# are what hold the code to that sentence rather than to Describe's narrower
# one-shot shape. testing-methodology.md comes too: the canned-response adapter
# here exists because the fake's global --fail cannot produce a healthy
# handshake followed by a fault, which is the "where a fixture is the oracle,
# read the fixture first" problem one layer out.
path = "tests/wire/*.go"
docs = ["docs/contract.md", "docs/testing-methodology.md"]

[[entry]]
# The adapter contract in code: the messages, the strict decoder, the contract
# version constant and the three-way version check. docs/contract.md owns the
# protocol itself, and the two are held to each other by tests/contract rather
# than by a reader's memory. No CLI surface, so no cli.md -- the subcommand that
# speaks this protocol is cmd/rumor, which is mapped there already.
path = "internal/wire/*.go"
docs = ["docs/contract.md"]

[[entry]]
# The vocabulary version constant, which docs/vocabulary.md's preamble promised
# to R4's contract. ONE document: this package says nothing about the CLI or the
# design, only which vocabulary the module implements, and the name it is
# spelled with is deliberate -- see the package comment.
path = "internal/vocabulary/*.go"
docs = ["docs/vocabulary.md"]

[[entry]]
# The fake adapter: it speaks the whole protocol against nothing, so R4.3's
# permitted twin has something to validate against and fable's drills have
# something to misbehave for. BOTH documents, and not the nearer one: cli.md
# owns the command and its four flags, which the run block there checks against
# the binary's own usage, and contract.md owns the protocol the answers are on.
path = "internal/fake/*.go"
docs = ["docs/cli.md", "docs/contract.md"]

[[entry]]
# A package's bindings: the actions, observations, claim timings and roles a
# project binds its statute to. contract.md owns the schema, and the testing
# methodology owns the part worth saying about HOW it is read -- that a parser
# must not refuse what `rumor validate` is built to refuse, which is tested here
# as its own property with the battery inverted.
path = "internal/bindings/*.go"
docs = ["docs/contract.md", "docs/testing-methodology.md"]

[[entry]]
# The strict reader both declaration files share: unknown keys are errors, a
# missing required key is named, a wrong type says what it wanted, and every
# refusal carries the key's dotted path. docs/contract.md owns both schemas, so
# it owns the rules for reading them; the first cut had these rules inside
# internal/platform and internal/bindings would have been a copy.
path = "internal/decl/*.go"
docs = ["docs/contract.md"]

[[entry]]
# A project's own declaration: the adapter to spawn, the venire, the stages, the
# weights and the seeds file. docs/contract.md owns the schema, and the strict
# reading lives in this package rather than in a decoder's metadata so that the
# refusals do not change with the TOML reader underneath them. No CLI surface:
# the command that will read it is cmd/rumor, mapped there.
path = "internal/platform/*.go"
docs = ["docs/contract.md"]

[[entry]]
# The agreement oracle: it reads docs/contract.md's field tables and package
# wire's schema and requires one answer. contract.md because that is the
# document it holds the code to, and the testing methodology because what it
# establishes is a METHOD -- two copies of one schema stay equal only under a
# check that reads both, which is tests/vocabulary's argument one document over.
path = "tests/contract/*.go"
docs = ["docs/contract.md", "docs/testing-methodology.md"]

[[entry]]
path = ".forgejo/workflows/*.yml"
docs = ["docs/release.md"]

[[entry]]
# The local workflow checker. Mapped to release.md because what it refuses --
# an unbounded external call, a job with no ceiling, a bare `rc=$?` that cannot
# run under bash -e -- is a property of how this repo RELEASES and gates, not of
# the library.
path = "tools/check-workflows.py"
docs = ["docs/release.md"]

[[entry]]
path = "tools/release-gate.py"
docs = ["docs/release.md", "docs/testing-methodology.md"]

[[entry]]
# The D4 control. Mapped to the testing methodology because what it carries is
# a METHOD -- a release control whose figures are a property of its inputs
# rather than of the tree it is run from -- and to release.md because what it
# decides is whether a tag's behaviour matches the one the phase froze.
#
# IT READS TWO HALVES AGAINST TWO DIFFERENT SUBJECTS, which is the whole reason
# it is one file: the five sha16s are taken against `examples/toy` FROZEN at a
# commit named in the tool, and the five FIELDS are taken against the LIVE
# `examples/toy` at whatever head is being judged. A control re-derived from
# the live tree agrees with whatever that tree became.
path = "tools/d4control.py"
docs = ["docs/testing-methodology.md", "docs/release.md"]

[[entry]]
# The control's own arms. Mapped to the testing methodology because a control
# is an oracle, and an oracle never observed failing is indistinguishable from
# a passing suite: each cell drives the control against captured output with
# exactly one line changed and asserts it REFUSES. One cell was deleted rather
# than kept when its subject turned out unable to fail, and the reason is left
# in place where the cell was.
path = "tools/test_d4control.sh"
docs = ["docs/testing-methodology.md"]

[[entry]]
# The control's fixtures: real captured output, byte for byte, from v0.1.31,
# v0.1.36 and d7ce321, with one line changed per arm cell. Mapped to the
# methodology for the method -- a fixture of INVENTED shape tests the fixture,
# which is why these are captures and not stubs -- and kept out of examples/ so
# `check` and `attaint` never walk them, the same placement rule the validate
# arm fixtures follow.
path = "tools/fixtures/**"
docs = ["docs/testing-methodology.md"]

[[entry]]
# The drill driver. Mapped to the testing methodology because the METHOD is the
# transferable part -- fable designs the drills, the author drives them ONCE
# before the gate does, and driving them found two defects reading them had not
# -- and to contract.md because each drill's condition is a key that document
# describes.
path = "tools/drive-validate-drills.py"
docs = ["docs/testing-methodology.md", "docs/contract.md"]

[[entry]]
# The fixture generator. Mapped to the testing methodology because what it
# protects is a METHOD -- every arm fixture is the permitted twin with exactly
# one change, which hand-maintained copies cannot stay true to: when the twin
# earned its seeds.lock, six fixtures predating that file began tripping a
# second arm and no test noticed. Mapped to contract.md because each change it
# makes is a key that document describes.
path = "tools/make-validate-fixtures.py"
docs = ["docs/testing-methodology.md", "docs/contract.md"]

[[entry]]
# THE TOY'S MUTANTS ARE GENERATED FOR THE SAME REASON ITS FIXTURES' SIBLINGS
# ARE: a hand-cut copy of a moving file is stale from its second edit. Nine of
# the ten had drifted, every one missing a rule the statute had gained, so
# `attaint` credited ONE mutant with eight kills -- seven of them for rules that
# have mutants of their own. Mapped to testing-methodology.md because the
# one-change invariant is a method, and to design.md because the mutants are the
# statute's own rules and that is where they are described.
path = "tools/make-toy-mutants.py"
docs = ["docs/testing-methodology.md", "docs/design.md"]

[[entry]]
# The tag pipeline's verdict on `git verify-tag`. Mapped to release.md because
# what it decides is whether a tag publishes, and to the testing methodology
# because its whole reason for being a file rather than four lines of YAML is
# that a workflow step cannot be driven without pushing a tag.
path = "tools/verify-tag-verdict.sh"
docs = ["docs/release.md", "docs/testing-methodology.md"]

[[entry]]
# govulncheck's verdict. Mapped to release.md because what it decides is
# whether the vulnerability gate passes, blocks or refuses, and to the testing
# methodology because its whole reason for being a file rather than five lines
# of YAML is that a workflow step cannot be driven without pushing -- the same
# reason verify-tag-verdict.sh is one.
path = "tools/govulncheck-verdict.sh"
docs = ["docs/release.md", "docs/testing-methodology.md"]

[[entry]]
# The manifest verdict: what `go mod tidy -diff` said, classified. It is a file
# and not five lines of YAML for the reason govulncheck-verdict.sh is one -- a
# workflow step cannot be driven without pushing -- so it belongs to the
# methodology with that one.
#
# NOT MAPPED TO release.md, AND THE REASON IS EXACTLY THIS WIDE: go.mod and
# go.sum are release.md's (it owns the version sources and what the lock is
# FOR) and neither changed here. What landed is a CI ARM and its battery, which
# is testing-methodology.md's subject. A second mapping would ask release.md to
# change whenever a clause of this reading moves, which says nothing about how
# this repo releases.
path = "tools/gomod-accuracy-verdict.sh"
docs = ["docs/testing-methodology.md"]

[[entry]]
# The driver for the arm's WIRING, as distinct from its reading: it extracts
# ci.yml's step and runs it over four trees, including an unreachable proxy.
# Author-local, like the arm it drives is runner-only.
path = "tools/drive-gomod-accuracy.py"
docs = ["docs/testing-methodology.md"]

[[entry]]
# The publisher: it creates the release for a tag and attaches the three files.
# release.md owns what a release must carry; the testing methodology owns the
# part worth saying about it, which is that its FORGE half cannot be driven
# locally and its battery says so rather than implying coverage it lacks.
path = "tools/forge-release.py"
docs = ["docs/release.md", "docs/testing-methodology.md"]

