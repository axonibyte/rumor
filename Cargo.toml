[workspace]
members = ["crates/rumor-cli"]
# Test 3's fixture carries a GPL dependency on purpose. Excluded so it stays
# out of the shipped licence graph; the clean half of Test 3 is what proves
# this exclusion holds.
exclude = ["tests/fixtures/deny-gpl"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "BSD-2-Clause"
repository = "https://forge.axonibyte.com/axonibyte/rumor"
